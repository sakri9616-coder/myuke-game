# タグ push で Windows 版をビルド・署名・公開する (sakuri 決定 2026-10-26, Route A)。
# ローカル手順 desktop/resync-rebuild.sh の CI 版: 入口チェック (ノート存在・
# 版数一致) → game/index.html を desktop/dist へ同期 → Tauri NSIS ビルド
# (署名は Actions secrets の TAURI_SIGNING_PRIVATE_KEY / _PASSWORD) →
# latest.json 生成 (resync-rebuild.sh と同一形式) → gh release create。
# workflow_dispatch では下書きリリースで試験できる (既定は下書き)。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版数 (例: 2.4.8)"
        required: true
      draft:
        description: "下書きリリースにする"
        type: boolean
        default: true
      build_only:
        description: "ビルドと latest.json 生成だけ (リリースを作らない試験用)"
        type: boolean
        default: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 版数の決定と入口チェック
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="${{ inputs.version }}"
          fi
          echo "VER=$VER" >> "$GITHUB_ENV"
          test -f "release-notes/v${VER}.md" || { echo "RELEASE_NOTES_MISSING: release-notes/v${VER}.md"; exit 1; }
          CONF_VER=$(python -c "import json;print(json.load(open('desktop/src-tauri/tauri.conf.json'))['version'])")
          [ "$CONF_VER" = "$VER" ] || { echo "VERSION_MISMATCH: tauri.conf=$CONF_VER target=$VER"; exit 1; }
          GAME_VER=$(python -c "import re;print(re.search(r'const GAME_VERSION = \"v?([^\"]+)\"', open('game/index.html', encoding='utf-8').read()).group(1))")
          [ "$GAME_VER" = "$VER" ] || { echo "GAME_VERSION_MISMATCH: game=$GAME_VER target=$VER"; exit 1; }
          echo "ENTRY_CHECKS_OK: $VER"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: フロントエンド同期
        shell: bash
        run: cp game/index.html desktop/dist/index.html

      - name: Tauri ビルド (NSIS, 署名あり)
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build -b nsis

      - name: ステージと latest.json 生成
        shell: bash
        run: |
          mkdir -p stage
          EXE=$(ls desktop/src-tauri/target/release/bundle/nsis/*_x64-setup.exe | head -1)
          test -n "$EXE" && test -f "${EXE}.sig" || { echo "UPDATER_ARTIFACT_MISSING"; exit 1; }
          cp "$EXE" "stage/myuke-setup-${VER}-x64.exe"
          UPD_URL="https://github.com/sakri9616-coder/myuke-game/releases/download/v${VER}/myuke-setup-${VER}-x64.exe" \
          UPD_SIG_CONTENT="$(cat "${EXE}.sig")" UPD_NOTES="$(cat "release-notes/v${VER}.md")" VER="$VER" python - <<'PYEOF'
          import json, os, datetime
          data = {
            "version": os.environ["VER"],
            "notes": os.environ["UPD_NOTES"],
            "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
            "platforms": {
              "windows-x86_64": {
                "signature": os.environ["UPD_SIG_CONTENT"],
                "url": os.environ["UPD_URL"]
              }
            }
          }
          with open("stage/latest.json", "w", encoding="utf-8") as f:
            json.dump(data, f, ensure_ascii=False, indent=2)
            f.write("\n")
          print("latest.json written")
          PYEOF

      - name: ステージを成果物として保存 (検証用)
        uses: actions/upload-artifact@v4
        with:
          name: stage-v${{ env.VER }}
          path: stage/

      - name: リリース作成
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.build_only) }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DRAFT=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.draft }}" = "true" ]; then
            DRAFT="--draft"
          fi
          gh release create "v${VER}" "stage/myuke-setup-${VER}-x64.exe" "stage/latest.json" \
            --title "v${VER}" --notes-file "release-notes/v${VER}.md" $DRAFT
