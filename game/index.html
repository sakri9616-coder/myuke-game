<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>みゅけ、きょうも開発中</title>
<style>
  /* ==== 管理ウィンドウ「ゲームのメニュー」様式 (MENU_REDESIGN_SPEC P0/P1) ====
     色は全てゲーム素材パレットからのトークン。板・枠・彫り込みで部品化し、
     Web フォームの記号（ピル/細線/破線/ぼかし影/素のスクロールバー）を排除する */
  :root{
    /* 紙と素材 */
    --paper:#fff5e6; --paper-2:#f9ecd4; --cream:#f6efe6;
    --tan:#dfcdb7; --wood:#c99a66; --wood-d:#996d49; --desk:#b08954;
    /* インクと枠 */
    --ink:#463126; --ink-soft:#604b40; --sub:#8a755c;
    /* アクセント（素材色） */
    --accent:#f49a45; --accent-d:#cc6c32;
    --green:#85ca91; --green-d:#437660;
    --gold:#f8cf69; --gold-d:#f1bf41;
    --red:#c53333; --blue:#71bed3;
    /* 互換エイリアス（既存ルール・JS の参照用） */
    --bg:#f6efe6; --panel:#fff5e6; --line:#dfcdb7; --chip:#f9ecd4;
    --accent2:#85ca91; --good:#437660; --warn:#c53333;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--cream);color:var(--ink);
    background-image:radial-gradient(rgba(153,109,73,.13) 1.2px, transparent 1.4px);
    background-size:18px 18px;
    font-family:"Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo UI","Noto Sans JP",sans-serif;
    font-variant-numeric:tabular-nums;}
  /* ---------- ヘッダ: 木の帯 + 閉じる板 ---------- */
  header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;
    padding:10px 14px;background:var(--wood);
    border-bottom:3px solid var(--ink);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.35), inset 0 -6px 0 var(--desk);}
  header h1{font-size:19px;margin:0 8px 0 0;font-weight:800;letter-spacing:.03em;
    text-shadow:0 1px 0 rgba(255,255,255,.45);}
  header h1 small{font-size:11px;color:var(--ink-soft);font-weight:700;}
  #btn-to-overlay{background:var(--red);border:2.5px solid var(--ink);color:#fff;
    border-radius:8px;font-weight:800;text-shadow:0 1px 0 rgba(0,0,0,.3);
    box-shadow:inset 0 -5px 0 rgba(0,0,0,.22), inset 0 2px 0 rgba(255,255,255,.35), 0 3px 0 rgba(70,49,38,.35);}
  #btn-to-overlay:hover{background:var(--red);filter:brightness(1.07);}
  #btn-to-overlay:active{transform:translateY(3px);
    box-shadow:inset 0 -2px 0 rgba(0,0,0,.22), inset 0 2px 0 rgba(255,255,255,.3), 0 0 0 rgba(70,49,38,0);}
  /* ---------- リソースチップ: 通貨ピル（正式部品）+ アイコンソケット ---------- */
  .res{display:inline-flex;gap:5px;align-items:center;background:var(--paper);
    border:2.5px solid var(--ink);border-radius:999px;padding:3px 11px 3px 3px;
    font-size:13px;font-weight:800;
    box-shadow:inset 0 2px 0 rgba(70,49,38,.16), inset 0 -1px 0 #fff, 0 2px 0 rgba(70,49,38,.25);}
  .res-ic{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
    width:20px;height:20px;border-radius:50%;background:var(--tan);
    border:2px solid var(--ink-soft);font-size:11px;line-height:1;
    box-shadow:inset 0 1px 0 rgba(70,49,38,.25);}
  .res small{color:var(--sub);font-weight:400;font-size:11px;}
  @keyframes resBump{0%{background:var(--paper);}30%{background:var(--gold);}100%{background:var(--paper);}}
  .res.bump{animation:resBump .45s ease;}
  main{display:flex;gap:14px;padding:14px;max-width:1180px;margin:0 auto;align-items:flex-start;}
  @media (max-width:860px){ main{flex-direction:column;} .side{width:100%!important;} }
  #bubble{min-height:34px;margin:0 2px 8px;font-size:14px;background:var(--paper-2);
    border:2.5px solid var(--ink-soft);border-radius:10px;padding:7px 10px;
    box-shadow:inset 0 2px 0 rgba(70,49,38,.13), inset 0 -1px 0 #fff;}
  #bubble .who{font-weight:800;color:var(--accent-d);}
  #combo-info{min-height:18px;margin:0 2px;font-size:12px;color:var(--accent-d);font-weight:800;}
  .btn-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
  /* ---------- ボタン: 板 + ベベル + 3ステート ---------- */
  button{font-family:inherit;border:2.5px solid var(--ink);background:var(--paper);border-radius:8px;
    padding:6px 14px;font-size:13px;font-weight:800;color:var(--ink);cursor:pointer;
    box-shadow:inset 0 -5px 0 var(--tan), inset 0 2px 0 rgba(255,255,255,.5), 0 2px 0 rgba(70,49,38,.25);
    transition:transform .05s, box-shadow .05s, background .12s, filter .12s;}
  button:hover{background:#fff;border-color:var(--ink);}
  button:active{transform:translateY(3px);
    box-shadow:inset 0 -2px 0 var(--tan), inset 0 2px 0 rgba(255,255,255,.5), 0 0 0 rgba(70,49,38,0);}
  button:disabled{filter:saturate(.35);background:var(--paper-2);cursor:default;transform:none;
    box-shadow:inset 0 -2px 0 rgba(70,49,38,.12), 0 1px 0 rgba(70,49,38,.12);}
  button.primary{background:var(--accent);border-color:var(--ink);color:var(--ink);
    text-shadow:0 1px 0 rgba(255,255,255,.35);
    box-shadow:inset 0 -5px 0 var(--accent-d), inset 0 2px 0 rgba(255,255,255,.45), 0 2px 0 rgba(70,49,38,.3);}
  button.primary:hover{background:var(--accent);filter:brightness(1.06);}
  button.primary:active{box-shadow:inset 0 -2px 0 var(--accent-d), inset 0 2px 0 rgba(255,255,255,.45), 0 0 0 rgba(70,49,38,0);}
  button:focus-visible, select:focus-visible, textarea:focus-visible{outline:2.5px solid var(--accent-d);outline-offset:1px;}
  /* 購入ボタン: 価格は金の価格タグに分離 */
  .buybtn{display:inline-flex;align-items:center;gap:7px;}
  .buybtn .pricetag{background:var(--gold);border:2px solid var(--ink);border-radius:6px;
    padding:0 7px;font-weight:800;white-space:nowrap;
    box-shadow:inset 0 -3px 0 var(--gold-d), inset 0 1px 0 rgba(255,255,255,.55);}
  .buybtn .ahint{color:var(--accent-d);font-size:11px;font-weight:800;}
  .buybtn.almost{border-color:var(--accent-d);}
  @keyframes affordPulse{0%,100%{box-shadow:inset 0 -5px 0 var(--tan), inset 0 2px 0 rgba(255,255,255,.5), 0 2px 0 rgba(70,49,38,.25);}50%{box-shadow:inset 0 -5px 0 var(--tan), inset 0 2px 0 rgba(255,255,255,.5), 0 0 0 5px rgba(241,191,65,.65);}}
  .buybtn.afford-now{animation:affordPulse 1s ease-in-out 3;border-color:var(--accent-d);background:#fff3e2;}
  .flash{animation:affordPulse 1s ease-in-out 3;border-color:var(--accent-d)!important;background:#fff3e2!important;}
  /* ---------- メーター: 彫り込みトラック + ストライプフィル + 25%刻み ---------- */
  .meter{height:12px;background-color:var(--paper-2);border:2px solid var(--ink-soft);border-radius:6px;overflow:hidden;
    background-image:linear-gradient(90deg, rgba(70,49,38,.22) 2px, transparent 2px);
    background-size:25% 100%;
    box-shadow:inset 0 2px 0 rgba(70,49,38,.2), inset 0 -1px 0 #fff;}
  .meter>i{display:block;height:100%;background-color:var(--green);
    background-image:repeating-linear-gradient(45deg, rgba(255,255,255,.2) 0 6px, transparent 6px 12px),
      linear-gradient(rgba(255,255,255,.35), transparent 45%);
    /* v2.4.2: width トランジションは置かない。viewer は rev 変化のたびに
       パネルを再構築するので、遷移があると新しいバーの幅が一瞬後退してから
       前進して見えた (実測で再現)。バーの後退は値の単調性で担保する */}
  .meter.conc>i{background-color:var(--accent);}
  .side{flex:1 1 auto;min-width:300px;}
  /* Strip Canon: 工場パネルの信号機図（部屋のコンベア信号機の移行先） */
  .lampdiagram{display:flex;flex-wrap:wrap;gap:6px 14px;margin:6px 0 2px;}
  .lampstage{display:inline-flex;align-items:center;gap:5px;font-weight:700;}
  .lampdot{width:12px;height:12px;border-radius:50%;display:inline-block;border:2px solid var(--ink-soft);}
  .lampbar{display:inline-block;width:56px;height:9px;background:var(--paper-2);border:2px solid var(--ink-soft);
    border-radius:5px;overflow:hidden;vertical-align:middle;box-shadow:inset 0 1px 0 rgba(70,49,38,.22);}
  .lampbar>i{display:block;height:100%;background-color:var(--green);
    background-image:repeating-linear-gradient(45deg, rgba(255,255,255,.2) 0 5px, transparent 5px 10px);}
  .lampbar>i.bnbar{background-color:var(--red);}
  /* ---------- タブ: パネルと一体化するフォルダタブ + バッジ ---------- */
  .tabs{display:flex;flex-wrap:wrap;gap:3px;margin:2px 4px -3px;padding:0 2px;position:relative;}
  .tabs button{position:relative;z-index:1;padding:7px 12px 10px;font-size:12.5px;font-weight:800;
    background:var(--tan);color:var(--ink-soft);
    border:3px solid var(--ink);border-bottom:none;border-radius:9px 9px 0 0;
    transform:translateY(4px);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.35), inset 0 -3px 0 rgba(70,49,38,.14);}
  .tabs button:hover{background:var(--paper-2);color:var(--ink);}
  .tabs button:active{transform:translateY(5px);}
  .tabs button.on{background:var(--paper);color:var(--ink);transform:translateY(3px);z-index:3;
    box-shadow:inset 0 2px 0 rgba(255,255,255,.6);}
  .tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:5px;background:var(--paper);}
  .tabs button.on:active{transform:translateY(3px);}
  .tab-badge{position:absolute;top:-8px;right:-6px;min-width:18px;height:18px;padding:0 4px;
    border-radius:999px;background:var(--red);border:2px solid var(--ink);color:#fff;
    font-size:10.5px;font-weight:800;line-height:14px;text-align:center;
    box-shadow:0 2px 0 rgba(70,49,38,.3);z-index:4;}
  /* ---------- チュートリアル導線: ロック表示 (シルエット + ビジュアル条件) ----------
     方針 (TUTORIAL_DESIGN.md): 説明文でなく絵で示す。ロック中のタブは灰色の
     影として残し、条件はアイコン + メーター + 現在/必要数で見せる */
  .tabs button.locked{filter:saturate(.25);color:var(--sub);}
  .tabs button.locked:hover{background:var(--tan);color:var(--sub);}
  .tab-lockic{position:absolute;top:-7px;left:-5px;width:17px;height:17px;border-radius:50%;
    background:var(--paper);border:2px solid var(--ink);font-size:9.5px;line-height:13px;
    text-align:center;box-shadow:0 2px 0 rgba(70,49,38,.3);z-index:4;}
  .tab-badge.new{background:var(--gold);color:var(--ink);font-size:11px;min-width:22px;}
  .lockpanel{text-align:center;padding:26px 10px 18px;}
  .lockbig{font-size:56px;line-height:1.1;filter:grayscale(1);opacity:.42;}
  .locklock{font-weight:800;font-size:14px;margin-top:6px;}
  .lockconds{max-width:420px;margin:14px auto 0;text-align:left;}
  .condbar{display:flex;align-items:center;gap:8px;margin-top:8px;}
  .condbar .meter{flex:1;}
  .condbar b{font-size:13px;white-space:nowrap;}
  .condcap{font-size:11px;color:var(--sub);margin:1px 0 0 34px;}
  .lockline{display:inline-block;margin-top:16px;background:var(--paper-2);
    border:2.5px solid var(--ink);border-radius:10px;padding:6px 12px;font-size:12.5px;
    box-shadow:0 3px 0 rgba(70,49,38,.25);}
  .seclock{border:3px solid var(--ink);border-radius:10px;background:var(--paper-2);
    box-shadow:0 3px 0 rgba(70,49,38,.25);margin-top:12px;padding:9px 12px 11px;}
  .seclock-head{display:flex;align-items:center;gap:7px;font-weight:800;font-size:13px;}
  .seclock-head .fold-sum{margin-left:auto;font-size:11px;color:var(--sub);font-weight:700;}
  .seclock .lockline{margin-top:10px;}
  .silh{filter:grayscale(1);opacity:.5;font-size:16px;}
  /* ---------- パネル: 2階層の板 + 木製スクロールバー ---------- */
  .panel{background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:14px;
    font-size:13px;line-height:1.65;max-height:640px;overflow:auto;position:relative;z-index:2;
    box-shadow:0 4px 0 rgba(70,49,38,.28), inset 0 0 0 5px var(--paper-2), inset 0 2px 0 rgba(255,255,255,.55);
    scrollbar-color:var(--wood-d) var(--tan);}
  .panel::-webkit-scrollbar, .log::-webkit-scrollbar, textarea::-webkit-scrollbar{width:12px;height:12px;}
  .panel::-webkit-scrollbar-track, .log::-webkit-scrollbar-track, textarea::-webkit-scrollbar-track{
    background:var(--tan);border-radius:6px;box-shadow:inset 0 2px 0 rgba(70,49,38,.2);}
  .panel::-webkit-scrollbar-thumb, .log::-webkit-scrollbar-thumb, textarea::-webkit-scrollbar-thumb{
    background:var(--wood-d);border:2px solid var(--ink);border-radius:6px;}
  .panel::-webkit-scrollbar-thumb:hover, .log::-webkit-scrollbar-thumb:hover, textarea::-webkit-scrollbar-thumb:hover{background:var(--desk);}
  /* セクション見出し: 木プレート付きリボン + 溝線 */
  .panel h3{display:flex;align-items:center;gap:8px;margin:14px 0 9px;padding-bottom:5px;
    font-size:14.5px;font-weight:800;letter-spacing:.03em;color:var(--ink);
    border-bottom:2px solid var(--tan);box-shadow:0 1px 0 #fff;}
  .panel h3:first-child{margin-top:2px;}
  .panel h3::before{content:"";flex:0 0 auto;width:14px;height:18px;border-radius:3px;
    background:var(--wood);border:2px solid var(--ink-soft);
    box-shadow:inset 0 -4px 0 rgba(70,49,38,.22), inset 0 1px 0 rgba(255,255,255,.5);}
  .proj-name{font-size:15px;font-weight:800;}
  .feat{margin:2px 0;}
  .feat.done{color:var(--good);}
  .feat.todo{color:var(--sub);}
  /* ---------- 行・カード: スロット板 + アイコンソケット ---------- */
  .item{border:2.5px solid var(--ink);border-radius:10px;padding:9px 11px;margin:8px 0;background:var(--paper);
    box-shadow:0 2px 0 rgba(70,49,38,.18), inset 0 1px 0 rgba(255,255,255,.5);}
  .item .nm{font-weight:800;}
  .item .ds{color:var(--sub);font-size:12px;}
  .sock{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
    width:32px;height:32px;border-radius:8px;background:var(--paper-2);
    border:2.5px solid var(--ink-soft);font-size:16px;line-height:1;vertical-align:middle;margin-right:8px;
    box-shadow:inset 0 2px 0 rgba(70,49,38,.16), inset 0 -1px 0 #fff;}
  .sock.sm{width:25px;height:25px;border-radius:7px;margin-right:7px;}
  .lvbadge{display:inline-block;background:var(--gold);border:2px solid var(--ink);border-radius:6px;
    padding:0 6px;font-size:11px;font-weight:800;vertical-align:1px;
    box-shadow:inset 0 -3px 0 var(--gold-d);}
  .buy{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .log{font-size:12px;line-height:1.7;}
  .log div{border-bottom:2px solid var(--tan);box-shadow:0 1px 0 #fff;padding:3px 0;}
  .log .tm{color:var(--sub);}
  /* 実績スタンプ: 判子（二重枠・金地・微回転 / 未取得は乾いた板） */
  .stamp{display:inline-block;border:2.5px solid var(--ink-soft);border-radius:8px;padding:4px 8px;
    margin:3px;font-size:12px;background:var(--paper);box-shadow:0 2px 0 rgba(70,49,38,.18);}
  .stamp.got{border-color:var(--ink);background:var(--gold);font-weight:800;
    outline:1.5px solid var(--ink);outline-offset:-6px;transform:rotate(-2deg);}
  .stamp.lock{filter:saturate(.35);opacity:.75;background:var(--paper-2);color:var(--sub);
    box-shadow:inset 0 -2px 0 rgba(70,49,38,.1);}
  /* フォーム部品: 罫線ノート / 板セレクト / 板スイッチ */
  textarea{width:100%;border:2.5px solid var(--ink);border-radius:10px;padding:8px 10px;
    font-family:inherit;font-size:13px;line-height:26px;background-color:var(--paper);
    background-image:repeating-linear-gradient(transparent 0 25px, var(--tan) 25px 26px);
    box-shadow:inset 0 2px 0 rgba(70,49,38,.15);resize:vertical;}
  select{font-family:inherit;border:2.5px solid var(--ink);border-radius:8px;background:var(--paper);
    padding:5px 8px;font-weight:700;color:var(--ink);
    box-shadow:inset 0 -4px 0 var(--tan), inset 0 2px 0 rgba(255,255,255,.5);}
  .switch{position:relative;min-width:78px;padding-left:32px;}
  .switch::before{content:"";position:absolute;left:7px;top:50%;transform:translateY(-50%);
    width:15px;height:15px;border-radius:4px;background:var(--tan);
    border:2px solid var(--ink-soft);box-shadow:inset 0 -3px 0 rgba(70,49,38,.25);}
  .switch.on::before{background:var(--green);border-color:var(--ink);}
  button.danger{border-color:var(--red);color:var(--red);
    box-shadow:inset 0 -5px 0 rgba(197,51,51,.22), inset 0 2px 0 rgba(255,255,255,.5), 0 2px 0 rgba(70,49,38,.2);}
  button.danger:active{box-shadow:inset 0 -2px 0 rgba(197,51,51,.22), inset 0 2px 0 rgba(255,255,255,.5), 0 0 0 rgba(70,49,38,0);}
  input[type=range]{accent-color:var(--accent-d);cursor:pointer;}
  .note{font-size:11px;color:var(--sub);}
  .kv{display:flex;justify-content:space-between;border-bottom:2px solid var(--tan);
    box-shadow:0 1px 0 #fff;padding:3px 1px;}
  /* 通知カード: 色帯プレートに統一 */
  #return-card{background:var(--paper);border:3px solid var(--ink);border-radius:12px;
    padding:10px 12px 10px 18px;margin-bottom:10px;font-size:13px;line-height:1.65;position:relative;
    box-shadow:0 3px 0 rgba(70,49,38,.25), inset 0 2px 0 rgba(255,255,255,.5);}
  #return-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;
    background:var(--gold-d);border-radius:12px 0 0 12px;}
  #return-card .rc-head{font-weight:800;font-size:14px;display:flex;justify-content:space-between;align-items:center;}
  #return-card .rc-close{border:none;background:transparent;font-size:16px;padding:0 4px;line-height:1;box-shadow:none;}
  #return-card .rc-close:active{transform:none;}
  #return-card .rc-gift{color:var(--accent-d);font-weight:700;margin-top:2px;}
  #update-card{background:var(--paper);border:3px solid var(--ink);border-radius:12px;
    padding:10px 12px 10px 18px;margin-bottom:10px;font-size:13px;line-height:1.65;position:relative;
    box-shadow:0 3px 0 rgba(70,49,38,.25), inset 0 2px 0 rgba(255,255,255,.5);}
  #update-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;
    background:var(--blue);border-radius:12px 0 0 12px;}
  #update-card .rc-head{font-weight:800;font-size:14px;display:flex;justify-content:space-between;align-items:center;}
  #update-card .rc-close{border:none;background:transparent;font-size:16px;padding:0 4px;line-height:1;cursor:pointer;box-shadow:none;}
  #update-card .rc-close:active{transform:none;}
  #proj-meter{transition:filter .18s ease;}
  #proj-label{transition:color .18s ease;}
  .celebrate{color:var(--accent-d);font-weight:800;}
  .bn{color:var(--warn);font-weight:800;}
  .ok{color:var(--good);font-weight:700;}
  /* ボトルネックチップ: 色帯プレートの小型版（帯 HUD と顔を揃える） */
  #bn-chip{display:none;margin:6px 2px 0;background:var(--paper);border:2.5px solid var(--red);
    color:var(--red);border-radius:8px;padding:5px 12px;font-size:12.5px;font-weight:800;cursor:pointer;
    box-shadow:inset 6px 0 0 var(--red), inset 0 -4px 0 rgba(197,51,51,.18), 0 2px 0 rgba(70,49,38,.2);}
  #bn-chip:hover{background:var(--paper-2);}
  .coatdot{display:inline-block;width:13px;height:13px;border-radius:50%;border:2px solid var(--ink-soft);
    vertical-align:middle;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18), 0 1px 0 #fff;}
  /* ==== IA コンパクト化 (v2.3.7 第2弾): 頻度階層・折りたたみ・ビジュアル化 ====
     鉄則: よく見るものを大きく最初に / 低頻度は折りたたみにまとめる /
     説明文でなく数字・絵・メーターで見せる。素材トークンは上の刷新分を流用 */
  /* 折りたたみセクション: 低頻度グループの受け皿 (見出し+要約チップつきの板) */
  .fold{border:2.5px solid var(--ink);border-radius:10px;margin:8px 0;background:var(--paper);
    box-shadow:0 2px 0 rgba(70,49,38,.18);}
  .fold-head{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
    background:var(--paper-2);border:none;border-radius:8px;padding:8px 11px;
    font-size:13.5px;font-weight:800;color:var(--ink);cursor:pointer;
    box-shadow:inset 0 -3px 0 var(--tan), inset 0 2px 0 rgba(255,255,255,.5);}
  .fold-head:hover{background:#fdf3dd;}
  .fold-head:active{transform:none;box-shadow:inset 0 -2px 0 var(--tan), inset 0 2px 0 rgba(255,255,255,.5);}
  .fold-arrow{flex:0 0 auto;width:16px;text-align:center;color:var(--accent-d);font-size:12px;}
  .fold-sum{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--sub);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;}
  .fold-body{padding:6px 11px 9px;}
  .fold.closed .fold-body{display:none;}
  /* 大きい数字のスタットブロック */
  .statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin:8px 0;}
  .stat{background:var(--paper-2);border:2.5px solid var(--ink-soft);border-radius:10px;padding:6px 10px;
    box-shadow:inset 0 2px 0 rgba(70,49,38,.14), inset 0 -1px 0 #fff;}
  .stat .sl{font-size:11px;font-weight:700;color:var(--sub);}
  .stat .sv{font-size:21px;font-weight:800;line-height:1.3;}
  .stat .sv small{font-size:11px;font-weight:700;color:var(--sub);}
  /* プロジェクトのヒーローカード: 進捗を1枚の絵にする */
  .hero{border:3px solid var(--ink);border-radius:12px;background:var(--paper);padding:10px 14px;margin:8px 0;
    box-shadow:0 3px 0 rgba(70,49,38,.22), inset 0 0 0 4px var(--paper-2);}
  .hero-top{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;}
  .hero-pct{font-size:31px;font-weight:800;line-height:1;}
  .hero-pct small{font-size:16px;}
  .hero-name{font-size:16px;font-weight:800;}
  .tagchip{display:inline-block;background:var(--tan);border:2px solid var(--ink-soft);border-radius:6px;
    padding:0 6px;font-size:11px;font-weight:800;vertical-align:2px;white-space:nowrap;}
  .feats{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
  .featchip{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--ink-soft);border-radius:999px;
    padding:1px 9px;font-size:12px;font-weight:700;background:var(--paper-2);color:var(--sub);}
  .featchip.done{background:var(--green);border-color:var(--ink);color:var(--ink);}
  .concrow{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;font-weight:700;}
  .concrow .meter{flex:1 1 auto;}
  .chiprow{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;}
  .vchip{display:inline-flex;align-items:center;gap:5px;background:var(--paper);border:2px solid var(--ink-soft);
    border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;
    box-shadow:inset 0 2px 0 rgba(70,49,38,.12);}
  .vchip b{font-size:13.5px;}
  /* スタッフのスプライトカード */
  .staffgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:8px;margin:6px 0;}
  .staffcard{display:flex;align-items:center;gap:10px;border:2.5px solid var(--ink);border-radius:10px;
    background:var(--paper);padding:7px 10px;
    box-shadow:0 2px 0 rgba(70,49,38,.18), inset 0 1px 0 rgba(255,255,255,.5);}
  .sc-img{flex:0 0 auto;width:58px;height:50px;display:flex;align-items:center;justify-content:center;
    background:var(--paper-2);border:2.5px solid var(--ink-soft);border-radius:8px;overflow:hidden;
    box-shadow:inset 0 2px 0 rgba(70,49,38,.16), inset 0 -1px 0 #fff;font-size:22px;}
  .sc-img img{max-width:54px;max-height:46px;image-rendering:pixelated;}
  .sc-main{flex:1 1 auto;min-width:0;}
  .sc-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .sc-top .nm{font-weight:800;font-size:13.5px;}
  .sc-eff{font-size:12px;color:var(--ink-soft);font-weight:700;margin-top:1px;}
  .sc-pct{font-size:20px;font-weight:800;white-space:nowrap;}
  /* 購入ボタンはカード/行の中で潰さない (価格タグが割れるのを防ぐ) */
  .buy>button, .staffcard>button{flex:0 0 auto;}
  .buybtn .buy-act{white-space:nowrap;}
  .coatdot.big{width:26px;height:26px;}
  /* 購入カードの密グリッド + 密度の高い行 */
  .buygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:8px;margin:6px 0;}
  .buygrid .item{margin:0;}
  .item.slim{padding:6px 10px;margin:5px 0;}
  .buygrid .item.slim{margin:0;}
  .stagehead{display:inline-block;margin:10px 0 2px;background:var(--wood);border:2px solid var(--ink-soft);
    border-radius:6px;padding:1px 10px;font-size:12px;font-weight:800;
    box-shadow:inset 0 -3px 0 rgba(70,49,38,.22), inset 0 1px 0 rgba(255,255,255,.5);}
  /* 工場: 信号機とレートを統合した1本の帯 (図が主役・数字が大きい) */
  .ratestrip{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:8px 0;}
  .ratecell{background:var(--paper-2);border:2.5px solid var(--ink-soft);border-radius:10px;padding:6px 9px;
    box-shadow:inset 0 2px 0 rgba(70,49,38,.14), inset 0 -1px 0 #fff;}
  .ratecell .rh{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:800;}
  .ratecell .rv{font-size:19px;font-weight:800;line-height:1.35;}
  .ratecell .rv small{font-size:10.5px;color:var(--sub);font-weight:700;}
  .ratecell .lampbar{width:100%;margin:2px 0;}
  .ratecell .rs{font-size:11px;color:var(--sub);font-weight:700;}
  @media (max-width:760px){ .ratestrip{grid-template-columns:repeat(3,1fr);} }
  @media (max-width:560px){ .ratestrip{grid-template-columns:repeat(2,1fr);}
    .buygrid,.staffgrid,.shelfgrid{grid-template-columns:1fr;} }
  /* 作品棚のカードグリッド */
  .shelfgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px;margin:6px 0;}
  .workcard{border:2.5px solid var(--ink);border-radius:10px;background:var(--paper);padding:8px 11px;
    box-shadow:0 2px 0 rgba(70,49,38,.18), inset 0 1px 0 rgba(255,255,255,.5);}
  .workcard .nm{font-weight:800;}
  .wc-hl{color:var(--accent-d);font-weight:800;font-size:12px;margin-top:4px;}
  .wc-stats{font-size:11.5px;color:var(--sub);font-weight:700;margin-top:4px;}
  /* ==== デスクトップ版ストリップモード: body.strip のときだけ有効 ====
     デスクトップ画面下部の帯に、枠もカードもなく直接ペットが住む表示。
     ページ背景・キャンバス背景は完全な透過。見えるのは帯ステージと右下HUDだけ。 */
  #strip-wrap{display:none;}
  body.strip{background:transparent;overflow:hidden;}
  body.strip header, body.strip main{display:none;}
  body.strip #strip-wrap{display:block;position:fixed;inset:0;}
  canvas#strip{width:100%;height:100%;display:block;image-rendering:pixelated;
    background:transparent;cursor:pointer;touch-action:none;}
  /* (旧 #strip-hud チップ列の CSS は Stage 3 で廃止) */
  /* 帯の移動グリップ (sakuri 指定): 右上の小さな ◥。掴んでドラッグで帯を移動する */
  #strip-grip{position:absolute;top:0;right:2px;width:30px;height:24px;display:none;
    align-items:flex-start;justify-content:flex-end;padding:2px 4px 0 0;
    font-size:12px;line-height:1;color:rgba(255,250,242,.45);cursor:grab;
    text-shadow:0 1px 3px rgba(40,26,12,.6);user-select:none;-webkit-user-select:none;z-index:30;}
  body.strip #strip-grip{display:flex;}
  #strip-grip:hover{color:rgba(255,250,242,.95);}
  #strip-grip:active{cursor:grabbing;}
  /* 並べ替えボタン (v2.4.6 で帯の右上・グリップ脇に復帰。設定タブにも同じ入口がある) */
  #strip-layout{position:absolute;top:2px;right:36px;display:none;z-index:30;
    background:rgba(255,250,242,.88);border:1.5px solid rgba(107,85,64,.55);border-radius:999px;
    padding:2px 9px;font-size:11px;font-weight:700;color:var(--ink);cursor:pointer;font-family:inherit;
    box-shadow:0 2px 8px rgba(40,26,12,.25);}
  body.strip #strip-layout{display:block;}
  #strip-layout:hover{border-color:var(--accent);background:#fff;}

  /* ==== IDE ダーク「エスプレッソ・エディタ」 (OFFICE_ART_DIRECTION §3 / Phase P1) ====
     管理ウィンドウ (full 形態) だけのスキン翻訳。帯 (body.strip) には適用しない。
     部品の形・IA・ID・JS は不変で、面と色と書体だけを差し替える。猫の絵・
     吹き出し・ポートレート受けはクリーム #FFF5E6 の「写真の差し込み」として温存。
     意味色: バグ=✗エラー赤 / 詰まり=⚠警告黄 / RP=紫 / 主ボタン=文字列橙 /
     価格・Lv=関数金 / 成功=緑 / 数値=淡緑 (VS Code Dark+ の診断色文法) */
  body:not(.strip){
    --ide-bg:#1E1E1E; --ide-panel:#252526; --ide-panel2:#2D2D2D; --ide-panel3:#333333;
    --ide-taboff:#1E1E1E; --ide-line:#454545; --ide-linesoft:#2B2B2B;
    --ide-ink:#D4D4D4; --ide-sub:#A6A6A6; --ide-status:#007ACC;
    --syn-blue:#6FA8DC; --syn-str:#F49A45; --syn-func:#F8CF69; --syn-type:#5EC8B4;
    --syn-num:#B5CEA8; --syn-green:#7BE495; --syn-purple:#C586C0;
    --ide-red:#E5534B; --ide-errtx:#F48771; --ide-warn:#FFD479; --ide-gold:#F1BF41;
    --ide-paper:#FFF5E6;
    --mono:ui-monospace,"Cascadia Code",Consolas,"Noto Sans Mono",monospace;
    /* 旧トークンの意味を管理画面スコープで読み替える (帯は元のまま) */
    --paper:#252526; --paper-2:#2D2D2D; --cream:#1E1E1E;
    --tan:#2B2B2B; --wood:#0E639C; --wood-d:#454545; --desk:#5B5344;
    --ink:#D4D4D4; --ink-soft:#858585; --sub:#A6A6A6;
    --accent:#F49A45; --accent-d:#F49A45;
    --green:#7BE495; --green-d:#7BE495; --good:#7BE495;
    --gold:#F8CF69; --gold-d:#F1BF41; --red:#E5534B; --warn:#E5534B; --blue:#6FA8DC;
    background:#1E1E1E; background-image:none; color:#D4D4D4;
  }
  /* ---------- ヘッダ: タイトルバー + ステータスバーの2段 ---------- */
  body:not(.strip) header{gap:0;padding:0;background:var(--ide-status);
    border-bottom:3px solid var(--ide-taboff);
    box-shadow:inset 0 -1px 0 rgba(255,255,255,.12);}
  body:not(.strip) header h1{order:-1;flex:1 1 100%;margin:0;padding:7px 14px 6px;
    background:var(--ide-taboff);font-size:13.5px;font-weight:700;letter-spacing:.02em;
    color:var(--ide-ink);text-shadow:none;
    box-shadow:inset 0 -1px 0 var(--ide-linesoft);}
  body:not(.strip) header h1 small{color:var(--ide-sub);}
  body:not(.strip) header .res{margin:4px 1px;}
  body:not(.strip) header .res:first-of-type{margin-left:8px;}
  /* リソースチップ → ステータスバー項目 (面なし・アイコン+等幅数字) */
  body:not(.strip) .res{background:transparent;border:none;border-radius:0;
    padding:2px 7px;font-size:12.5px;font-weight:700;color:var(--ide-ink);
    box-shadow:none;text-shadow:0 1px 0 rgba(0,0,0,.25);}
  body:not(.strip) .res-ic{background:rgba(255,255,255,.16);border:none;
    box-shadow:none;width:18px;height:18px;}
  body:not(.strip) .res small{color:rgba(239,231,215,.72);}
  body:not(.strip) .res span[id]{font-family:var(--mono);font-weight:700;}
  body:not(.strip) .res.bump{animation:resBumpIde .45s ease;}
  @keyframes resBumpIde{0%{background:transparent;}30%{background:rgba(241,191,65,.55);}100%{background:transparent;}}
  /* 診断表示: バグ在庫>0 でエラー色、詰まりは警告黄 */
  body:not(.strip) .res.has-bugs{color:#FFC4BE;}
  body:not(.strip) .res.has-bugs .res-ic{background:var(--ide-red);}
  body:not(.strip) .res.diag{color:var(--ide-warn);font-weight:800;}
  body:not(.strip) .res.diag .res-ic{background:rgba(255,212,121,.25);}
  /* 閉じる板: ウィンドウ操作ボタン様式 (赤は維持) */
  body:not(.strip) #btn-to-overlay{margin:4px 10px 4px auto;background:var(--ide-red);
    border:2.5px solid #7C2D28;color:#fff;border-radius:8px;font-weight:800;text-shadow:none;
    box-shadow:inset 0 -4px 0 rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.3);}
  body:not(.strip) #btn-to-overlay:hover{background:var(--ide-red);filter:brightness(1.1);}
  body:not(.strip) #btn-to-overlay:active{transform:translateY(3px);
    box-shadow:inset 0 -1px 0 rgba(0,0,0,.25);}
  /* ---------- ファイルタブ ---------- */
  body:not(.strip) .tabs{gap:2px;margin:8px 4px -3px;}
  body:not(.strip) .tabs button{background:var(--ide-taboff);color:var(--ide-sub);
    border-color:var(--ide-line);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05), inset 0 -3px 0 rgba(0,0,0,.25);}
  body:not(.strip) .tabs button:hover{background:var(--ide-panel2);color:var(--ide-ink);}
  body:not(.strip) .tabs button.on{background:var(--ide-panel);color:var(--ide-ink);
    box-shadow:inset 0 2px 0 var(--syn-str), inset 0 1px 0 rgba(255,255,255,.06);}
  body:not(.strip) .tabs button.on::after{background:var(--ide-panel);}
  body:not(.strip) .tabs button.locked{filter:saturate(.25) brightness(.85);color:var(--ide-sub);}
  body:not(.strip) .tabs button.locked:hover{background:var(--ide-taboff);color:var(--ide-sub);}
  body:not(.strip) .tab-badge{background:var(--ide-red);border-color:var(--ide-taboff);color:#fff;
    box-shadow:0 2px 0 rgba(0,0,0,.4);}
  body:not(.strip) .tab-badge.new{background:var(--ide-gold);color:#2A2008;}
  body:not(.strip) .tab-lockic{background:var(--ide-panel2);border-color:var(--ide-line);
    color:var(--ide-ink);box-shadow:0 2px 0 rgba(0,0,0,.4);}
  /* ---------- パネル・見出し・スクロールバー ---------- */
  body:not(.strip) .panel{background:var(--ide-panel);border-color:var(--ide-line);
    box-shadow:0 4px 0 rgba(0,0,0,.4), inset 0 0 0 5px rgba(0,0,0,.16), inset 0 1px 0 rgba(255,255,255,.07);
    scrollbar-color:var(--ide-line) transparent;}
  body:not(.strip) .panel::-webkit-scrollbar-track,
  body:not(.strip) .log::-webkit-scrollbar-track,
  body:not(.strip) textarea::-webkit-scrollbar-track{background:transparent;box-shadow:none;}
  body:not(.strip) .panel::-webkit-scrollbar-thumb,
  body:not(.strip) .log::-webkit-scrollbar-thumb,
  body:not(.strip) textarea::-webkit-scrollbar-thumb{background:var(--ide-line);border:2px solid var(--ide-panel);border-radius:6px;}
  body:not(.strip) .panel::-webkit-scrollbar-thumb:hover,
  body:not(.strip) .log::-webkit-scrollbar-thumb:hover,
  body:not(.strip) textarea::-webkit-scrollbar-thumb:hover{background:var(--ide-sub);}
  body:not(.strip) .panel h3{color:var(--ide-ink);border-bottom:2px solid var(--ide-linesoft);
    box-shadow:0 1px 0 rgba(255,255,255,.05);}
  body:not(.strip) .panel h3::before{background:var(--ide-status);border-color:var(--ide-line);
    box-shadow:inset 0 -4px 0 rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.25);}
  /* ---------- ボタン・価格タグ・Lv ---------- */
  body:not(.strip) button{background:var(--ide-panel2);border-color:var(--ide-line);color:var(--ide-ink);
    box-shadow:inset 0 -5px 0 rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.07), 0 2px 0 rgba(0,0,0,.4);}
  body:not(.strip) button:hover{background:var(--ide-panel3);border-color:var(--ide-line);}
  body:not(.strip) button:active{box-shadow:inset 0 -2px 0 rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.07), 0 0 0 rgba(0,0,0,0);}
  body:not(.strip) button:disabled{background:var(--ide-taboff);color:var(--ide-sub);
    box-shadow:inset 0 -2px 0 rgba(0,0,0,.2), 0 1px 0 rgba(0,0,0,.2);}
  body:not(.strip) button.primary{background:var(--syn-str);border-color:#8A5426;color:#2A1A08;
    text-shadow:0 1px 0 rgba(255,255,255,.3);
    box-shadow:inset 0 -5px 0 rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.4), 0 2px 0 rgba(0,0,0,.4);}
  body:not(.strip) button.primary:hover{background:var(--syn-str);filter:brightness(1.07);}
  body:not(.strip) button.primary:active{box-shadow:inset 0 -2px 0 rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.4), 0 0 0 rgba(0,0,0,0);}
  body:not(.strip) button:focus-visible,
  body:not(.strip) select:focus-visible,
  body:not(.strip) textarea:focus-visible{outline:2.5px solid var(--syn-blue);outline-offset:1px;}
  body:not(.strip) .buybtn .pricetag{background:var(--syn-func);border-color:var(--ide-line);
    color:#2A2008;font-family:var(--mono);
    box-shadow:inset 0 -3px 0 var(--ide-gold), inset 0 1px 0 rgba(255,255,255,.5);}
  body:not(.strip) .buybtn .ahint{color:var(--syn-str);}
  body:not(.strip) .buybtn.almost{border-color:var(--syn-str);}
  body:not(.strip) .buybtn.afford-now{border-color:var(--syn-str);background:#4A3A20;}
  body:not(.strip) .flash{border-color:var(--syn-func)!important;background:#4A3A20!important;}
  @keyframes affordPulse{0%,100%{box-shadow:inset 0 -5px 0 rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.07), 0 2px 0 rgba(0,0,0,.4);}50%{box-shadow:inset 0 -5px 0 rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.07), 0 0 0 5px rgba(241,191,65,.5);}}
  body:not(.strip) .lvbadge{background:var(--syn-func);border-color:var(--ide-line);color:#2A2008;
    font-family:var(--mono);box-shadow:inset 0 -3px 0 var(--ide-gold);}
  body:not(.strip) button.danger{border-color:var(--ide-red);color:#FF9D97;
    box-shadow:inset 0 -5px 0 rgba(229,83,75,.25), inset 0 1px 0 rgba(255,255,255,.07), 0 2px 0 rgba(0,0,0,.35);}
  body:not(.strip) button.danger:active{box-shadow:inset 0 -2px 0 rgba(229,83,75,.25), inset 0 1px 0 rgba(255,255,255,.07), 0 0 0 rgba(0,0,0,0);}
  /* ---------- メーター: 溝トラック + 意味色フィル (ストライプ維持) ---------- */
  body:not(.strip) .meter{background-color:var(--ide-taboff);border-color:var(--ide-line);
    background-image:linear-gradient(90deg, rgba(255,255,255,.13) 2px, transparent 2px);
    box-shadow:inset 0 2px 0 rgba(0,0,0,.4);}
  body:not(.strip) .meter>i{background-color:var(--syn-blue);}
  body:not(.strip) .meter.conc>i{background-color:var(--syn-str);}
  body:not(.strip) .lampbar{background:var(--ide-taboff);border-color:var(--ide-line);
    box-shadow:inset 0 1px 0 rgba(0,0,0,.4);}
  body:not(.strip) .lampbar>i{background-color:var(--syn-green);}
  body:not(.strip) .lampbar>i.bnbar{background-color:var(--ide-red);}
  body:not(.strip) .lampdot{border-color:var(--ide-line);}
  /* ---------- 行・カード・ソケット ---------- */
  body:not(.strip) .item{background:var(--ide-panel);border-color:var(--ide-line);
    box-shadow:0 2px 0 rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);}
  body:not(.strip) .item .ds{color:var(--ide-sub);}
  body:not(.strip) .sock{background:var(--ide-taboff);border-color:var(--ide-line);
    box-shadow:inset 0 2px 0 rgba(0,0,0,.35);}
  body:not(.strip) .kv{border-bottom-color:var(--ide-linesoft);box-shadow:none;}
  body:not(.strip) .kv span:last-child{font-family:var(--mono);}
  body:not(.strip) .log div{border-bottom-color:var(--ide-linesoft);box-shadow:none;}
  body:not(.strip) .log .tm{color:var(--ide-sub);font-family:var(--mono);}
  body:not(.strip) .coatdot{border-color:var(--ide-line);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25);}
  /* ---------- ヒーロー (開いているファイル面) ---------- */
  body:not(.strip) .hero{background:var(--ide-panel);border-color:var(--ide-line);
    box-shadow:0 3px 0 rgba(0,0,0,.4), inset 0 0 0 4px var(--ide-panel2), inset 0 1px 0 rgba(255,255,255,.06);}
  body:not(.strip) .hero-pct{font-family:var(--mono);}
  body:not(.strip) .tagchip{background:var(--ide-panel2);border-color:var(--ide-line);color:var(--ide-sub);}
  body:not(.strip) .featchip{background:var(--ide-panel2);border-color:var(--ide-line);color:var(--ide-sub);}
  body:not(.strip) .featchip.done{background:#F2D492;border-color:var(--ide-gold);color:#4A3A10;}
  body:not(.strip) .vchip{background:var(--ide-panel2);border-color:var(--ide-line);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06);}
  body:not(.strip) .vchip b{font-family:var(--mono);}
  body:not(.strip) .feat.done{color:var(--syn-green);}
  /* ---------- スタット・レート帯 (CI ステップ) ---------- */
  body:not(.strip) .stat{background:var(--ide-panel2);border-color:var(--ide-line);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05);}
  body:not(.strip) .stat .sl{color:var(--ide-sub);}
  body:not(.strip) .stat .sv{font-family:var(--mono);color:var(--syn-num);}
  body:not(.strip) .stat .sv small{color:var(--ide-sub);}
  body:not(.strip) .ratecell{background:var(--ide-panel2);border-color:var(--ide-line);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05);position:relative;}
  body:not(.strip) .ratecell .rv{font-family:var(--mono);}
  body:not(.strip) .ratecell .rv small{color:var(--ide-sub);}
  body:not(.strip) .ratecell .rs{color:var(--ide-sub);}
  @media (min-width:761px){
    body:not(.strip) .ratecell:not(:last-child)::after{content:"";position:absolute;
      right:-8px;top:50%;width:8px;height:2px;background:var(--ide-line);z-index:1;}
  }
  body:not(.strip) .stagehead{background:var(--ide-status);border-color:var(--ide-line);color:var(--ide-ink);
    box-shadow:inset 0 -3px 0 rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.2);}
  /* ---------- スタッフカード (ポートレート受けだけクリーム) ---------- */
  body:not(.strip) .staffcard{background:var(--ide-panel2);border-color:var(--ide-line);
    box-shadow:0 2px 0 rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.05);}
  body:not(.strip) .sc-img{background:var(--ide-paper);border-color:var(--ide-line);
    box-shadow:inset 0 2px 0 rgba(70,49,38,.15);}
  body:not(.strip) .sc-eff{color:var(--ide-sub);}
  body:not(.strip) .sc-pct{font-family:var(--mono);}
  body:not(.strip) .workcard{background:var(--ide-panel);border-color:var(--ide-line);
    box-shadow:0 2px 0 rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);}
  body:not(.strip) .wc-hl{color:var(--syn-str);}
  body:not(.strip) .wc-stats{color:var(--ide-sub);}
  /* ---------- fold: サイドバーのセクション見出し様式 ---------- */
  body:not(.strip) .fold{background:var(--ide-panel);border-color:var(--ide-line);
    box-shadow:0 2px 0 rgba(0,0,0,.3);}
  body:not(.strip) .fold-head{background:transparent;color:var(--ide-ink);
    box-shadow:none;border-radius:9px 9px 0 0;letter-spacing:.03em;}
  body:not(.strip) .fold:not(.closed) .fold-head{border-bottom:2px solid var(--ide-linesoft);border-radius:9px 9px 0 0;}
  body:not(.strip) .fold.closed .fold-head{border-radius:9px;}
  body:not(.strip) .fold-head:hover{background:rgba(255,255,255,.045);}
  body:not(.strip) .fold-head:active{box-shadow:none;}
  body:not(.strip) .fold-arrow{color:var(--syn-blue);}
  body:not(.strip) .fold-sum{color:var(--ide-sub);}
  body:not(.strip) .seclock-head .fold-sum{color:var(--ide-sub);}
  /* ---------- ロック表示 (ダークでも読みやすく) ---------- */
  body:not(.strip) .lockline{background:var(--ide-panel2);border-color:var(--ide-line);
    color:var(--ide-ink);box-shadow:0 3px 0 rgba(0,0,0,.4);}
  body:not(.strip) .seclock{background:var(--ide-panel2);border-color:var(--ide-line);
    box-shadow:0 3px 0 rgba(0,0,0,.4);}
  body:not(.strip) .condcap{color:var(--ide-sub);}
  /* ---------- 実績スタンプ: バッジ様式 ---------- */
  body:not(.strip) .stamp{background:var(--ide-panel2);border-color:var(--ide-line);color:var(--ide-sub);
    box-shadow:0 2px 0 rgba(0,0,0,.3);}
  body:not(.strip) .stamp.got{background:var(--ide-gold);border-color:#8A6D1F;color:#2A2008;
    outline-color:rgba(42,32,8,.5);}
  body:not(.strip) .stamp.lock{background:var(--ide-taboff);color:var(--ide-sub);
    box-shadow:inset 0 -2px 0 rgba(0,0,0,.25);}
  /* ---------- 通知カード: 色帯の文法は維持、色は診断色に ---------- */
  body:not(.strip) #return-card{background:var(--ide-panel);border-color:var(--ide-line);
    color:var(--ide-ink);box-shadow:0 3px 0 rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.06);}
  body:not(.strip) #return-card::before{background:var(--ide-gold);}
  body:not(.strip) #return-card .rc-gift{color:var(--syn-func);}
  body:not(.strip) #return-card .rc-close{color:var(--ide-ink);}
  body:not(.strip) #update-card{background:var(--ide-panel);border-color:var(--ide-line);
    color:var(--ide-ink);box-shadow:0 3px 0 rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.06);}
  body:not(.strip) #update-card::before{background:var(--syn-blue);}
  body:not(.strip) #update-card .rc-close{color:var(--ide-ink);}
  body:not(.strip) #bn-chip{background:var(--ide-panel2);border-color:var(--ide-red);color:#FF9D97;
    box-shadow:inset 6px 0 0 var(--ide-red), inset 0 -4px 0 rgba(229,83,75,.2), 0 2px 0 rgba(0,0,0,.35);}
  body:not(.strip) #bn-chip:hover{background:var(--ide-panel3);}

  body:not(.strip) textarea{background-color:var(--ide-panel2);border-color:var(--ide-line);
    color:var(--ide-ink);font-family:var(--mono);
    background-image:repeating-linear-gradient(transparent 0 25px, rgba(167,157,178,.22) 25px 26px);
    box-shadow:inset 0 2px 0 rgba(0,0,0,.3);}
  body:not(.strip) select{background:var(--ide-panel2);border-color:var(--ide-line);color:var(--ide-ink);

  body:not(.strip) input[type=range]{accent-color:var(--syn-str);}
  body:not(.strip) .note{color:var(--ide-sub);}

  body:not(.strip) #bubble{background:var(--ide-paper);color:#463126;border-color:var(--ide-line);
    box-shadow:0 2px 0 rgba(0,0,0,.35), inset 0 -1px 0 #fff;}

  body:not(.strip) #combo-info{color:var(--syn-str);}
  body:not(.strip) .bn{color:var(--ide-errtx);}
  body:not(.strip) .celebrate{color:var(--syn-str);}

  /* ==== Editor v2: the panel is an open source file (menu skin only) ====
     Extends OFFICE_ART_DIRECTION §3. Owner's v2 direction supersedes its old
     no-breadcrumb/no-minimap limit and orange-primary rule. No game state here.
     Latin glyphs use mono; Japanese keeps the existing readable sans fallback. */
  @font-face{font-family:"Miyuke Editor Latin";
    src:local("Cascadia Code"),local("Consolas"),local("DejaVu Sans Mono");
    unicode-range:U+0000-024F,U+2000-206F,U+2190-21FF;}
  body:not(.strip){
    --jp:"Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo UI","Noto Sans JP",sans-serif;
    --mono:"Miyuke Editor Latin",ui-monospace,"Cascadia Code",Consolas,var(--jp);
    --ide-sub:#A6A6A6; --sub:var(--ide-sub); --ink-soft:var(--ide-sub);
    --ide-comment:#A8B99C; --syn-purple:#D6A0D1;
    --red:var(--ide-errtx); --warn:var(--ide-errtx);
    --ide-badge:#A43E39;
    font-family:"Miyuke Editor Latin",var(--jp);
  }
  body:not(.strip) main{padding-top:10px;}
  /* Existing status row gains branch / language furniture, without another row. */
  body:not(.strip) header::before{content:"⑂ main";font:12px var(--mono);
    color:var(--ide-ink);padding:0 9px;border-right:1px solid #454545;}
  body:not(.strip) header::after{content:"UTF-8   🐱 MiyukeScript   Spaces: 2";
    margin-left:auto;padding:0 10px;font:11px var(--mono);color:var(--ide-ink);white-space:pre;}
  body:not(.strip) header .res{padding-left:5px;padding-right:5px;}
  body:not(.strip) .res small{color:var(--ide-ink);}
  body:not(.strip) .res.has-bugs{color:#FFE0DC;}
  body:not(.strip) .res.diag{color:#FFE3A6;}
  body:not(.strip) .res.bump{animation:editor2ResourceBump .45s ease;}
  @keyframes editor2ResourceBump{0%,100%{box-shadow:none;}30%{box-shadow:inset 0 -2px 0 #F8CF69;}}
  body:not(.strip) .res-bugs::before{content:"✗";font-family:var(--mono);}
  body:not(.strip) .res-bugs .res-ic{display:none;}
  body:not(.strip) #btn-to-overlay{order:1;margin-left:8px;background:var(--ide-badge);
    border-width:1px;border-radius:3px;box-shadow:none;}
  body:not(.strip) #btn-to-overlay:hover{background:#B54842;filter:none;}
  /* Square file tabs sit directly on the breadcrumb/editor surface. Marks are
     decorative, not close controls; existing count / NEW badges remain intact. */
  body:not(.strip) .tabs{gap:0;margin:8px 0 0;padding:0;}
  body:not(.strip) .tabs button{border:1px solid var(--ide-linesoft);border-bottom:0;
    border-radius:3px 3px 0 0;padding:9px 28px 9px 12px;transform:none;
    box-shadow:inset 0 -2px 0 #141414;color:var(--ide-sub);}
  body:not(.strip) .tabs button.on{transform:none;background:var(--ide-panel);
    border-color:var(--ide-line);color:var(--ide-ink);box-shadow:inset 0 3px 0 var(--syn-str);}
  body:not(.strip) .tabs button:active,body:not(.strip) .tabs button.on:active{transform:none;}
  body:not(.strip) .tabs button.on::after{bottom:-1px;height:2px;}
  body:not(.strip) .tabs button.locked{filter:none;color:var(--ide-sub);border-top-style:dashed;}
  body:not(.strip) .editor-tabmark{position:absolute;right:9px;top:50%;transform:translateY(-50%);
    font:13px var(--mono);color:var(--ide-sub);pointer-events:none;}
  body:not(.strip) .editor-tabmark::before{content:"×";}
  body:not(.strip) .on .editor-tabmark::before{content:"●";color:var(--syn-str);}

    white-space:nowrap;overflow:hidden;}

  /* Six-pixel minimap whisper: decorative dashes, no data or interaction. */

    width:6px;pointer-events:none;opacity:.22;

  body:not(.strip) .hero-name,body:not(.strip) .sc-top .nm{color:var(--syn-str);}

  body:not(.strip) .hero::after{content:"}";position:absolute;right:9px;bottom:6px;
    color:var(--ide-sub);font-family:var(--mono);pointer-events:none;}

  body:not(.strip) .hero .chiprow .vchip:nth-child(2) b{color:var(--ide-errtx);}
  body:not(.strip) #proj-label[style*="217, 83, 79"]{color:var(--ide-errtx)!important;}
  /* Run action / ghost actions. Disabled labels stay at full text contrast. */
  body:not(.strip) button{border-width:1px;border-radius:3px;box-shadow:none;background:transparent;}
  body:not(.strip) button:hover{background:var(--ide-panel3);box-shadow:none;}
  body:not(.strip) button:active{box-shadow:none;}
  body:not(.strip) button.primary{background:var(--syn-green);border-color:var(--syn-green);
    color:var(--ide-taboff);text-shadow:none;box-shadow:none;}
  body:not(.strip) button.primary::before{content:"▶";margin-right:6px;font-family:var(--mono);}
  body:not(.strip) button.primary:hover{background:#9AEEAF;filter:none;}
  body:not(.strip) button:disabled{filter:none;color:var(--ide-sub);background:var(--ide-taboff);box-shadow:none;}
  body:not(.strip) .buybtn:disabled .pricetag{background:transparent;color:var(--ide-sub);border-color:var(--ide-line);}
  body:not(.strip) button.primary:disabled,body:not(.strip) button.primary:disabled:hover{

  body:not(.strip) .stamp.lock{filter:none;opacity:1;}
  /* Folding regions keep their exact click targets, summaries and open state. */
  body:not(.strip) .fold{border-width:1px;border-radius:2px;box-shadow:none;}
  body:not(.strip) .fold-head{padding:6px 10px;letter-spacing:normal;}
  body:not(.strip) .fold.closed .fold-head,
  body:not(.strip) .fold:not(.closed) .fold-head{border-radius:2px;border-bottom-width:1px;}
  body:not(.strip) .fold-head>span:nth-child(2){color:var(--ide-comment);}
  body:not(.strip) .fold-head>span:nth-child(2)::before{content:"#region ";font-family:var(--mono);}
  body:not(.strip) .fold.closed .fold-head>span:nth-child(2)::after{content:" { … }";color:var(--ide-sub);font-family:var(--mono);}
  body:not(.strip) .fold-body{margin-left:18px;border-left:1px solid var(--ide-line);}
  body:not(.strip) .fold-arrow{color:var(--ide-ink);}
  /* CI steps reuse stageStatus(). Green flow gets a restrained running ring;
     waiting and error nodes stay still. No invented pipeline state. */
  body:not(.strip) .ratestrip{counter-reset:ci-step;gap:9px;}
  body:not(.strip) .ratecell{--pipe-tone:var(--syn-green);border-width:1px;
    border-top:2px solid var(--pipe-tone);border-radius:3px;box-shadow:none;}

  body:not(.strip) .ratecell.pipe-red{--pipe-tone:var(--ide-errtx);}
  body:not(.strip) .ratecell .rh{color:var(--syn-purple);}
  body:not(.strip) .ratecell .rh::after{counter-increment:ci-step;content:counter(ci-step,decimal-leading-zero);
    margin-left:auto;color:var(--ide-sub);font-family:var(--mono);}
  body:not(.strip) .ratecell .rv{color:var(--syn-num);}
  body:not(.strip) .ratecell .lampdot{border:2px solid var(--ide-panel2);outline:1px solid var(--pipe-tone);}
  body:not(.strip) .ratecell.pipe-green .lampdot{animation:editor2PipelinePulse 2.4s ease-out infinite;}
  @keyframes editor2PipelinePulse{0%,100%{box-shadow:0 0 0 0 #7BE49500;}40%{box-shadow:0 0 0 3px #7BE49535;}}
  @media (min-width:761px){
    body:not(.strip) .ratecell:not(:last-child)::after{right:-10px;top:14px;width:10px;height:1px;}

  /* Tutorial gates resemble commented blocks, never faded functional text. */
  body:not(.strip) .lockpanel,body:not(.strip) .seclock{position:relative;color:var(--ide-comment);

  body:not(.strip) .lockpanel::after,body:not(.strip) .seclock::after{content:"*/";

  @media (prefers-reduced-motion:reduce){

<script>
/* デスクトップ版の形態（form）とロール（role）。
   2ウィンドウ化 (Phase 0/1, 設計 research/TWO_WINDOW_ARCHITECTURE.md):
   帯ウィンドウ (ラベル main, ロール owner) は画面下部の透明な帯に固定され、
   二度と変形しない。管理画面は第2ウィンドウ (ラベル menu, ロール viewer) が
   同じ index.html を「フル形態」で読み、帯からのスナップショットで描画する。
   形態はウィンドウごとに固定で、「切替」ではなく boot 時に1回だけ決まる。
   ブラウザ (Tauri でない環境) は従来どおり1ページで両形態を切り替える solo。
   Tauri からは初期化スクリプトで __MIYUKE_MODE__ / __MIYUKE_ROLE__ が渡される。
   ブラウザ確認用に #strip ハッシュでもストリップに入れる（旧 #overlay も互換）。 */
(function(){
  "use strict";
  var isTauri = !!window.__TAURI__;
  var role = window.__MIYUKE_ROLE__;
  if(role !== "owner" && role !== "viewer" && role !== "solo")
    role = isTauri ? "owner" : "solo";
  window.__MIYUKE_ROLE__ = role;
  function tauriInvoke(cmd, args){
    try{
      var T = window.__TAURI__;
      if(T && T.core && T.core.invoke) return T.core.invoke(cmd, args);
      if(T && T.invoke) return T.invoke(cmd, args);
    }catch(e){}
    return null;
  }
  /* v2.4.1: invoke が届かない環境への迂回路。応答が 700ms 無いコマンドは
     Rust が起動時に立てた 127.0.0.1 beacon へ直接 GET して実行させる
     (init script で渡されたポート+起動毎トークンを使う。通常環境では
     invoke が即答するので beacon は一切使われない) */
  function beaconCmd(c, t){
    try{
      var B = window.__MIYUKE_BEACON__;
      if(!B) return;
      var u = "http://127.0.0.1:" + B.port + "/cmd?k=" + B.token + "&c=" + c + (t ? "&t=" + encodeURIComponent(t) : "");
      fetch(u, { mode: "cors" }).catch(function(){});
    }catch(e){}
  }
  function armBeaconWatch(p, c, t){
    if(!p || !p.then){ beaconCmd(c, t); return; }
    var settled = false;
    p.then(function(){ settled = true; }, function(){ settled = true; });
    setTimeout(function(){ if(!settled) beaconCmd(c, t); }, 700);
  }
  function normalize(mode){
    if(mode === "overlay") return "strip";   /* 旧称は互換のためストリップに寄せる */
    return mode;
  }
  function initialMode(){
    var m = normalize(window.__MIYUKE_MODE__);
    if(m === "strip" || m === "full") return m;
    if(location.hash === "#strip" || location.hash === "#overlay") return "strip";
    return "full";
  }
  function applyMode(mode){
    mode = normalize(mode);
    if(mode !== "strip" && mode !== "full") return;
    window.__MIYUKE_MODE__ = mode;
    document.body.classList.toggle("strip", mode === "strip");
    var back = document.getElementById("btn-to-overlay");
    if(back) back.style.display = (mode === "full" && isTauri) ? "" : "none";
    if(mode === "full" && isTauri && role !== "viewer"){
      /* solo/旧来経路の防御策: フル形態では全域ヒットゾーンを1回送り、帯用の
         クリック透過が残っていても管理画面では絶対に素通しにならないようにする。
         viewer は帯のヒットゾーンを決して上書きしない（送るのは帯だけ） */
      var fp = tauriInvoke("set_hit_zones", { zones: [[0, 0, window.innerWidth || 0, window.innerHeight || 0]] });
      if(fp && fp.catch) fp.catch(function(){});
    }
    if(window.__miyukeOnModeChange){
      try{ window.__miyukeOnModeChange(mode); }catch(e){}
    }
  }
  window.__miyukeApplyMode = applyMode;
  applyMode(initialMode());
  var openBtn = document.getElementById("strip-open");
  if(openBtn) openBtn.addEventListener("click", function(){
    if(!isTauri){ applyMode("full"); return; }  /* ブラウザプレビューではページ内切替だけ */
    /* 帯は変形しない。「ひらく」= 管理ウィンドウ (menu) を Rust に出してもらう。
       2.3.8 の実バグ修正: open_menu は tab: Option<String> を取るが、空オブジェクト
       {} を渡すと引数解決に失敗し、返る promise が reject されて無言で死んでいた
       (ボードクリックの { tab: "proj" } は通っていた)。キー有りの形で渡し、
       失敗時は互換エイリアス set_mode_full へフォールバックする */
    var p = tauriInvoke("open_menu", { tab: null });
    var fallback = function(){
      var q = tauriInvoke("set_mode_full");
      if(q && q.catch) q.catch(function(){});
      armBeaconWatch(q, "open-menu");
    };
    if(!p) fallback();
    else if(p.catch) p.catch(fallback);
    armBeaconWatch(p, "open-menu");
  });
  var hideBtn = document.getElementById("strip-hide");
  if(hideBtn) hideBtn.addEventListener("click", function(){
    var p = tauriInvoke("hide_main_window");
    if(p && p.catch) p.catch(function(){});
    armBeaconWatch(p, "hide-strip");
  });
  var layoutBtn = document.getElementById("strip-layout");
  if(layoutBtn) layoutBtn.addEventListener("click", function(){
    if(typeof toggleLayoutEdit === "function") toggleLayoutEdit();
  });
  var grip = document.getElementById("strip-grip");
  var gripDownAt = null;
  if(grip) grip.addEventListener("pointerdown", function(e){
    gripDownAt = { x: e.clientX, y: e.clientY, t: Date.now() };
    if(!isTauri) return;
    e.preventDefault();
    /* OS のドラッグ移動を開始 (帯ウィンドウ = このページのウィンドウ)。
       移動後の位置は Rust 側 (Moved イベント) で保存される */
    try{
      var W = window.__TAURI__ && window.__TAURI__.window;
      if(W && W.getCurrentWindow){
        var r = W.getCurrentWindow().startDragging();
        if(r && r.catch) r.catch(function(){});
      }
    }catch(err){}
  });
  /* Stage 3: グリップのタップ (動かさずに離す) = かくす。旧「かくす」チップの移設先。
     ドラッグと区別するため、移動 6px 未満かつ 400ms 未満だけをタップとみなす */
  if(grip) grip.addEventListener("pointerup", function(e){
    if(!gripDownAt) return;
    var moved = Math.hypot(e.clientX - gripDownAt.x, e.clientY - gripDownAt.y);
    var dt = Date.now() - gripDownAt.t;
    gripDownAt = null;
    if(!isTauri || moved > 6 || dt > 400) return;
    var p = tauriInvoke("hide_main_window");
    if(p && p.catch) p.catch(function(){});
    armBeaconWatch(p, "hide-strip");
  });
  var backBtn = document.getElementById("btn-to-overlay");
  if(backBtn) backBtn.addEventListener("click", function(){
    if(isTauri && role === "viewer"){
      /* 「デスクトップに戻す」= 管理ウィンドウを閉じる (帯は最初からデスクトップにいる) */
      tauriInvoke("close_menu");
      return;
    }
    var p = tauriInvoke("set_mode_strip");
    if(p && p.then) p.then(function(){ applyMode("strip"); }, function(){});
    else if(!isTauri) applyMode("strip");
  });
})();
</script>

function deptChief(role){
  let best = null;
  for(const st of S.staff) if(st.role === role && (!best || st.lv > best.lv)) best = st;
  return best;
}
function buyDept(role){
  if(!S.depts) S.depts = freshDepts();
  if(deptLv(role) >= DEPT_MAX_LV){ say("その部署はもう最大レベルにゃ"); return; }

}

   価格 = base × (1 + 総収入/25000) × 1.5^(その日の購入回数)。
   稼ぐほど高くなるので、終盤でも「余り続ける」ことがない設計 */
const TREAT_DEFS = [
  { id:"treat_snack", name:"🎁 高級おやつ",   base:150, desc:"集中力 +30、その後30分 生産 +15%" },
  { id:"treat_toy",   name:"🎁 高級おもちゃ", base:200, desc:"集中力 +10、その後30分 クリック効率 +10%" }
];
function treatCost(def){
  return Math.ceil(def.base * (1 + S.totals.coinsEarned / 25000) * Math.pow(1.5, S.today.treats || 0));
}
function buyTreat(id){
  const def = TREAT_DEFS.find(t => t.id === id);
  if(!def) return;
  const cost = treatCost(def);
  if(S.coins < cost){ say("コインが足りないにゃ"); return; }

/* Sprint 4: 全員まとめて +1Lv（全額払える時だけ・中途半端な適用はしない） */
function buyBulkTrain(){
  const targets = S.staff.filter(s => (s.lv || 1) < STAFF_MAX_LV);
  if(!targets.length){ say("みんな最大レベルにゃ"); return; }
  const total = targets.reduce((a, s) => a + trainCost(s), 0);
  if(S.coins < total){ say("全員分にはコインが足りないにゃ（あと " + fmt(total - S.coins) + "🪙）"); return; }
  S.coins -= total;
  for(const st of targets) st.lv = (st.lv || 1) + 1;
  SoundKit.play("purchase");
  addLog("🎓 全員+1Lv育成（-" + fmt(total) + "🪙）");
  say("みんな1レベル上がったにゃ！");
  save(); renderPanel();
}
function staffSums(){
  const s = { prog:0, progW:0, qa:0, testDP:0, ship:0, rp:0, careW:0, count:0, byRole:{} };
  for(const st of S.staff){
    const m = staffOutMult(st) * deptMult(st.role), def = STAFF_ROLES[st.role];   /* Sprint 4: 熟練ボーナス込み / Phase C: 部署Lv 倍率 */
    s.byRole[st.role] = (s.byRole[st.role]||0) + 1;
    if(st.role === "prog"){ s.prog += def.out * m; s.progW += m; }
    if(st.role === "test"){ s.qa += def.out * m; s.testDP += 4 * m; }
    if(st.role === "carry"){ s.ship += def.out * m; }
    if(st.role === "research"){ s.rp += def.out * m; }
    if(st.role === "care"){ s.careW += m; }
    s.count++;
  }
  return s;
}

let sessBase = { releases:0, coinsEarned:0, startedAt:Date.now() };
function save(){
  if(IS_VIEWER) return;   /* 単一書き手: viewer はセーブに一切触らない (第2層ガード) */
  try{
    S.lastTick = Date.now();
    if(sessBase){
      S.lastSession = {
        releases: Math.max(0, S.totals.releases - sessBase.releases),
        coinsEarned: Math.max(0, Math.round(S.totals.coinsEarned - sessBase.coinsEarned)),
        ms: Math.max(0, Date.now() - sessBase.startedAt),
        endedAt: Date.now()
      };
    }
    localStorage.setItem(SAVE_KEY, JSON.stringify(S));
  }catch(e){}
}
function load(){
  if(IS_VIEWER) return false;   /* viewer は load もしない (レプリカはスナップショット由来) */
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    const data = JSON.parse(raw);
    const f = freshState();
    /* 注意: Object.assign(f, data) で f.today 等は data 側に差し替わるため、
       既定値オブジェクトを先に退避してからマージする（新フィールドの補完用） */
    const defToday = f.today, defTotals = f.totals, defSettings = f.settings, defLine2 = f.line2;
    S = Object.assign(f, data);

    S.totals = Object.assign(defTotals, data.totals||{});

    /* v2.4.6: 帯サイズの基準変更 (sakuri 指示)。旧の意味 (210px 基準の絶対倍率) で

       新規セーブは defSettings 側に stripSizeV:2 が入っているため対象外 */
    if(S.settings.stripSizeV !== 2){
      const oldSize = Number(S.settings.stripSize);
      if(isFinite(oldSize) && oldSize > 0)
        S.settings.stripSize = migrateStripSize(oldSize);
      S.settings.stripSizeV = 2;
    }
    if(!S.layout || typeof S.layout !== "object" || Array.isArray(S.layout)) S.layout = {};
    /* Phase E: 小物・機能オブジェクトの配置（追加のみ・不在 = 従来の初期配置） */
    if(!S.layoutProps || typeof S.layoutProps !== "object" || Array.isArray(S.layoutProps)) S.layoutProps = {};
    if(typeof S.settings.snapLayout !== "boolean") S.settings.snapLayout = true;
    /* v1 → v2 マイグレーション: 新フィールドを既定値で補完する */
    if(!Array.isArray(S.staff)) S.staff = [];

    /* バッチ9: COATS 外の毛柄 (旧 mike2) の個体は失わず、決定的に着せ替える */
    for(const st of S.staff){ if(st && !COATS.includes(st.coat)) st.coat = recoatFor(st); }

    officeTierSeen = officeTier(S);

    /* Phase B・最高到達社格: 旧セーブには無いので初期値は現在のスタジオLv。
       記録が現在を下回る不整合があれば現在に揃える（最高到達は現在以上のはず） */
    if(typeof data.maxStudioLv !== "number" || S.maxStudioLv < S.studioLv) S.maxStudioLv = S.studioLv;
    /* Phase C: 部署Lv・大型案件・希望ジャンル・営業ローテーション（旧セーブには無い） */
    if(!S.depts || typeof S.depts !== "object") S.depts = freshDepts();
    for(const r of Object.keys(DEPTS)) if(typeof S.depts[r] !== "number" || S.depts[r] < 1) S.depts[r] = 1;
    if(typeof S.bigDeal === "undefined") S.bigDeal = null;
    if(typeof S.reqGenrePref === "undefined") S.reqGenrePref = null;
    if(typeof S.salesRot !== "number") S.salesRot = 0;
    if(typeof S.reqHoldUntil !== "number") S.reqHoldUntil = 0;
    /* Phase D: 子会社（旧セーブには無い）。配分は読み込み時に合計100%へ正規化 */
    if(!Array.isArray(S.subs)) S.subs = [];
    if(typeof S.subSeq !== "number") S.subSeq = S.subs.length;
    for(const sub of S.subs){
      if(typeof sub.staff !== "number") sub.staff = 5;
      if(typeof sub.lv !== "number") sub.lv = 1;
      if(typeof sub.alloc !== "number") sub.alloc = 0;
    }
    normalizeAlloc();
    /* 拡張ウェーブ F: フィーバーゲージ（旧セーブには無い） */
    if(!S.fever || typeof S.fever !== "object") S.fever = { gauge: 0 };
    if(typeof S.fever.gauge !== "number") S.fever.gauge = 0;
    /* 拡張ウェーブ G: 負債・ブランド・外注クールダウン（旧セーブには無い） */
    if(typeof S.debt !== "number") S.debt = 0;
    if(typeof S.brand !== "number") S.brand = 0;
    if(typeof S.vendorReadyAt !== "number") S.vendorReadyAt = 0;
    for(const st of S.staff) if(st.role === "sales" && !st.genre){
      const pool = unlockedGenres();
      st.genre = pool.length ? pool[Math.floor(Math.random()*pool.length)].id : "app";
    }
    if(!S.clickUp || typeof S.clickUp !== "object") S.clickUp = {};
    /* Sprint 1 追加フィールド（旧セーブには無いので既定値で補完） */
    if(typeof S.nextRequestGenre === "undefined") S.nextRequestGenre = null;
    if(typeof S.bigDrawStreak !== "number") S.bigDrawStreak = 0;
    /* Sprint 4 追加フィールド（名前履歴・反復研究Lv・ご褒美バフ） */
    if(!Array.isArray(S.recentNames)) S.recentNames = [];
    if(!S.researchLv || typeof S.researchLv !== "object") S.researchLv = {};
    if(!S.buffs || typeof S.buffs !== "object") S.buffs = {};
    /* Sprint 3 追加フィールド（旧セーブには無いので既定値で補完。
       dustTotal が無い旧セーブでは、倍率が従来と一致するよう所持星屑と同値にする） */
    if(!S.dustPerks || typeof S.dustPerks !== "object") S.dustPerks = {};
    /* dustTotal は freshState の既定 0 と区別できないので、生セーブ側で判定する */
    if(typeof data.dustTotal !== "number") S.dustTotal = S.dust || 0;
    for(const p of [S.project, S.line2 && S.line2.project]){
      if(p && typeof p.planning !== "boolean"){ p.planning = false; if(typeof p.ideaCost !== "number") p.ideaCost = 0; }
    }
    S.wip = Object.assign({ code:0, tested:0, built:0 }, data.wip||{});
    S.line2 = Object.assign(defLine2, data.line2||{});
    S.line2.wip = Object.assign({ code:0, tested:0, built:0 }, (data.line2||{}).wip||{});
    if(S.today.date !== todayKey()){
      S.today = { date:todayKey(), keys:0, cursorPx:0, lines:0, bugs:0, releases:0, commits:0, treats:0 };
    }
    /* チュートリアル導線の移行: tut が無い旧セーブは、達成済みの事実から
       ステージを導出し (deriveStage)、seen を全部埋めて卒業扱いにする
       (既存プレイヤーには導線もロックも一切出ない)。tut がある場合は
       欠けた部分だけ既定値で補完する */
    if(!data.tut || typeof data.tut !== "object" || typeof data.tut.stage !== "number"){
      const seenAll = {};
      for(const k of TUT_SEEN_KEYS) seenAll[k] = true;
      S.tut = { stage: deriveStage(S), seen: seenAll, skipped: false };
    } else {
      S.tut = { stage: data.tut.stage,
                seen: (data.tut.seen && typeof data.tut.seen === "object") ? data.tut.seen : {},
                skipped: !!data.tut.skipped };
    }
    return true;
  }catch(e){ return false; }
}

/* ---------- チュートリアル導線 (段階的開示 / FTUE) ----------
   設計: research/TUTORIAL_DESIGN.md。ステージは「測定可能な事実」だけで進み、
   経過時間では絶対に進まない。ロックは表示と導線だけの話で、価格・レート・
   経済定数には一切触らない。ロック判定の原則は全箇所共通:
     locked = stageBelow(feature) && !ownsAny(feature)   (所持が常に勝つ)
   進行とセーブは owner/solo だけが持ち、viewer はスナップショットの
   S.tut を鏡写しにして同じロック・バッジ・チップを描く (プロトコル変更なし)。
   帯にモーダルや暗転は出さない。解放は吹き出し (say) と目的チップだけで知らせる */
const TUT_STAGE = { START:0, RELEASE:1, RESEARCH:2, CLICK:3, STAFF:4, REQUEST:5, LINE2:6, PRESTIGE:7 };
const TUT_STAGE_NAMES = ["はじまり", "初リリース", "研究", "応援強化", "仲間", "依頼", "第2ライン", "卒業"];
/* タブが実体になるステージ (proj と settings は常時開放 = 表に無い) */
const TUT_TAB_STAGE = { shelf:1, stats:1, factory:1, research:2, click:3, staff:4, requests:5 };
/* 解放イベントごとの 🆕 対象: "タブ:そのタブの内容が増えるステージ" */
const TUT_FRESH = {
  shelf:["shelf:1"], stats:["stats:1"],
  factory:["factory:1", "factory:4", "factory:6", "factory:7"],
  research:["research:2"], click:["click:3"], staff:["staff:4"], requests:["requests:5"]

/* seen の既知キー全部 (移行時にベテラン分を一括で埋めるために列挙する) */
const TUT_SEEN_KEYS = ["s1", "s2", "s25", "s3", "s4", "s5", "s6", "input_hint", "first_bug",
  "q1", "q2", "q3", "q4", "q5", "q6"];
for(const t of Object.keys(TUT_FRESH)) for(const k of TUT_FRESH[t]) TUT_SEEN_KEYS.push("visit:" + k);

function tutAnyVal(o){ return !!o && Object.keys(o).some(k => o[k]); }
function tutOwnsUpgrades(){ return Object.keys(S.upgrades).some(k => (S.upgrades[k]||0) > 0); }
function tutOwnsResearch(){ return tutAnyVal(S.research) || Object.keys(S.researchLv||{}).some(k => (S.researchLv[k]||0) > 0); }
function tutOwnsClick(){ return Object.keys(S.clickUp||{}).some(k => (S.clickUp[k]||0) > 0); }
function tutOwnsStaff(){ return S.staff.length > 0 || S.totals.hired >= 1; }
function tutOwnsDust(){ return S.prestiges >= 1 || tutAnyVal(S.dustPerks); }
function tutOwnsFactory(){ return tutOwnsUpgrades() || S.line2.unlocked || tutOwnsDust(); }
function tutTabOwns(tabId){
  switch(tabId){
    case "shelf": case "stats": return S.totals.releases >= 1 || S.shelf.length > 0;
    case "factory": return tutOwnsFactory();
    case "research": return tutOwnsResearch();
    case "click": return tutOwnsClick();
    case "staff": return tutOwnsStaff();
    case "requests": return !!S.activeRequest;
  }
  return false;
}
/* 累計獲得 RP: 研究P は研究にしか使えないので「所持 + 消費済み」で正確に復元できる */
function cumRP(){
  let v = Math.floor(S.rp);
  for(const d of RESEARCH_DEFS) if(S.research[d.id]) v += d.cost;
  const lv = (S.researchLv && S.researchLv.res_report) || 0;
  for(let i = 0; i < lv; i++) v += repeatResearchCost(i);
  return v;
}
/* 達成済みの事実だけからステージを導出する (移行・リセット・ロック判定の共通土台) */
function deriveStage(st){
  let s = TUT_STAGE.START;
  if(st.totals.releases >= 1) s = Math.max(s, TUT_STAGE.RELEASE);
  if(tutAnyVal(st.research) || st.totals.releases >= 2) s = Math.max(s, TUT_STAGE.RESEARCH);
  if(Object.keys(st.clickUp || {}).some(k => (st.clickUp[k]||0) > 0)) s = Math.max(s, TUT_STAGE.CLICK);
  if(st.totals.hired >= 1 || (st.staff && st.staff.length >= 1)) s = Math.max(s, TUT_STAGE.REQUEST);  /* 仲間(4) を含む */
  if(st.totals.releases >= 5) s = Math.max(s, TUT_STAGE.REQUEST);
  if(st.research && st.research.res_line2) s = Math.max(s, TUT_STAGE.LINE2);
  if(st.line2 && st.line2.unlocked) s = Math.max(s, TUT_STAGE.LINE2);
  if(st.prestiges >= 1 || (st.dustTotal || 0) >= 5) s = Math.max(s, TUT_STAGE.PRESTIGE);
  return s;
}
/* ---------- オフィスの規模ティア (OFFICE_ART_DIRECTION + sakuri の規模進化案) ----------
   会社の成長に合わせて帯の家具・素材が変わるための土台。deriveStage と同じく
   「達成済みの事実だけから導出する純関数」で、セーブには保存しない (事実が
   進めば自動で上がり、巻き戻らない)。見た目への反映は次パス (帯の家具
   ティア化) で行う — ここでは導出と検証だけ。
     tier 0 創業ガレージ: 木の看板・木の机・単モニタ (現在の姿)
     tier 1 小さなオフィス: 初リリース + 初雇用 — 会社らしくなり始める
     tier 2 開発スタジオ: 第2ライン開設 or スタジオ Lv3 — カンバン白板・
            デュアルモニタ・ラミネート机に更新される規模
     tier 3 引っ越し後の本社: prestiges >= 1 — フルモダン (サーバラック等) */
const OFFICE_TIER_NAMES = ["創業ガレージ", "小さなオフィス", "開発スタジオ", "本社", "大きな本社", "グループ本社"];
/* ティア上昇の祝い用トラッカー。null = 未初期化。load() が読み込み時点の
   ティアで初期化し、tick() がセッション中の上昇だけを検知する */
let officeTierSeen = null;
function officeTier(st){
  let t = 0;
  const releases = (st.totals && st.totals.releases) || 0;
  const hired = Math.max((st.totals && st.totals.hired) || 0, (st.staff && st.staff.length) || 0);
  if(releases >= 1 && hired >= 1) t = Math.max(t, 1);
  if((st.line2 && st.line2.unlocked) || (st.studioLv || 1) >= 3) t = Math.max(t, 2);
  if((st.prestiges || 0) >= 1) t = Math.max(t, 3);
  /* Phase B・家具ティアの床ルール（仕様書2節・レビュー室指摘の明文化）:
     ティアは max(現行の導出, 社格ティア) で、最高到達社格の段を下回らない。
     社格ティア = 最高到達Lv − 1（Lv1→0 … Lv6→5）。現在と記録の大きい方を
     使うので、未移行の旧セーブ（記録なし＝現在Lv）でも現在Lvが床になる。
     売却で studioLv が 1 に戻っても記録が残るため、見た目は格下げしない。
     注: 現行の絵のゲートは >=1 / >=2 の2段だけなので、ティア 3〜5 の家具は
     ティア 3 と同じ絵になる。段差は社格チップ・人数・ティア名と祝いで読む */
  const best = Math.max(st.studioLv || 1, st.maxStudioLv || 0);
  t = Math.max(t, best - 1);
  return t;
}
/* ロック判定に使う実効ステージ: 記録 (S.tut.stage) と事実 (derive) の大きい方。
   tutCheck が毎秒同期するので通常は一致するが、事実が先行した瞬間にも
   「もう持っているのにロックされる」状態を作らないための安全網 */
function tutEffStage(){
  if(!S.tut) return TUT_STAGE.PRESTIGE;
  return Math.max(S.tut.stage, deriveStage(S));
}
function tutLocked(needStage, owns){
  if(!S.tut || S.tut.skipped) return false;
  if(tutEffStage() >= needStage) return false;
  return !owns;
}
function tutTabLocked(tabId){
  const need = TUT_TAB_STAGE[tabId];
  if(need === undefined) return false;   /* proj / settings は絶対にロックしない */
  return tutLocked(need, tutTabOwns(tabId));
}
/* 次ステージへの述語 (index = 現在のステージ)。すべて測定可能な事実のみ */
const TUT_NEXT = [
  () => S.totals.releases >= 1,                                /* 0→1 初リリース */
  () => cumRP() >= 2,                                          /* 1→2 研究 */
  () => S.totals.clicks >= 30 || S.totals.releases >= 4,       /* 2→3 応援強化 */
  () => S.totals.coinsEarned >= 220,                           /* 3→4 仲間 */
  () => S.totals.hired >= 1 || S.totals.releases >= 5,         /* 4→5 依頼 */
  () => !!S.research.res_line2,                                /* 5→6 第2ライン */
  () => prestigePreview().gain >= 3                            /* 6→7 引っ越し (卒業)。第2ウェーブ I で売却下限 3 に一致 */
];
/* 解放ビート (吹き出し1回だけ)。設計 §7 の文案 */
const TUT_BEATS = {
  1: "🪙 たまったにゃ。『ひらく』→工場で道具が買えるよ",
  2: "🔬 研究ポイントがたまったにゃ。研究タブが開いたよ",

};
const TUT_BEAT_KEYS = { 1:"s1", 2:"s2", 3:"s25", 4:"s3", 5:"s4", 6:"s5", 7:"s6" };
let tutPendingBeat = null;   /* { at, text } 解放セリフは演出の後に少し遅らせる */
let tutCelebrate = null;     /* { text, until } 目的チップの完了フラッシュ */

function tutLatchQuests(){
  if(!S.tut) return false;
  const seen = S.tut.seen;
  const facts = {
    q1: tutOwnsUpgrades(), q2: tutOwnsResearch(), q3: tutOwnsClick(),
    q4: S.totals.hired >= 1 || S.staff.length > 0,
    q5: !!S.activeRequest, q6: !!S.line2.unlocked
  };
  const stageOf = { q1:1, q2:2, q3:3, q4:4, q5:5, q6:6 };
  let changed = false;
  for(const k of Object.keys(facts)){
    if(facts[k] && !seen[k]){
      seen[k] = true; changed = true;
      if(tutPrimed && S.tut.stage === stageOf[k] && !S.tut.skipped)
        tutCelebrate = { text: "🎉 できたにゃ！", until: Date.now() + 4000 };
    }
  }
  tutPrimed = true;
  return changed;
}
/* 進行チェック本体: tick と各アクションの末尾から呼ばれる (owner/solo のみ) */
function tutCheck(){
  if(IS_VIEWER || !S.tut) return;
  const now = Date.now();
  let changed = tutLatchQuests();
  if(tutPendingBeat && now >= tutPendingBeat.at){
    const t = tutPendingBeat.text; tutPendingBeat = null;
    say(t);
  }
  if(!S.tut.skipped && S.tut.stage < TUT_STAGE.PRESTIGE){
    const from = S.tut.stage;
    while(S.tut.stage < TUT_STAGE.PRESTIGE && TUT_NEXT[S.tut.stage]()) S.tut.stage++;
    if(S.tut.stage !== from){
      /* 途中ステージのビートは seen だけ立てて連打しない。到達点の分だけ予約 */
      for(let s = from + 1; s <= S.tut.stage; s++){
        const bk = TUT_BEAT_KEYS[s];
        if(bk) S.tut.seen[bk] = true;
      }
      const to = S.tut.stage;
      /* 応援タブの自動解放 (リリース4本経由・クリック30未満) はバッジのみで無音 */
      const silentClick = to === TUT_STAGE.CLICK && S.totals.clicks < 30;
      if(!silentClick) tutPendingBeat = { at: now + 5000, text: TUT_BEATS[to] };
      changed = true;
      bumpRev();
    }
  }
  /* OS入力カウントの文脈ヒント: Stage 1 以降に吹き出し1回だけ。
     同意の取得ではなく「存在の通知」 (有効化は設定タブでのみ起きる) */
  if(!S.tut.seen.input_hint){
    if(S.settings.inputCount || !inTauri() || S.tut.skipped){
      S.tut.seen.input_hint = true;   /* 既に有効 / 対象外なら静かに消費 */
    } else if(S.tut.stage >= TUT_STAGE.RELEASE && !tutPendingBeat){
      S.tut.seen.input_hint = true;
      tutPendingBeat = { at: now + 20000,
        text: "あんたがキーボードを打つと、あたしも速く書けるにゃ。設定の『OS全体の入力カウント』で有効にできるよ" };
    }

/* 設定タブ: スキップ (全部ひらく) — 確認モーダルなし・即時。進行は消えない */
function tutSkipGuide(){

/* 設定タブ: 見直す (リセット) — ステージは事実から再導出されるので、
   解放済みのものは開いたまま。これから開くもののガイドだけが復活する */
function tutResetGuide(){
  if(!S.tut) return;
  S.tut.skipped = false;
  S.tut.seen = {};
  S.tut.stage = deriveStage(S);
  /* 既に開いているタブは「新着」ではないので visit 済みにしておく */
  for(const t of Object.keys(TUT_FRESH))

      if(parseInt(k.split(":")[1], 10) <= S.tut.stage) S.tut.seen["visit:" + k] = true;

/* 帯の目的チップ: 🎯 + 動詞1つ + 不足数だけ。達成したら消える (設計 §4) */
function stripQuestText(){
  if(!S.tut || S.tut.skipped) return "";
  if(tutCelebrate && Date.now() < tutCelebrate.until) return tutCelebrate.text;
  if(currentBottleneck()) return "";   /* ⚠ 表示が優先される間は目的を引っ込める */
  const seen = S.tut.seen || {};
  switch(S.tut.stage){
    case 0: return "🎯 最初の作品ができるまで見守ろう";
    case 1: {
      if(seen.q1) return "";
      let cheapest = Infinity;
      for(const d of UPGRADE_DEFS){
        if(d.id === "bot") continue;
        const lv = S.upgrades[d.id] || 0;
        if(lv < d.max) cheapest = Math.min(cheapest, upgradeCost(d, lv));
      }
      if(!isFinite(cheapest)) return "";
      const short = Math.max(0, Math.ceil(cheapest - S.coins));
      return "🎯 工場で道具を1つ買おう" + (short > 0 ? "（あと " + fmt(short) + "🪙）" : "（買えるにゃ！）");
    }
    case 2: {
      if(seen.q2) return "";
      let cheapest = Infinity;
      for(const d of RESEARCH_DEFS) if(!S.research[d.id]) cheapest = Math.min(cheapest, d.cost);
      if(!isFinite(cheapest)) return "";
      const short = Math.max(0, cheapest - Math.floor(S.rp));
      return "🎯 研究を1つ終わらせよう" + (short > 0 ? "（あと 🔬" + short + "）" : "（できるにゃ！）");
    }
    case 3: return seen.q3 ? "" : "🎯 応援タブで強化を1つ買おう";
    case 4: return seen.q4 ? "" : "🎯 スタッフを1人雇おう";
    case 5: return seen.q5 ? "" : "🎯 依頼を1つ受けよう";
    case 6: {
      if(S.line2.unlocked) return "";
      const short = Math.max(0, BAL.line2BuildCost - Math.floor(S.coins));
      return "🎯 第2ラインを建てよう（🪙 あと " + fmt(short) + "）";
    }
  }

}

/* ---------- Sprint 2: WebAudio 効果音キット（アセット不要・全て合成） ----------
   tone（オシレータ＋減衰エンベロープ）と noise（フィルタ付きノイズ）の
   2プリミティブだけで全キューを合成する。ファイル容量はゼロ。
   AudioContext は最初のユーザー操作で遅延生成する（自動再生ポリシー対策）。
   操作前に届いたキューは無音で捨てる。音が出せない環境（Node スモーク等）では
   全キューが安全な no-op になる。既定の考え方は下の SOUND_GATE_MENU_ONLY 参照。
   設定で明示したらそちらが常に優先。 */
const SoundKit = (function(){
  let actx = null, master = null, gestured = false;
  /* 音の既定 (設計原則 / sakuri 確定, 設計 §5.7 改訂): 「メニューは開かない状態が
     ニュートラルなゲームプレイ状態」。音はメニューの開閉に連動させず、帯 (owner) で
     設定トグルに従って鳴らすのが既定 — 未設定の間も帯で鳴る。リリース等の帯の
     セレモニーはニュートラル状態でこそ起きるので、そこで無音だと体験が欠ける。
     メニューは着脱式の管理コンソールであって、開いていないと欠ける状態は作らない。
     SOUND_GATE_MENU_ONLY は旧案 (menu が開いている間だけ鳴る) の名残として残すが
     既定 false (この原則に反するので通常は触らない)。true のときだけ旧案に戻る */
  const SOUND_GATE_MENU_ONLY = false;
  function isStrip(){ try{ return document.body.classList.contains("strip"); }catch(e){ return false; } }
  function enabled(){
    if(typeof S === "undefined" || !S.settings) return false;
    if(typeof S.settings.sound === "boolean") return S.settings.sound;
    if(typeof ROLE !== "undefined" && ROLE !== "solo"){
      /* owner / viewer: 未設定でも鳴る側に倒す (ニュートラル状態=帯が完全な体験)。
         旧案ゲートが明示的に true の場合だけ owner は menuAwake 連動に戻る */
      if(ROLE === "owner" && SOUND_GATE_MENU_ONLY) return !!menuAwake;
      return true;
    }
    return !isStrip();   /* solo (ブラウザ) は従来どおり形態で判定 */
  }
  function volume(){
    const v = (typeof S !== "undefined" && S.settings) ? S.settings.soundVol : undefined;
    return (typeof v === "number" && isFinite(v)) ? Math.min(1, Math.max(0, v)) : 0.5;
  }
  function ensure(){
    if(actx) return actx;
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      actx = new AC();
      master = actx.createGain();
      master.gain.value = volume();
      master.connect(actx.destination);
    }catch(e){ actx = null; }
    return actx;
  }
  function unlock(){
    gestured = true;
    const c = ensure();
    if(c && c.state === "suspended"){ try{ c.resume(); }catch(e){} }
  }
  function applyVolume(){
    if(master && actx){ try{ master.gain.setTargetAtTime(volume(), actx.currentTime, 0.02); }catch(e){} }
  }
  function tone(o){
    if(!actx || !master) return;
    try{
      const dur = o.dur || 0.1, t0 = actx.currentTime + (o.delay || 0);
      const osc = actx.createOscillator(), g = actx.createGain();
      osc.type = o.type || "sine";
      osc.frequency.setValueAtTime(o.f0 || 440, t0);
      if(o.f1) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.f1), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0002, o.vol || 0.5), t0 + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g); g.connect(master);
      osc.start(t0); osc.stop(t0 + dur + 0.05);
    }catch(e){}
  }
  function noise(o){
    if(!actx || !master) return;
    try{
      const dur = o.dur || 0.1, t0 = actx.currentTime + (o.delay || 0);
      const len = Math.max(1, Math.floor(actx.sampleRate * dur));
      const buf = actx.createBuffer(1, len, actx.sampleRate);
      const ch = buf.getChannelData(0);
      for(let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
      const src = actx.createBufferSource(); src.buffer = buf;
      const f = actx.createBiquadFilter();
      f.type = o.ftype || "lowpass"; f.frequency.value = o.ffreq || 1200; f.Q.value = o.q || 0.8;
      const g = actx.createGain();
      g.gain.setValueAtTime(o.vol || 0.4, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      src.connect(f); f.connect(g); g.connect(master);
      src.start(t0); src.stop(t0 + dur + 0.05);
    }catch(e){}
  }
  const CUES = {
    /* 応援クリック: コンボが伸びるほど少しずつ高くなるピッチは呼び出し側が渡す */
    click(o){ const p = (o && o.pitch) || 1; tone({ f0: 620 * p, f1: 880 * p, dur: 0.07, type: "triangle", vol: 0.35 }); },
    /* 工程完了（コミット）: タイプライタ風のカチャッ×2 */
    phaseComplete(){ noise({ dur: 0.03, ffreq: 3200, ftype: "highpass", vol: 0.16 });
      tone({ f0: 1150, dur: 0.05, type: "square", vol: 0.09 });
      tone({ f0: 1450, dur: 0.06, type: "square", vol: 0.09, delay: 0.07 }); },
    /* バグ叩き: ポフッというノイズ＋低い落下音 */
    bugSquash(){ noise({ dur: 0.13, ffreq: 700, vol: 0.5 }); tone({ f0: 320, f1: 70, dur: 0.14, type: "sawtooth", vol: 0.20 }); },
    /* 購入・雇用: コインのチャリン（2音） */
    purchase(){ tone({ f0: 1568, dur: 0.07, vol: 0.30 }); tone({ f0: 2093, dur: 0.13, vol: 0.30, delay: 0.06 }); },
    /* リリース: 小さなファンファーレ（上昇アルペジオ＋余韻） */
    releaseFanfare(){ [523, 659, 784, 1047].forEach((fq, i) =>
        tone({ f0: fq, dur: 0.16, type: "triangle", vol: 0.32, delay: i * 0.09 }));
      tone({ f0: 1319, dur: 0.32, vol: 0.15, delay: 0.38 }); },
    /* 金の魚: キラッと上がるスライド＋高音の余韻 */
    fishCatch(){ tone({ f0: 420, f1: 1250, dur: 0.16, vol: 0.34 }); tone({ f0: 1760, dur: 0.1, vol: 0.16, delay: 0.12 }); },
    /* おやつ: もぐもぐ2口ぶんの柔らかい音 */
    snack(){ tone({ f0: 210, f1: 160, dur: 0.09, vol: 0.38 }); tone({ f0: 190, f1: 150, dur: 0.1, vol: 0.38, delay: 0.13 }); }
  };
  function play(name, opts){
    try{
      if(!enabled()) return;
      if(!gestured || !actx) return;   /* 操作前・未生成なら無音（エラーにしない） */
      if(actx.state === "suspended"){ try{ actx.resume(); }catch(e){} }
      if(CUES[name]) CUES[name](opts || {});
    }catch(e){}
  }
  try{
    document.addEventListener("pointerdown", unlock);
    document.addEventListener("keydown", unlock);
  }catch(e){}
  return { play, unlock, enabled, volume, applyVolume };
})();

/* ---------- Sprint 2: ジュース（手触り）の部品 ----------
   パーティクルはプール上限つきの単純な配列で、レイアウトには触らない。
   帯モードでも粒子とバウンスは出すが、音だけは帯の既定 OFF（SoundKit 側）。 */
/* みゅけのスクワッシュ＆ストレッチ: 地面アンカー中心に約350msのバネ。
   応援クリック／なでなでで startBounce() を呼ぶ */
let bounceT0 = 0;
function startBounce(){ bounceT0 = Date.now(); }
function bounceScale(){
  if(!bounceT0) return null;
  const t = (Date.now() - bounceT0) / 350;
  if(t >= 1){ bounceT0 = 0; return null; }
  const amp = 0.22 * Math.exp(-3.2 * t) * Math.cos(t * Math.PI * 2.6);
  return { sx: 1 + amp * 0.8, sy: 1 - amp };
}
const CONFETTI_COLS = ["#e2543e", "#ffd94d", "#5aa469", "#4a90c2", "#f49cac"];
/* リリースの紙吹雪（帯）: Date.now() 基準。帯の検知側（stripUpdate）から呼ぶ */

let milestonePulseUntil = 0;
