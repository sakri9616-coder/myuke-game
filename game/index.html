/* ---------- プロジェクト ---------- */
function unlockedGenres(){
  return GENRES.filter(g => !g.lockedBy || S.research[g.lockedBy]);
}
/* 着工時のアイデア消費（企画工程を実在させる）。チュートリアルと XS は無料で序盤を詰まらせない */
const IDEA_COST = { TUT:0, XS:0, S:2, M:5, L:10 };
/* サイズ抽選は「現在の実効スループットで何分かかるか」で行う（目標 40分〜3時間）。
   大きすぎるサイズを引いた直後は次に S 以下を保証する（ピティ）。 */
function drawSizeByTime(){
  const rate = Math.max(1, Math.min(productionRate(), testRate() * bugFactor(), buildRate(), shipRate()));
  const weighted = ["XS","S","S","M","M","L"];
  const ok = weighted.filter(s => { const m = BAL.sizes[s] / rate; return m >= 40 && m <= 180; });
  if(S.bigDrawStreak >= 1){
    S.bigDrawStreak = 0;
    return ok.includes("S") ? "S" : (ok[0] || "XS");
  }
  let size;
  if(ok.length) size = ok[Math.floor(Math.random()*ok.length)];
  else size = ["XS","S","M","L"].reduce((a, c) =>
    Math.abs(BAL.sizes[c] / rate - 90) < Math.abs(BAL.sizes[a] / rate - 90) ? c : a);
  S.bigDrawStreak = (BAL.sizes[size] / rate > 150) ? S.bigDrawStreak + 1 : 0;
  return size;
}
/* プロジェクトの着工可否を決める: アイデアが足りれば消費して着工、
   足りなければ planning（企画中）にして、貯まるまで工程に流さない */
function settleProject(p){
  if(!p) return p;
  if(typeof p.ideaCost !== "number") p.ideaCost = IDEA_COST[p.size] || 0;
  if(p.ideaCost <= 0){ p.planning = false; return p; }
  if(S.ideas >= p.ideaCost){
    S.ideas -= p.ideaCost; p.planning = false;
    addLog("💡 『"+p.name+"』に着工（アイデア-"+p.ideaCost+"）");
  } else {
    p.planning = true;
    addLog("『"+p.name+"』は企画中… アイデアがあと"+(p.ideaCost - Math.floor(S.ideas))+"個必要にゃ");
  }
  return p;
}
/* 企画中プロジェクトにアイデアが貯まったら着工する（tick から毎秒呼ばれる） */
function tryStartPlanning(){
  for(const p of [S.project, S.line2.project]){
    if(p && p.planning && S.ideas >= (p.ideaCost || 0)){
      S.ideas -= p.ideaCost; p.planning = false;
      addLog("💡 企画がまとまった！『"+p.name+"』に着工（アイデア-"+p.ideaCost+"）");
      say("企画がまとまったにゃ！『"+p.name+"』作るよ");
    }
  }
}
/* ---------- Sprint 4: 作品名ジェネレータ ----------
   [接頭辞]×[対象]×[ジャンル]×[版表記] の組合せで 500 通りを大きく超える。
   直近12作品と同名は避ける（S.recentNames に履歴を持つ・セーブ対象） */
const NAME_PREFIXES = ["猫用","全力","秘密の","真夜中の","もふもふ","無限","ちいさな","伝説の","爆速","夢の","究極の","放課後の"];
const NAME_SUFFIXES = ["2.0","DX","完全版","リマスター","プラス","・改","2026","にゃん仕様"];
function composeName(subj, genre){
  if(!Array.isArray(S.recentNames)) S.recentNames = [];
  let name = subj.name + genre.name;
  for(let i = 0; i < 10; i++){
    let n = subj.name + genre.name;
    if(Math.random() < 0.45) n = NAME_PREFIXES[Math.floor(Math.random()*NAME_PREFIXES.length)] + n;
    if(Math.random() < 0.35) n += NAME_SUFFIXES[Math.floor(Math.random()*NAME_SUFFIXES.length)];
    name = n;
    if(!S.recentNames.includes(n)) break;
  }
  S.recentNames.push(name);
  if(S.recentNames.length > 12) S.recentNames.splice(0, S.recentNames.length - 12);
  return name;
}
/* 作品の「その作品だけの物語」1行を、開発の実データ（バグ数・開発時間・
   昼寝回数・生まれた時刻）から作る。棚タブに刻まれる */
function makeHighlight(p, devMin, naps){
  const bugs = Math.round(p.bugs || 0);
  const hour = p.startedAt ? new Date(p.startedAt).getHours() : 12;
  if(bugs === 0) return "バグゼロの奇跡の一作";
  if(bugs >= 15) return "バグ" + bugs + "匹と格闘した力作";
  if(naps === 0 && devMin >= 20) return "昼寝ゼロで走り切った集中の一作";
  if(hour >= 0 && hour < 5) return "深夜に生まれた、静かな力作";
  if(devMin <= 8) return "あっという間に駆け抜けた一作";
  if(bugs >= 8) return "バグと戦いながら育った一作";
  const pool = ["みゅけのお気に入り", "手応えのある一作", "棚の主役候補", "コツコツ育てた自信作"];
  let h = 0; const nm = p.name || "";
  for(let i = 0; i < nm.length; i++) h = (h * 31 + nm.charCodeAt(i)) >>> 0;
  return pool[h % pool.length];
}
function genProject(sizeOverride, genreId){
  const gs = unlockedGenres();
  const genre = genreId ? GENRES.find(g=>g.id===genreId) : gs[Math.floor(Math.random()*gs.length)];
  const subj = SUBJECTS[Math.floor(Math.random()*SUBJECTS.length)];
  const size = sizeOverride || drawSizeByTime();
  const featPool = genre.feats.slice();
  const nFeat = 3 + Math.floor(Math.random()*3);

  const a = aBase * (feverActive() && !fromInput ? FEVER.prodMult : 1);
  if(!fromInput) autoProdSecAcc += a;   /* F再設計: 自動生産レートの計測（入力由来は数えない） */
  /* Sprint 4: ロボット量産ライン研究があると、ロボット作品だけバグ混入が半分 */
  const proj = target === "l2" ? S.line2.project : S.project;
  const bugMul = (proj && proj.genre === "robot" && S.research.res_robot2) ? 0.5 : 1;
  if(target === "l2"){ S.line2.wip.code += a; if(S.line2.project) S.line2.project.bugs += aBase * BAL.bugPerDP * bugMul; }
  else {
    /* Wave H: 自動生産の一部はモジュールのミニラインへ（入力由来は対象外） */
    let inflow = a;
    if(!fromInput && S.project && S.project.modules && !S.project.planning) inflow -= divertToModules(a);
    S.wip.code += inflow;
    if(S.project) S.project.bugs += aBase * BAL.bugPerDP * bugMul;
    S.totals.lines += a * 1.05; S.today.lines += a * 1.05;
  }
  S.runDP += a;
  S.bugStock += aBase * BAL.bugPerDP * bugMul;
  /* チュートリアル: 初めてバグ在庫が積まれた瞬間だけ、ほったらかしで
     大丈夫なことを1回伝える (マイクロビート) */
  if(S.tut && !S.tut.seen.first_bug && S.bugStock >= 1 && !IS_VIEWER){
    S.tut.seen.first_bug = true;
    say("バグが出たにゃ。あたしが勝手に叩くから大丈夫だよ");
  }
}
/* 工程処理: caps = {test, build, ship}（この tick で使える DP 量）。使った分を返す */
function processPipe(wip, caps, bugF, creditFn){
  const t = Math.min(wip.code, caps.test * bugF);   wip.code -= t;   wip.tested += t;
  const bd = Math.min(wip.tested, caps.build);      wip.tested -= bd; wip.built += bd;
  const sh = Math.min(wip.built, caps.ship);        wip.built -= sh;
  if(sh > 0) creditFn(sh);
  return { test:t, build:bd, ship:sh };
}
/* 出荷分をプロジェクト進捗に計上（機能チェック・コミット・リリース判定） */
function creditProject(a){
  const p = S.project;
  if(!p || p.planning) return;
  S.projectDP += a;
  const featThreshold = p.totalDP / (p.feats.length + 1);
  while(p.doneFeats < p.feats.length && S.projectDP >= featThreshold * (p.doneFeats + 1)){
    p.doneFeats++;
    say("『"+p.feats[p.doneFeats-1]+"』できたにゃ！");
    addLog("機能『"+p.feats[p.doneFeats-1]+"』が完成");
    pulseMilestone();
    spawnFeatNote(1);   /* 可視生産: 付箋が机からボードへ飛ぶ (演出のみ) */
  }
  while(S.projectDP - S.commitMark >= BAL.commitEvery){
    S.commitMark += BAL.commitEvery;
    doCommit();
  }
  S.packages = Math.floor(S.projectDP / (p.totalDP/6));
  if(S.projectDP >= p.totalDP) releaseProject();
}

function releaseProject(){
  const p = S.project;
  const devMin = Math.max(1, Math.round((typeof p.activeSec === "number" ? p.activeSec * 1000 : Date.now() - p.startedAt)/60000));
  let coins = Math.round(BAL.coinBase[p.size] * (1 + 0.10*(S.upgrades.ci||0)) * dustMult() * brandMult() * modulePriceMult(p));
  let rp = BAL.rpBase[p.size];
  /* Sprint 4: ティア2研究のジャンル深化（ゲーム=コイン+30% / AI=研究P+1） */
  if(p.genre === "game" && S.research.res_game2) coins = Math.round(coins * 1.3);
  if(p.genre === "ai" && S.research.res_ai2) rp += 1;
  let requestBonus = "";
  if(S.activeRequest && S.activeRequest.genre === p.genre){
    /* Phase C: ボーナス率は依頼のティアで決まる（手動受注は従来どおり +60%）。
       要求サイズ未満の作品で達成した場合は半額（満額条件の明示） */
    const rq = S.activeRequest;

    let lateNote = "";

      rate = 0;
      lateNote = "（納期を過ぎたためボーナスなし）";
    }
    const bonus = Math.round(coins * rate);
    coins += bonus; rp += 1;
    requestBonus = rate > 0 ? "（依頼達成ボーナス +"+bonus+"🪙）" : "";
    addLog(rate > 0
      ? "依頼達成！『"+p.name+"』"+requestBonus+shortNote

    S.activeRequest = null; genRequests();

let catState = "code", stateUntil = Date.now() + 4000, annoy = 0, lastInputAt = Date.now();
/* アニメーション用: 現在の状態に入った時刻（ランタイムのみ・セーブしない） */
let stateEnteredAt = Date.now();
const PLAY_STATES = ["yarn","groom","watch","chase","zoomies","duckplay","treasure"];
function availablePlays(){
  return PLAY_STATES.filter(p =>
    (p!=="duckplay" || S.research.res_duckplay) &&
    (p!=="treasure" || S.research.res_play2));
}
function pickRestState(){
  const pool = availablePlays();
  return pool[Math.floor(Math.random()*pool.length)];
}
function setState(st, ms){ catState = st; stateUntil = Date.now() + ms; stateEnteredAt = Date.now(); }
function stateTick(now){
  if(now < stateUntil) return;
  const hour = new Date().getHours();
  const night = hour >= 23 || hour < 5;
  // 集中力が尽きたら休憩か昼寝
  if(S.concentration <= 15 && catState !== "nap"){
    if(Math.random() < 0.45){ setState("nap", 9000); S.totals.naps++; say("ちょっとだけ…キーボードで寝るにゃ"); return; }
    const ps = pickRestState(); setState(ps, 5000); flagPlay(ps); return;
  }
  // 状態ごとの後処理
  if(catState === "nap"){ S.concentration = Math.min(100, S.concentration + 45); }
  if(PLAY_STATES.includes(catState)){
    /* res_plant の効果は正確に +20%（22 → 26.4） */
    S.concentration = Math.min(100, S.concentration + (S.research.res_plant ? 26.4 : 22));
    S.ideas += (catState==="treasure" ? 4 : 2);
    /* Sprint 4: 宝探しはたまに小銭も見つける */
    if(catState==="treasure" && Math.random() < 0.35){
      const c = 10 + Math.floor(Math.random()*15);
      S.coins += c; S.totals.coinsEarned += c;
      say("宝探しで "+c+"🪙 見つけたにゃ！");
      addLog("🗺️ 宝探しで "+c+"🪙 を見つけた");
    }
  }
  if(catState === "think"){ S.ideas += 1 + (S.upgrades.monitor||0); }
  // 企画中は「考え中」でアイデアを貯めるのが仕事になる
  if(S.project && S.project.planning && Math.random() < 0.7){
    setState("think", 4000); say("企画を考え中…ひらめき待ちにゃ"); return;
  }
  // 次の状態を決める
  const idleLong = now - lastInputAt > 5*60000;
  const r = Math.random();
  if(S.bugStock >= 4 && r < 0.45){ setState("debug", 4000); return; }
  if(r < 0.62){ setState(night && Math.random()<0.3 ? "code_slow" : "code", 5000 + Math.random()*5000); return; }
  if(r < 0.72){ setState("think", 4000); say("うーん、どう作るかにゃ…"); return; }
  if(r < 0.80 || idleLong){ const ps = pickRestState(); setState(ps, 5000); flagPlay(ps); return; }
  setState("code", 6000);
}

function spawnBugSwarm(now, count){
  const bugs = [];
  const n = count || 6;
  for(let i = 0; i < n; i++){
    bugs.push({ x: 20 + Math.random()*200, y: 30 + Math.random()*118,
      vx: (Math.random()-0.5) * 22, vy: (Math.random()-0.5) * 14,
      /* Sprint 4: 帯側の這い位置（帯仮想座標。sx は帯幅に対する割合で持ち、
         実際の x は描画時に stripVW へ写す。sy は地面からの高さ） */
      sf: 0.08 + Math.random()*0.84, sy: 2 + Math.random()*10,
      svf: (Math.random()-0.5) * 0.03 });
  }
  bugEvent = { bugs, until: now + 20000 };
  say("🐛 バグが大量発生！？ 叩くとコインだにゃ（逃がしても平気だよ）");
  addLog("🐛 バグ大量発生イベント！");

function eventTick(now){
  /* F: フィーバー中はバグが湧きやすい（潰すとボーナス DP の的になる） */
  if(feverActive() && !bugEvent && now >= feverBugNext){
    spawnBugSwarm(now, 10);
    feverBugNext = now + 12000;
  }
  if(!fishEvent && !bugEvent){
    if(now >= nextFishAt && nextFishAt <= nextBugAt) spawnFish(now);
    else if(now >= nextBugAt) spawnBugSwarm(now);
  }
  if(fishEvent && now > fishEvent.until){
    fishEvent = null;
    nextFishAt = now + (150000 + Math.random()*120000) * fishIntervalMul();   /* Sprint 4: 幸運のヒレ */
  }
  if(bugEvent && now > bugEvent.until){
    bugEvent = null;
    nextBugAt = now + 180000 + Math.random()*150000;
    if(Math.random() < 0.5) say("バグたちはどこかへ行ったにゃ（被害なし）");
  }
  // バグの群れが発生する（帯の上を這う）
  if(bugEvent){
    for(const bg of bugEvent.bugs){
      bg.x += bg.vx * 0.15; bg.y += bg.vy * 0.15;
      if(bg.x < 8 || bg.x > 232){ bg.vx *= -1; bg.x = Math.max(8, Math.min(232, bg.x)); }
      if(bg.y < 24 || bg.y > 156){ bg.vy *= -1; bg.y = Math.max(24, Math.min(156, bg.y)); }
    }
  }
}

function cheerClick(bx, by, part){
  const now = Date.now();
  comboN = (now - lastClickAt <= 2500) ? comboN + 1 : 1;
  lastClickAt = now;
  S.totals.clicks++;
  const crit = Math.random() < critRate();
  let gain = clickBaseDP() * comboMult();   /* F再設計: ハイブリッド式（基礎＋自動生産連動） */
  if(crit){ gain *= 10; S.totals.crits++; }
  if(feverActive()) gain *= FEVER.clickMult;   /* F再設計: 発動中のクリックは ×3（旧 ×20 は Argon の警告で置換） */
  /* F再設計: バケツを通ったクリックだけが DP を生む（反応・コンボは無条件）。
     流入は案B 読み替え: 直接進捗は 20%、残り 80% は第1工程へ流して
     工程キャップに堰き止めさせる。企画中は全量が仕掛品になる */
  if(clickBucketTake()){
    if(!feverActive()) chargeFever(FEVER.chargePerClick);
    prodMuted = true;
    produceDP(gain * (1 - CLINK.directShare), "l1");
    if(S.project && S.project.planning) produceDP(gain * CLINK.directShare, "l1");
    prodMuted = false;
    if(S.project && !S.project.planning){
      const direct = gain * CLINK.directShare * dpMult(S.upgrades) * dustMult() * firstBoost() * extraMult() * concProdMult();
      S.runDP += direct;
      S.totals.lines += direct * 1.05; S.today.lines += direct * 1.05;
      creditProject(direct);
      progressPulseUntil = Date.now() + 500;
      addFloater(bx, by - 22, "+" + direct.toFixed(1) + "DP すすんだ！", "#e8873a");
    }
    if(crit){
      addFloater(bx, by - 12, "CRITICAL! +" + gain.toFixed(0) + "DP", "#d9534f");
      say("クリティカル応援！！ すごいパワーだにゃ！");
    }
  }
  // 連動シナジー（端数は貯めて整数化）
  ideaFrac += 0.02 * (S.clickUp.synidea||0);
  if(ideaFrac >= 1){ const n = Math.floor(ideaFrac); ideaFrac -= n; S.ideas += n; }
  rpFrac += 0.004 * (S.clickUp.synrp||0);
  if(rpFrac >= 1){ const n = Math.floor(rpFrac); rpFrac -= n; S.rp += n; addLog("研究メモ連動で研究P+"+n); }
  /* Sprint 2: 応援の音（コンボで微上昇）と、みゅけのバウンス */
  SoundKit.play("click", { pitch: 1 + Math.min(comboN, 12) * 0.02 + (crit ? 0.25 : 0) });
  startBounce();
  updateComboUI();
  checkStamps();
  tutCheck();   /* 応援クリック数もステージの事実 (2→3 の述語) */
  return crit;
}

/* ---------- 1秒ティック ---------- */
let keysAcc = 0, cursorAcc = 0, clicksAcc = 0, careTimer = 200;
function tick(){
  if(IS_VIEWER) return;   /* viewer はシミュレーションを持たない (第2層ガード) */
  const now = Date.now();
  /* オフィスティア上昇の小さな祝い (環境アート統合): 事実が進んで帯の家具が
     会社らしくなった瞬間に一度だけ。load() で初期化済みのトラッカーが
     セッション中の上昇だけを拾う (ベテランセーブの読み込みでは祝わない) */
  const otNow = officeTier(S);
  if(officeTierSeen === null) officeTierSeen = otNow;
  else if(otNow > officeTierSeen){
    officeTierSeen = otNow;
    say("オフィスが「" + OFFICE_TIER_NAMES[otNow] + "」らしくなったにゃ！");
    const tCx = stripDeskCX();
    for(let i = 0; i < 8; i++){
      stripConfetti.push({ x: tCx + (Math.random() - 0.5) * 60, y: STRIP_GROUND - 55 - Math.random() * 15,
        vx: (Math.random() - 0.5) * 12, vy: -(7 + Math.random() * 12),
        rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 8,
        col: CONFETTI_COLS[i % CONFETTI_COLS.length], born: Date.now() });
    }
    if(stripConfetti.length > 80) stripConfetti.splice(0, stripConfetti.length - 80);
  } else if(otNow < officeTierSeen) officeTierSeen = otNow;
  /* Phase C: 受注枠が空いていれば営業が自動で埋める（読み込み直後の回復もここ）。
     大型案件の期限切れもここで静かに処理する */
  if(!S.activeRequest && salesReps().length && now > (S.reqHoldUntil || 0)) autoAcquireRequest();
  if(S.bigDeal && now > S.bigDeal.expiresAt){
    addLog("🌟 大型案件は期限切れになった: "+S.bigDeal.client+"（ペナルティなし）");
    S.bigDeal = null; save();
  }
  sampleIncome(now);   /* Sprint 3: 「あと○○」ヒント用の収入サンプル */
  /* Sprint 2: おかえりの起床（寝ていたみゅけが起きて挨拶する） */
  if(returnWakeAt && now >= returnWakeAt){
    returnWakeAt = 0;
    /* Sprint 4: 帯の起床挨拶にも前回のリリース数を入れる (C2-P2-8) */
    const rel = returnInfo && returnInfo.releases > 0 ? "前回は" + returnInfo.releases + "作品リリースしたにゃ。" : "";
    if(returnInfo && returnInfo.gift > 0)
      say("おはよ〜！ 夢でアイデア浮かんだにゃ（アイデア+" + returnInfo.gift + "）。" + rel + "おかえり！");
    else
      say("おはよ〜！ " + rel + "おかえりなにゃ。続きやるね");
    setState("react_call", 1600);
  }
  /* Sprint 4: おかえりカードは4分で静かに閉じる (C2-P2-8) */
  if(returnShownAt && now - returnShownAt > 4 * 60000){ returnShownAt = 0; closeReturnCard(); }
  tryStartPlanning();
  /* Sprint 4: 開発時間は壁時計ではなくアクティブ稼働秒で数える (C2-P2-1)。
     企画中（着工待ち）の時間は含めない */
  if(S.project && !S.project.planning) S.project.activeSec = (S.project.activeSec || 0) + 1;
  if(S.line2.project && !S.line2.project.planning) S.line2.project.activeSec = (S.line2.project.activeSec || 0) + 1;
  stateTick(now);
  eventTick(now);
  if(comboN > 0 && now - lastClickAt > 2500){ comboN = 0; updateComboUI(); }
  const coding = ["code","code_slow","think","debug"].includes(catState);
  const ss = staffSums();
  /* 第2ウェーブ I: 活躍度カウンタ（M の役員選出の材料。tick = 1秒ごとに、その猫の
     出力倍率ぶんを積む。表示はまだしない。みゅけ本人は S.staff にいないため対象外） */
  for(const st of S.staff) st.act = (st.act || 0) + staffOutMult(st) * deptMult(st.role);
  /* 可視生産フロー: 工程に入る前の実装バッファを測り、生産分だけを
     アキュムレータへ供給する (演出専用。応援クリックの produceDP は
     tick の外で起きるため、この差分には混ざらない = 設計 #11) */
  const _fc1 = S.wip.code, _fc2 = S.line2.wip.code;
  // 基本進捗 (DP/分 → /秒)。プログラミング系の状態でのみ進む
  if(coding) produceDP(BAL.basePerMin/60, "l1");
  // 子ねこボットとプログラマ猫は状態によらず働く
  if((S.upgrades.bot||0) > 0) produceDP(botRate()/60, "l1");
  if(ss.prog > 0) produceDP(ss.prog/60, "l1");
  // 第2ラインの生産
  if(S.line2.unlocked && S.line2.project) produceDP(line2Rate()/60, "l2");
  /* Phase D: 子会社の受動収益。DP は工程に乗り、コインは端数を貯めて直接入る */
  if(S.subs && S.subs.length){
    let subCoin = 0, subDP = 0;
    for(const sub of S.subs){ const r = subRates(sub); subCoin += r.coins; subDP += r.dp; }
    if(subDP > 0) produceDP(subDP/60, "l1");
    if(subCoin > 0){
      subCoinFrac += subCoin/60;
      const whole = Math.floor(subCoinFrac);
      if(whole > 0){ subCoinFrac -= whole; S.coins += whole; S.totals.coinsEarned += whole; }
    }
  }
  const _fd1 = S.wip.code - _fc1, _fd2 = S.line2.wip.code - _fc2;
  // 工程処理: 各ラインが独立の工程容量を持つ (sakuri 設計 2026-10-26:
  // ライン2もライン1と同じ仕組みのハコを持つ)。旧方式 (ライン1優先・ライン2は
  // 残り) は、生産に倍率が乗り工程容量に乗らないため進行したセーブで残りが
  // 恒常的に 0 になり、ライン2が飢餓して永遠に完走しなかった (実機バグ)
  const bugF = bugFactor();
  const caps = { test: testRate()/60, build: buildRate()/60, ship: shipRate()/60 };
  /* Wave H・統合: 第1ラインのビルド工程は全モジュールの完成を待つ
     （第2ラインは従来どおり独立なので、キャップはライン1側だけ差し替える） */
  const capsL1 = (S.project && S.project.modules && !modulesDone(S.project))
    ? { test: caps.test, build: 0, ship: caps.ship } : caps;
  /* 企画中プロジェクトは工程に流さない（仕掛品は実装バッファに溜まる） */
  const used = (S.project && S.project.planning)
    ? { test:0, build:0, ship:0 }
    : processPipe(S.wip, capsL1, bugF, creditProject);
  let used2 = { test:0, build:0, ship:0 };
  if(S.line2.unlocked && !(S.line2.project && S.line2.project.planning))
    used2 = processPipe(S.line2.wip, caps, bugF, creditProject2);
  /* 可視生産フローへの供給: 実フローの積分だけが帯の「物の流れ」になる */
  flowFeedTick(_fd1, _fd2, used, used2);
  // 研究員の研究Pトリクル
  if(ss.rp > 0) S.rp += ss.rp/60;
  /* Sprint 4: ティア1研究を全て終えた研究員は、第二の仕事として余った
     時間の研究メモをアイデアに変える（研究が終わっても失業しない） */
  if(ss.rp > 0 && tier1Done()) S.ideas += ss.rp * 0.6 / 60;
  // お世話係: たまに差し入れ
  if(ss.careW > 0){
    careTimer--;
    if(careTimer <= 0){
      careTimer = 210 + Math.floor(Math.random()*120);
      /* Sprint 4: Lv5以上のお世話係は差し入れが豪華になる（熟練の見返り） */
      const careMaster = S.staff.some(s => s.role === "care" && (s.lv || 1) >= 5);
      S.concentration = Math.min(100, S.concentration + (careMaster ? 18 : 12));
      S.ideas += careMaster ? 2 : 1;
      const carer = S.staff.find(s => s.role === "care");
      addLog("🍵 " + (carer ? carer.name : "お世話係") + "が差し入れを持ってきた（集中力+" + (careMaster ? 18 : 12) + "・アイデア+" + (careMaster ? 2 : 1) + "）");
      if(Math.random() < 0.5) say("差し入れだにゃ！みんな休憩〜");
    }
  }
  // バグのQA処理
  if(S.bugStock > 0){
    const processed = Math.min(S.bugStock, qaRate()/60);
    S.bugStock -= processed;
    if(catState === "debug"){
      if(Math.random() < 0.3 && S.bugStock >= 1){
        S.bugStock = Math.max(0, S.bugStock - 1);
        S.totals.bugsSquashed++; S.today.bugs++;
        if(Math.random()<0.4) say("バグ、たたいたにゃ！");
      }
    }
  }
  /* 拡張ウェーブ G: 総務（ケア）が技術的負債を少しずつ返す（部署Lv は staffSums 経由で効く） */
  if(S.debt > 0 && ss.careW > 0) S.debt = Math.max(0, S.debt - ss.careW * 0.9 / 60);
  // 集中力
  if(coding){
    let drain = (100 / (25*60)) * (1 - 0.08*Math.min(5,(S.upgrades.chair||0)));
    drain *= Math.max(0.45, 1 - 0.15 * ss.careW);   // お世話係が減りを軽くする
    if(S.research.res_zen) drain *= 0.75;          // Sprint 4: 集中の極意
    S.concentration = Math.max(0, S.concentration - drain);
  }
  // 入力ブーストの確定（10秒ごとにまとめて加算し、上限を適用）
  tickBoostCounter++;
  if(tickBoostCounter >= 10){
    tickBoostCounter = 0;
    let boost = keysAcc / BAL.keysPerDP + cursorAcc / BAL.cursorPxPerDP + clicksAcc / BAL.clicksPerDP;
    keysAcc = 0; cursorAcc = 0; clicksAcc = 0;
    boost = boostGate(boost);
    if(boost > 0) chargeFever(boost * FEVER.chargePerBoostDP);   /* F: 実作業がオーバークロックのゲージを貯める */
    prodMuted = true;   /* F再設計: ブーストは入力由来（自動生産に数えず、発動倍率も二重に掛けない） */
    if(boost > 0.01 && coding) produceDP(boost, "l1");
    else if(boost > 0.01) pendingBoost += boost;
    if(pendingBoost > 0 && coding){ produceDP(pendingBoost, "l1"); pendingBoost = 0; }
    prodMuted = false;
  }
  /* F再設計: 自動生産レートの EMA を毎秒更新（クリック連動ボーナスの基礎） */
  autoProdEMA = autoProdEMA * 0.9 + autoProdSecAcc * 0.1;
  autoProdSecAcc = 0;
  tutCheck();   /* チュートリアル導線: 事実ベースの進行チェック (毎秒) */
  renderHeader();
}

  ["商店街の文具店", "町工場の社長猫", "地元の学習塾", "小さな出版社", "駅前カフェの店長"],
  ["大手ゲーム会社", "全国チェーンの本部", "大手IT企業", "有名百貨店", "テレビ局の制作部"],
  ["市役所の広報課", "県の観光協会", "グローバルIT企業", "国際ねこ会議", "宇宙開発の広報室"]
];
function salesReps(){ return S.staff.filter(s => s.role === "sales"); }
function pickRequestGenre(rep, power){
  const pool = unlockedGenres();
  if(!pool.length) return null;
  const prefW = 3 + Math.floor(power / 3);   /* 希望ジャンルは得意ジャンルより常に優位に、力量が高いほど差が開く */
  let total = 0;
  const ws = pool.map(g => {
    let w = 1;
    if(S.reqGenrePref && g.id === S.reqGenrePref) w += prefW;
    if(rep.genre && g.id === rep.genre) w += 2;
    total += w; return w;
  });
  let r = Math.random() * total;
  for(let i = 0; i < pool.length; i++){ r -= ws[i]; if(r <= 0) return pool[i]; }
  return pool[pool.length - 1];
}
function salesTierFor(power){
  const cap = power >= 11 ? 3 : power >= 7 ? 2 : power >= 4 ? 1 : 0;
  return (cap > 0 && Math.random() < 0.35) ? cap - 1 : cap;
}
function autoAcquireRequest(){
  const reps = salesReps();
  if(!reps.length || S.activeRequest) return false;
  const rep = reps[(S.salesRot || 0) % reps.length];   /* 担当はローテーション（全員が質に効く） */
  S.salesRot = (S.salesRot || 0) + 1;
  const power = rep.lv + deptLv("sales") - 1;
  const tier = salesTierFor(power);
  const g = pickRequestGenre(rep, power);
  if(!g) return false;
  const clients = REQUEST_CLIENTS_TIER[tier];
  const client = clients[Math.floor(Math.random() * clients.length)];
  S.activeRequest = { client, genre: g.id, genreName: g.name, text: requestText(client, g.name),
    tier, bonus: REQUEST_TIERS[tier].bonus, reqSize: tier >= 1 ? SIZE_ORDER[tier] : null,
    repId: rep.id, repName: rep.name, auto: true,
    deadlineAt: tier >= 3 ? Date.now() + 60 * 60000 : null };   /* 拡張ウェーブ G: ティア3には納期（60分） */
  S.nextRequestGenre = g.id;
  addLog("💼 営業の"+rep.name+"が依頼を取ってきた: "+client+"（"+g.name+"・"+REQUEST_TIERS[tier].name+"）");
  say("営業の"+rep.name+"が"+client+"の依頼を取ってきたにゃ");
  /* 帯の知覚: 担当がメモを運んで歩く（動き）＋頭上に吹き出し */
  const wk = stripWalkers[rep.id];
  if(wk){ wk.carrying = true; wk.carryKind = "memo"; wk.sitting = false; wk.backing = false; }
  stripChat = { whoId: rep.id, text: "依頼、取ってきたにゃ！", until: Date.now() + 4200 };
  save();
  return true;
}

/* ---------- Phase D: 子会社（終盤の経営レイヤー） ----------
   準大手（スタジオLv5）から設立できる半自律ユニット。人員は抽象的な数で
   数え（帯に描く本社の猫は最大36匹まで）、収益は受動コイン＋DP。
   プレイヤーのレバー: 設立 / 人員投資 / 規模Lv / 資金配分（合計100%）。
   配分は「注力度」として効く（0% で ×0.5、100% で ×2.0）ため、配分を
   動かすとグループ合計が変わる — それが経営判断になる。注力度は
   凹関数 0.5+1.5×sqrt(配分/100)（2026-10-26 23:17回・Phase D 注記 (ii)）:
   線形だと高単価社への100%集中が常に最善で配分判断が消えるため、
   逓減する注力度で最適配分を内点（約74/26）に移し、誤配分は損になる形にした。端点は不変。
   売却は2段構え: 子会社だけ売る部分EXIT（星屑は subDustValue と同額）と、
   本社ごと売るグループEXIT（売却益に全子会社の価値が上乗せされる）。
   部分EXIT の星屑 = グループEXIT での当該子会社の寄与分と同額にそろえて
   あるため、「部分 ≤ グループ寄与」の反証条件は構造的に保たれる */
const SUB_MAX_LV = 10;
const SUB_NAME_A = ["ねこねこ", "まるまる", "にゃんころ", "ふわラボ", "こねこ", "たまご", "ひげ", "すやすや"];
function subGenreRate(genreId){
  const i = GENRES.findIndex(g => g.id === genreId);
  return 1 + 0.1 * Math.max(0, i);   /* 解放が遅いジャンルほど単価が高い */
}
function subLvMult(sub){ return 1 + 0.3 * (sub.lv - 1); }
function subFocus(sub){ return 0.5 + 1.5 * Math.sqrt((sub.alloc || 0) / 100); }
function subRates(sub){
  const base = sub.staff * subLvMult(sub) * subFocus(sub);
  return { coins: base * 0.35 * subGenreRate(sub.genre), dp: base * 0.2 };
}
function subDustValue(sub){ return Math.max(1, Math.floor((sub.staff * 25 + sub.lv * 500) / 500)); }
function subsTotalStaff(){ return (S.subs || []).reduce((a, s) => a + s.staff, 0); }
function totalPeople(){ return S.staff.length + subsTotalStaff(); }
function foundCost(){ return 15000 * Math.pow(2, (S.subs || []).length); }
function subHeadCost(sub){ return Math.ceil(120 * Math.pow(1.06, sub.staff)); }
function subHeadCostN(sub, n){
  let t = 0;
  for(let i = 0; i < n; i++) t += Math.ceil(120 * Math.pow(1.06, sub.staff + i));
  return t;
}
function subScaleCost(sub){ return Math.ceil(4000 * Math.pow(2.2, sub.lv - 1)); }
function normalizeAlloc(){
  const subs = S.subs || [];
  if(!subs.length) return;
  let sum = subs.reduce((a, s) => a + (s.alloc || 0), 0);
  if(sum === 100) return;
  if(sum <= 0) subs.forEach(s => s.alloc = Math.floor(100 / subs.length));
  else subs.forEach(s => s.alloc = Math.floor(s.alloc * 100 / sum));
  let rest = 100 - subs.reduce((a, s) => a + s.alloc, 0);
  for(let i = 0; rest > 0; i = (i + 1) % subs.length){ subs[i].alloc++; rest--; }
}
function foundSub(genreId){
  if(S.studioLv < 5){ say("子会社は準大手（スタジオLv5）からにゃ"); return; }
  const cost = foundCost();
  if(S.coins < cost){ say("コインが足りないにゃ…"); return; }
  const g = GENRES.find(x => x.id === genreId) || GENRES[0];
  S.coins -= cost;
  if(!Array.isArray(S.subs)) S.subs = [];
  let name = SUB_NAME_A[(S.subSeq || 0) % SUB_NAME_A.length] + g.name + "工房";
  if(S.subs.some(s => s.name === name)) name += " " + (S.subs.filter(s => s.name.startsWith(name.split(" ")[0])).length + 1) + "号";
  const sub = { id: ++S.subSeq, name, genre: g.id, staff: 5, lv: 1, alloc: 0 };
  S.subs.push(sub);
  normalizeAlloc();
  SoundKit.play("purchase");
  addLog("🏢 子会社「"+name+"」を設立！（-"+cost+"🪙）得意は"+g.name+"、人員 5 人で発足");
  say("子会社「"+name+"」ができたにゃ！ グループ経営のはじまりだね");
  save(); renderPanel();
}
function addSubStaff(id, n){
  const sub = (S.subs || []).find(s => s.id === id);
  if(!sub) return;
  const total = subHeadCostN(sub, n);
  if(S.coins < total){ say("コインが足りないにゃ…"); return; }
  S.coins -= total; sub.staff += n;
  addLog("🏢 "+sub.name+" に "+n+" 人を採用（人員 "+sub.staff+" 人）（-"+total+"🪙）");
  save(); renderPanel();
}
function scaleSub(id){
  const sub = (S.subs || []).find(s => s.id === id);
  if(!sub) return;
  if(sub.lv >= SUB_MAX_LV){ say("その子会社はもう最大規模にゃ"); return; }
  const cost = subScaleCost(sub);
  if(S.coins < cost){ say("コインが足りないにゃ…"); return; }
  S.coins -= cost; sub.lv++;
  addLog("🏢 "+sub.name+" が規模Lv"+sub.lv+" に（出力 ×"+subLvMult(sub).toFixed(1)+"）（-"+cost+"🪙）");
  say(sub.name+"が大きくなったにゃ！");
  save(); renderPanel();
}
function setAlloc(id, delta){
  const subs = S.subs || [];
  const sub = subs.find(s => s.id === id);
  if(!sub || subs.length < 2) return;
  const nv = Math.max(0, Math.min(100, (sub.alloc || 0) + delta));
  if(nv === sub.alloc) return;
  sub.alloc = nv;
  /* 差分は他の子会社から付け替える（合計は常に100%に保つ） */
  let excess = subs.reduce((a, s) => a + s.alloc, 0) - 100;
  const others = subs.filter(s => s !== sub).sort((a, b) => b.alloc - a.alloc);
  for(const o of others){
    if(excess === 0) break;
    if(excess > 0){ const d = Math.min(o.alloc, excess); o.alloc -= d; excess -= d; }
    else { const d = Math.min(100 - o.alloc, -excess); o.alloc += d; excess += d; }
  }
  if(excess !== 0) sub.alloc -= excess;
  save(); renderPanel();
}
function sellSubCore(id){
  const subs = S.subs || [];
  const i = subs.findIndex(s => s.id === id);
  if(i < 0) return;
  const sub = subs[i];
  const gain = subDustValue(sub);
  subs.splice(i, 1);
  normalizeAlloc();
  const totalBefore = typeof S.dustTotal === "number" ? S.dustTotal : S.dust;
  S.dust += gain; S.dustTotal = totalBefore + gain;
  addLog("🏢 子会社「"+sub.name+"」を売却（部分EXIT）: 星屑 +"+gain+"（本社はそのまま）");
  say(sub.name+"を売却したにゃ。星屑 +"+gain+" ゲット");
  save(); renderPanel();
}
function sellSub(id){
  const sub = (S.subs || []).find(s => s.id === id);
  if(!sub) return;
  if(!confirm("子会社「"+sub.name+"」を売却しますか？（部分EXIT）\n星屑 "+subDustValue(sub)+" 個を得ます。本社と他の子会社はそのまま残ります")) return;
  sellSubCore(id);
}
/* ---------- Sprint 3: 星屑ショップ（永続特典）と引っ越しプレビュー ----------

   特典は引っ越ししても消えない（S.dustPerks はリセット対象外）。 */
const DUST_PERKS = [

  { id:"omamori",   name:"星屑のお守り", cost:1,  desc:"金の魚の間隔が -5% になります（幸運のヒレと重なります）" },

  { id:"dreamplus", name:"夢の続き",     cost:3,  desc:"夢のお土産（30分以上あけて戻った時のアイデア）が +1 個増えます" },

  { id:"veteran",   name:"ベテラン制度", cost:8,  desc:"売却時に、最も育ったスタッフ1人が新会社に来てくれます" },
  /* Sprint 4: レベル制（反復購入できる星屑シンク）。S.dustPerks[id] に数値で持つ */
  { id:"starcharm", name:"星のチャーム", lv:true, baseCost:3, costMul:1.8, maxLv:10, desc:"生産 +2%/Lv（最大Lv10）" },
  { id:"luckyfin",  name:"幸運のヒレ",   lv:true, baseCost:2, costMul:1.8, maxLv:10, desc:"フィッシュの間隔 -8%/Lv（最大Lv10）" }
];
function fishIntervalMul(){ return (1 - 0.08 * perkLv("luckyfin")) * (hasPerk("omamori") ? 0.95 : 1); }   /* 第2ウェーブ I: 星屑のお守りで別枠 -5% */
function buyDustPerk(id){
  const def = DUST_PERKS.find(p => p.id === id);
  if(!def) return;
  if(!S.dustPerks || typeof S.dustPerks !== "object") S.dustPerks = {};
  /* Sprint 4: レベル制の特典は繰り返し買える（価格は costMul 倍ずつ） */
  if(def.lv){
    const lv = perkLv(id);
    if(lv >= def.maxLv){ say("もう最大レベルにゃ"); return; }
    const cost = Math.ceil(def.baseCost * Math.pow(def.costMul, lv));
    if(S.dust < cost){ say("星屑が足りないにゃ…"); return; }
    S.dust -= cost; S.dustPerks[id] = lv + 1;
    SoundKit.play("purchase");
    addLog("⭐ 星屑ショップ: 『"+def.name+"』Lv"+(lv+1)+"（星屑-"+cost+"）");
    say("『"+def.name+"』Lv"+(lv+1)+" にゃ！");
    save(); renderPanel();
    return;
  }
  if(S.dustPerks[id]){ say("もう持ってるにゃ"); return; }
  if(S.dust < def.cost){ say("星屑が足りないにゃ…"); return; }
  S.dust -= def.cost; S.dustPerks[id] = true;
  SoundKit.play("purchase");
  addLog("⭐ 星屑ショップ: 『"+def.name+"』を購入（星屑-"+def.cost+"）");
  say("『"+def.name+"』、ゲットにゃ！");
  save(); renderPanel();
}
/* 引っ越しの事前計算: 得られる星屑・倍率の変化・リセット/引き継ぎ一覧。
   doPrestige 本体もこの gain を使うので、プレビューと実際の結果は必ず一致する */
function prestigePreview(){
  /* Phase D: グループEXIT — 売却益には全子会社の価値が上乗せされる */
  const subGain = (S.subs || []).reduce((a, s) => a + subDustValue(s), 0);
  const gain = Math.floor(S.runDP / BAL.prestigeDPPerDust) + subGain;
  const total = typeof S.dustTotal === "number" ? S.dustTotal : S.dust;
  const resets = ["コイン", "アップグレード", "研究", "スタッフ", "第2ライン", "応援強化"];
  if(subGain > 0) resets.push("子会社");
  const keeps = ["作品棚", "日報", "実績", "星屑と購入済み特典"];
  if(hasPerk("veteran") && S.staff.length){
    const vet = S.staff.slice().sort((a,b) => b.lv - a.lv)[0];
    resets.splice(resets.indexOf("スタッフ"), 1);
    keeps.push("最古参スタッフ『"+vet.name+"』（ベテラン制度）");
  }
  if(hasPerk("notebook")){
    const done = RESEARCH_DEFS.filter(r => S.research[r.id]).sort((a,b) => b.cost - a.cost);
    if(done.length){
      resets.splice(resets.indexOf("研究"), 1);
      keeps.push("研究『"+done[0].name+"』"+(done[0].requires ? "とその前提" : "")+"（研究ノート）");
    }
  }
  if(hasPerk("seedmoney")) keeps.push("初期資金 300🪙");
  if(hasPerk("piggybank")) keeps.push("星の貯金箱（コインの10%・最大500🪙を持ち越し）");
  return {
    gain, subGain,
    curMult: 1 + BAL.dustBonus * total,
    nextMult: 1 + BAL.dustBonus * (total + gain),
    resets, keeps
  };
}
function doPrestige(){
  const pv = prestigePreview();
  const gain = pv.gain;
  if(gain < 3){ say("売却には星屑3個ぶんの実績がいるにゃ（現在 "+gain+" 個ぶん）"); return; }
  if(!confirm("会社を売却しますか？\n星屑 "+gain+" 個を得て、生産倍率は ×"+pv.curMult.toFixed(2)+" → ×"+pv.nextMult.toFixed(2)+" になります。\nリセット: "+pv.resets.join("・")+"\n引き継ぎ: "+pv.keeps.join("・"))) return;
  doPrestigeCore();
}
/* 確認なしの本体。menu (viewer) からは VERBS 経由でこちらが呼ばれ、確認は
   viewer 側スタブで済ませる (resetSave / doResetSave と同じ分担)。
   帯 (owner) で confirm を出すと帯のスレッドがモーダルで止まり、cmd-result も
   スナップショットも返らなくなって全体が固まる (v2.4.7 実機バグ・二窓リグで再現済み) */
function doPrestigeCore(){
  const pv = prestigePreview();
  const gain = pv.gain;
  if(gain < 3) return;   /* 第2ウェーブ I: 小口 EXIT の下限は 3 個 */
  const coinsBefore = S.coins;   /* 星の貯金箱の持ち越し計算用（リセット前に確保） */
  /* 特典の引き継ぎ対象はリセット前に確保する */
  let keptStaff = null;
  if(hasPerk("veteran") && S.staff.length){
    keptStaff = JSON.parse(JSON.stringify(S.staff.slice().sort((a,b) => b.lv - a.lv)[0]));
  }
  let keptResearch = null;
  if(hasPerk("notebook")){
    const done = RESEARCH_DEFS.filter(r => S.research[r.id]).sort((a,b) => b.cost - a.cost);
    if(done.length){
      /* Sprint 4: ティア2を残すときは前提チェーンごと引き継ぐ（前提なしの
         ティア2だけが残って効果だけ生きる、という状態を作らない） */
      keptResearch = [];
      let cur = done[0];
      while(cur){ keptResearch.push(cur.id); cur = cur.requires ? RESEARCH_DEFS.find(r => r.id === cur.requires) : null; }
    }
  }
  const totalBefore = typeof S.dustTotal === "number" ? S.dustTotal : S.dust;

    return i1;
  };
  let idx;

  else if(a.loopCount !== Infinity && elapsed >= introMs + loopMs * a.loopCount){
    idx = outroMs > 0 ? pick(a.loopTo + 1, n - 1, Math.min(outroMs - 1, Math.max(0, elapsed - introMs - loopMs * a.loopCount))) : n - 1;
  } else {

       導入部と締めは常に順方向（タグはループ区間への指定として扱う） */
    const t = elapsed - introMs;
    const pass = Math.floor(t / loopMs);
    const off = t % loopMs;
    const dir = a.direction || "forward";
    const reversed = dir === "reverse" ||
      (dir === "pingpong" && pass % 2 === 1) ||
      (dir === "pingpong_reverse" && pass % 2 === 0);

      let acc = 0; idx = a.loopFrom;
      for(let i = a.loopTo; i >= a.loopFrom; i--){

  if(!(S.line2.project && S.line2.project.planning)) codeFeed += Math.max(0, d2);

  flowFeedStage("build", Math.max(0, (u1.build || 0) + (u2.build || 0)), q);

  flowFed[stage] += amount;
  flowAcc[stage] += amount;
  let budget = 2;   /* 1 tick の発火は工程ごとに最大2個 (在空上限と合わせる) */
  while(budget-- > 0 && flowAcc[stage] >= q){
    if(stripFlow.length >= 10) break;         /* 同時移動 ≤10 (ハードキャップ) */
    /* 束ね: 端数が大きい時は1枚の意味量を増やす (本数を増やさない原則 §3.2) */
    let b = 1;
    while(b < 8 && flowAcc[stage] >= q * b * 4) b *= 2;
    if(!fireFlowItem(stage, b)) break;

  if(stripNow - lastShipDispatchAt < 1500) return false;
  let carrying = 0;
  for(const id in stripWalkers) if(stripWalkers[id].carrying) carrying++;
  if(carrying >= 2) return false;
  let rolePick = null, nearPick = null, nearD = Infinity;
  for(const st of S.staff){

  sctx.moveTo(tx - 2.5, by + bh - 0.5); sctx.lineTo(tx + 2.5, by + bh - 0.5); sctx.lineTo(hx, by + bh + 4);
  sctx.closePath();
  sctx.fillStyle = "#fffaf2"; sctx.fill();
  sctx.fillStyle = "#4a3b2c"; sctx.textAlign = "left"; sctx.textBaseline = "middle";
  sctx.fillText(t, bx + 5.5, by + bh / 2 + 0.4);
  sctx.restore();
}

/* 帯の作品棚スロット（棚板の実測位置・帯座標）。
   prop_shelf (40×28) を ×2 接地: 板の内側は 上段 yb=G-30 / 下段 yb=G-10、
   横は棚中心から 4 枠ずつ。スプライトが無い場合は手続き棚 (76×52) の 2 段×5 枠 */
function stripShelfSlots(){
  const scx = stripShelfCX(), G = STRIP_GROUND;
  const slots = [];
  if(hasSprite("prop_shelf")){
    for(const dx of [-25, -12.5, 0, 12.5]){

      slots.push({ x: scx + dx, yb: G - 10, w: 10, h: 9 });
    }
  } else {
    for(let i = 0; i < 5; i++){
      slots.push({ x: scx - 30 + i * 12, yb: G - 36, w: 10, h: 9 });
      slots.push({ x: scx - 30 + i * 12, yb: G - 16, w: 10, h: 9 });

/* 並ぶ数は min(総リリース数≒ S.shelf.length, 枠数)。最新作は金枠グロー（旧部屋棚と同じ規則）。
   v2.3.3: 歩行ゲート ON の間は未配達分 (shelfPending) を先頭から伏せる —
   最新作の箱は、みゅけが棚まで運んで置いた瞬間に初めて現れる */
function stripShelfBoxes(){
  const slots = stripShelfSlots();
  const skip = hasWalkArt() ? Math.min(shelfPending, S.shelf.length) : 0;
  const view = skip ? S.shelf.slice(skip) : S.shelf;
  const n = Math.min(view.length, slots.length);
  const out = [];
  for(let i = 0; i < n; i++){
    const sl = slots[i];
    out.push({ x: sl.x, yb: sl.yb, w: sl.w, h: sl.h,
      color: SHELF_BOX_COLS[(view[i].icon || 0) % SHELF_BOX_COLS.length],
      glow: i === 0 && frame < shelfGlowFrame });
  }
  return out;
}

/* ---------- プロジェクトボード（帯の可読レイヤー） ----------
   「アプリの開発進捗が帯から一目で読めなきゃ意味ない」(sakuri) への構造的な答え。
   モニタ内の進捗 (R10 のダイジェティック詳細) は残し、その上に「離れて見て読める」
   層として、机クラスタの背後に立つ木枠ボードを常設する。
   配置の決定: 地面レベルの机クラスタ左端 (イーゼル 0.20W) は 1280px 幅では
   棚・PC・カレンダーに挟まれて太いバーの置き場がない。そこでボード面は
   クラスタ上空の完全に空いた帯 (y 4..34) に掲げ、支柱 2 本を机の背後に落とす。
   イーゼルは地上の装飾として存続し、ボードとは高さで住み分ける (置換しない)。
   支柱は細い標識柱で、棚の柵柱と同じ視覚重量級。歩行者・みゅけ・吹き出しは
   常にボードより手前に描かれる (R2)。中身の算数はメニューのヒーローカードと
   同一: frac = projectDP/totalDP、% は floor、目盛りは k/(feats+1) の節目位置 */
const STRIP_BOARD = { top: 3, h: 30, w: 204, w2: 108 };
function projectBoardModel(p, dp){
  if(!p) return { has: false, frac: 0, pct: -1, ticks: [], planning: false };
  if(p.planning){
    const cost = p.ideaCost || 0;
    const frac = cost > 0 ? Math.max(0, Math.min(1, Math.floor(S.ideas) / cost)) : 0;
    return { has: true, frac, pct: -1, ticks: [], planning: true };
  }
  const frac = Math.max(0, Math.min(1, dp / p.totalDP));
  const ticks = [];
  const n = (p.feats ? p.feats.length : 0);
  for(let k = 1; k <= n; k++) ticks.push(k / (n + 1));
  return { has: true, frac, pct: Math.floor(frac * 100), ticks, planning: false };
}
/* リーダーボードの feat チップ配置 (描画と付箋アニメの着地点で共有)。
   帯のメインボード = プロジェクトボード × メニューのヒーローカードの統合
   (2026-10-25 sakuri: 同じ機能はリーダーボード状の1枚にまとめる) */
function featChipRects(p, ix, iw){
  if(!p || !p.feats || !p.feats.length) return [];
  sctx.save();
  sctx.font = "700 7px 'Hiragino Maru Gothic ProN','Noto Sans JP',sans-serif";
  let maxLen = Math.max(...p.feats.map(f => f.length));
  const build = () => p.feats.map((f, k) => {
    let nm = f;
    if(nm.length > maxLen) nm = nm.slice(0, maxLen) + "…";
    const label = (k < p.doneFeats ? "✅ " : "⬜ ") + nm;
    return { label, w: sctx.measureText(label).width + 9, done: k < p.doneFeats };
  });
  let chips = build();
  let total = chips.reduce((a, c) => a + c.w, 0) + (chips.length - 1) * 3;
  while(total > iw - 3 && maxLen > 2){
    maxLen--;
    chips = build();
    total = chips.reduce((a, c) => a + c.w, 0) + (chips.length - 1) * 3;
  }
  let x = ix + 1.5;
  for(const c of chips){ c.x = x; x += c.w + 3; }
  sctx.restore();
  return chips;
}
function drawStripProjectBoard(bcx, bw, p, dp, key, small){
  const G = STRIP_GROUND, top = STRIP_BOARD.top;
  const bh = small ? STRIP_BOARD.h : 64;   /* メインはリーダーボード (204×64) */
  const bx = Math.round(bcx - bw / 2);
  const m = projectBoardModel(p, dp);
  /* 詰まりの視覚信号はボードが担う (帯の ⚠ はここが一目で読める形)。
     帰属ラインが決まらない詰まりは第1ラインのボードに寄せる (二重表示にしない) */
  const bnAll = currentBottleneck();
  const bn = bnAll && (small ? bnAll.line === 2 : bnAll.line !== 2) ? bnAll : null;
  /* 支柱と足 (机本体より先に描く: 支柱は机・PC・みゅけの背後に落ちる) */
  sShadow(bcx, G - 0.5, bw * 0.66);

    sR(px, top + bh - 2, 3, G - (top + bh - 2), "#8a6a44");

     (prop_kanban_wide 204×64・全面クリアに生地の行を描く)。小型ボードは木枠 */
  const ix = bx + 2.5, iy = top + 2.5, iw = bw - 5, ih = bh - 5;
  const wideFace = !small && officeTier(S) >= 1 && sDrawSprite("prop_kanban_wide", bcx, top + bh, 1);
  if(!wideFace){
    sR(bx, top, bw, bh, "#8a6a44");
    sR(bx, top, bw, 1.6, "#cfa06a");
    sR(ix, iy, iw, ih, "#fff5e6");
  }
  /* リリース直後は金枠で脈打つ (棚の最新作グローと同じ言語) */

  }
  /* 小型ボード (第2ライン) は従来の姿: 完成 feat の付箋が上枠にピン留めされる */
  if(small && p && !m.planning && p.doneFeats > 0){
    const nFeats = p.feats ? p.feats.length : 0;
    for(let k = 0; k < Math.min(p.doneFeats, nFeats); k++){
      const nx = bx + 18 + k * 6.5, ny = top + 2.5;

    }
  }
  /* 作品アイコン (棚に載る箱と同色 = 「この色の箱が増える」の予告編) */
  const col = p ? SHELF_BOX_COLS[(typeof p.icon === "number" ? p.icon : 0) % SHELF_BOX_COLS.length] : "#9a8f85";
  if(!m.planning || frame % 12 < 7){   /* 企画中はモニタと同じ点滅 */
    sR(ix + 1.5, iy + 1.5, 12, 12, col);
    sR(ix + 1.5, iy + 4.5, 12, 1.2, "#00000033");
  }
  if(small){
    /* ===== 小型ボード (第2ライン): % + 太バーだけの従来形 ===== */
    sctx.save();
    sctx.font = "700 15px 'Hiragino Maru Gothic ProN','Noto Sans JP',sans-serif";
    sctx.textAlign = "left"; sctx.textBaseline = "middle";
    sctx.fillStyle = bn ? "#d9534f" : "#4a3b2c";
    sctx.fillText(m.planning ? "💡" : (!m.has ? "—" : Math.round(m.frac * 100) + "%"), ix + 16.5, iy + 8);
    sctx.restore();
    if(bn){
      sR(ix + iw - 13.5, iy + 1, 11, 11, "#e2543e");
      sctx.save();
      sctx.font = "700 8px 'Hiragino Maru Gothic ProN','Noto Sans JP',sans-serif";

    sctx.fillText(nm, nx, iy + 9);
    if(bn){
      sR(ix + iw - 13.5, iy + 1, 11, 11, "#e2543e");
      sctx.font = "700 9.5px 'Hiragino Maru Gothic ProN','Noto Sans JP',sans-serif";
      sctx.textAlign = "center"; sctx.fillStyle = "#fff5e6";
      sctx.fillText("⚠", ix + iw - 8, iy + 7);
      sctx.textAlign = "left";
    } else {
      let px2 = ix + iw - 3 - sizeW;
      sR(px2, iy + 3, sizeW, 11.5, "#e8dcc4");
      sctx.font = "700 7px 'Hiragino Maru Gothic ProN','Noto Sans JP',sans-serif";
      sctx.fillStyle = "#4a3b2c"; sctx.textAlign = "center";
      sctx.fillText(sizeTxt, px2 + sizeW / 2, iy + 8.8);
      if(genreW){
        px2 -= genreW + 3;
        sR(px2, iy + 3, genreW, 11.5, col);
        sctx.fillStyle = "#fff5e6";
        sctx.fillText(p.genreName, px2 + genreW / 2, iy + 8.8);
      }
      sctx.textAlign = "left";
    }
    /* r2: 説明文 (企画中は着工までの案内) */
    sctx.font = "7.5px 'Hiragino Maru Gothic ProN','Noto Sans JP',sans-serif";
    sctx.fillStyle = "#8a6a44";
    let r2 = "";
    if(m.planning) r2 = "💡 企画中： アイデア あと " + Math.max(0, (p.ideaCost || 0) - Math.floor(S.ideas)) + " 個で着工（必要 " + (p.ideaCost || 0) + " 個）";
    else if(p.desc) r2 = p.desc;
    /* r2 右端: 進捗 DP 実数 + 生産 +N% (集中力 redesign の表示移設先。r5 中央は
       机のみゅけの頭に隠れるため、説明行の空いた右へ置く — DP 実数と同じ前例。
       企画中は生産が発生しないため DP 実数と同じ !planning ゲートに載せる) */
    const dpTxt = !m.planning ? "📈 " + fmt(Math.floor(dp)) + " / " + fmt(p.totalDP) + " DP" : "";
    const prodTxt = !m.planning ? "生産 +" + Math.round((concProdMult() - 1) * 100) + "%" : "";
    if(r2){
      let lim = iw - 6;
      if(!m.planning) lim -= sctx.measureText(dpTxt).width + 7 + sctx.measureText(prodTxt).width + 7;
      while(r2.length > 1 && sctx.measureText(r2).width > lim) r2 = r2.slice(0, -1);

    }
    if(!m.planning){

    }

  /* r3: 太いバー (節目ティック付き)。枠→溝→充填→目盛りの順 */
  const barX = ix + 1.5, barW = iw - 3, barY = iy + 26.5, barH = 7.5;
  sR(barX - 0.8, barY - 0.8, barW + 1.6, barH + 1.6, "#604B40");

  for(const t of m.ticks) sR(barX + Math.round(barW * t), barY, 1.2, barH, "#fff3b0");
  /* r4: feat チップ列 (ヒーローの featchip そのまま: ✅/⬜ + 名前) */

  if(p && !m.planning && bn){
    sctx.fillStyle = "#d9534f";
    sctx.fillText("⚠ 詰まりは第" + bnAll.line + "ライン", mx, ry);
  }
  if(p && !m.planning){
    sctx.textAlign = "right";
    const bugTxt = "🐛 " + fmt(Math.floor(S.bugStock));
    sctx.fillStyle = S.bugStock > 0 ? "#d9534f" : "#4a3b2c";
    sctx.fillText(bugTxt, ix + iw - 3, ry);
    sctx.fillStyle = "#4a3b2c";
    sctx.fillText("🔍 QA " + qaRate().toFixed(1) + "/分", ix + iw - 3 - sctx.measureText(bugTxt).width - 7, ry);
    sctx.textAlign = "left";
  }
  sctx.restore();
  /* Wave H: モジュールチップ列（ボード右側に吊るす縦タグ — ボード下は
     机と猫に遮られるため側面に置く）。統合待ちでテスト済みが詰まって
     いる間は赤く明滅する（動き＋色の二経路） */
  if(!small && p && p.modules && p.modules.length){
    const waiting = !modulesDone(p) && S.wip.tested >= 30;
    const blink = waiting && (Math.floor(stripNow / 400) % 2 === 0);
    const cw = 66;
    sctx.save();
    sctx.font = "700 7px 'Hiragino Maru Gothic ProN','Noto Sans JP',sans-serif";
    sctx.textAlign = "center"; sctx.textBaseline = "middle";
    p.modules.forEach((md, i) => {
      const cxp = bx + bw + 4, cyp = top + 14 + i * 13;
      const done = moduleComplete(md);
      sR(cxp, cyp, cw, 11, blink ? "#e2543e" : (done ? "#58a64a" : "#2d2d2d"));
      sR(cxp, cyp, cw, 1, done ? "#3d7a34" : "#454545");
      sctx.fillStyle = "#f5efe2";
      const label = md.name + " " + (md.out ? "外注" : done ? "★" + moduleQuality(md).toFixed(1) : Math.min(100, Math.floor(md.inv / md.need * 100)) + "%");
      sctx.fillText(label, cxp + cw / 2, cyp + 5.8);
    });
    sctx.restore();
    sctx.textAlign = "left";
  }
  /* Phase B・社格チップ（リーダーボード右上）: r1 は作品名＋ピル、r2 は DP 実数＋
     生産 +N% で既に満杯で、ボード上端は帯の上端から 3px しかないため、面の中に
     押し込まず右端にタブとして張り出す。帯の上段はボード以外に高い家具がなく、
     右隣の家具（研究机・第2ライン机）は地面側の低い物なので重ならない。
     端に寄せた配置では反対側へ逃がし、両端とも入らなければ出さない（表示のみで
     クリック判定は持たない。社格の確認はメニューのチップでもできる） */
  {
    const rankTxt = companyRank() + " " + S.staff.length + "/" + staffCap() + "人" +
      (S.subs && S.subs.length ? " ・ グループ" + S.subs.length + "社・総勢" + totalPeople() + "人" : "");
    sctx.save();
    sctx.font = "700 7.5px 'Hiragino Maru Gothic ProN','Noto Sans JP',sans-serif";
    sctx.textAlign = "left"; sctx.textBaseline = "middle";
    const tw = sctx.measureText(rankTxt).width + 10;
    let tx = bx + bw + 1;
    if(tx + tw > stripVW - 2) tx = bx - tw - 1;
    if(tx >= 1){
      sR(tx, top + 1, tw, 12, "#8a6a44");
      sR(tx + 1, top + 2, tw - 2, 10, "#fff5e6");
      sctx.fillStyle = "#4a3b2c";
      sctx.fillText(rankTxt, tx + 5, top + 7);
    }
    sctx.restore();
  }
  /* Stage 3: ボードに付く小物 — 電話 (スタッフ) と真鍮タグ (コイン残高・表示のみ)。
     Phase E: 電話は独立した配置項目 (propPlace)。既定ではボード左端についてくるが、
     ドラッグで切り離せば机や棚の上にも載る。吊りメモは下のブロックで同様に解決 */
  const phonePl = propPlace("phone");
  if(!tutTabLocked("staff") && sDrawSprite("prop_phone", phonePl.cx, phonePl.baseY, 1)){
    stripObjArt.phone = { name: "prop_phone", gx: phonePl.cx, gy: phonePl.baseY, s: 1 };
    stripHitRects.phone = { x: phonePl.cx - 12, y: phonePl.baseY - 24, w: 24, h: 24 };
    if(S.staff.length < staffCap() && Object.keys(STAFF_ROLES).some(r => hireCost(r) <= S.coins) && frame % 50 < 30){
      /* 雇用可能の合図: 電話の右上に付く小さな金バッジ (上下の帯状ラインは
         ホバーの輪と紛れるため v2.4.7 で廃止) */
      sR(phonePl.cx + 7.5, phonePl.baseY - 27.5, 4.4, 4.4, "#ffd94d");
      sR(phonePl.cx + 9.1, phonePl.baseY - 26.6, 1.2, 2.6, "#4a3b2c");
    }
  }
  const memoTxt = stripMemoText();
  if(memoTxt && (propEntry("memo") || layoutEdit.dragId === "memo")){
    /* Phase E: メモを掴んで切り離した姿 — ボードから独立し、地面に立つ札になる */
    const memoPl = propPlace("memo");
    const mw = 150, mx0 = memoPl.cx - 75, my0 = memoPl.baseY - 16;
    const memoGold = !!S.bigDeal;
    sR(mx0, my0, mw, 16, memoGold ? "#d9a41a" : "#8a6a44");
    sR(mx0 + 1.5, my0 + 1.5, mw - 3, 13, memoGold && frame % 50 < 25 ? "#ffe9a8" : "#fff5e6");
    sR(mx0 + 5, my0 - 0.5, 3, 3, "#e2543e");
    sctx.save();
    sctx.font = "700 7.5px 'Hiragino Maru Gothic ProN','Noto Sans JP',sans-serif";
    sctx.textAlign = "left"; sctx.textBaseline = "middle"; sctx.fillStyle = "#4a3b2c";
    let mt = memoTxt;
    if(sctx.measureText(mt).width > mw - 10){
      while(mt.length > 1 && sctx.measureText(mt).width > mw - 13) mt = mt.slice(0, -1);
      mt += "…";
    }
    sctx.fillText(mt, mx0 + 5, my0 + 8.4);
    sctx.restore();
    stripHitRects.memo = { x: mx0, y: my0, w: mw, h: 16 };
  }
  if(memoTxt && !propEntry("memo") && layoutEdit.dragId !== "memo"){
    const mw = 150, mx0 = bx + 4, my0 = top + bh + 2;
    sR(bx + 14, top + bh - 1, 2, 3, "#604B40"); sR(bx + 138, top + bh - 1, 2, 3, "#604B40");
    const memoGold = !!S.bigDeal;   /* Phase C: 大型案件の間はメモが金色に明滅（色＋動きの二経路） */
    sR(mx0, my0, mw, 16, memoGold ? "#d9a41a" : "#8a6a44");
    sR(mx0 + 1.5, my0 + 1.5, mw - 3, 13, memoGold && frame % 50 < 25 ? "#ffe9a8" : "#fff5e6");
    sR(mx0 + 5, my0 - 0.5, 3, 3, "#e2543e");
    sctx.save();
    sctx.font = "700 7.5px 'Hiragino Maru Gothic ProN','Noto Sans JP',sans-serif";
    sctx.textAlign = "left"; sctx.textBaseline = "middle"; sctx.fillStyle = "#4a3b2c";
    let mt = memoTxt;
    if(sctx.measureText(mt).width > mw - 10){
      while(mt.length > 1 && sctx.measureText(mt).width > mw - 13) mt = mt.slice(0, -1);
      mt += "…";
    }
    sctx.fillText(mt, mx0 + 5, my0 + 8.4);
    sctx.restore();
    stripHitRects.memo = { x: mx0, y: my0, w: mw, h: 16 };
  }
  {
    const tw = 68, tx0 = bx + bw - 4 - tw, ty0 = top + bh + 2;
    sR(bx + bw - 18, top + bh - 1, 2, 3, "#604B40");
    sR(tx0, ty0, tw, 16, "#8a6a44");
    sR(tx0 + 1.5, ty0 + 1.5, tw - 3, 13, "#d9b23a");
    sctx.save();
    sctx.font = "700 8.5px 'Hiragino Maru Gothic ProN','Noto Sans JP',sans-serif";
    sctx.textAlign = "center"; sctx.textBaseline = "middle"; sctx.fillStyle = "#4a3b2c";
    sctx.fillText("🪙 " + fmt(Math.floor(S.coins)), tx0 + tw / 2, ty0 + 8.4);
    sctx.restore();
  }
  stripHitRects[key] = { x: bx, y: top, w: bw, h: bh };
}

/* ---------- 可視生産: 工程の「山」(静止画の正直さ) ----------
   山の高さは stageStatus() の frac そのもの — メニューの仕掛品バーと
   常に同じ事実を指す。B=実装バッファ (テスト待ちカード)、C=テスト済み
   (ビルド待ちカード)、D=ビルド済み (出荷待ちの箱)。赤変は stageStatus の
   lamp (B はバグ過多の赤滲みも併せる) に従い、判定を二重実装しない */
function pileModel(){
  const st = stageStatus();
  const byId = {};
  for(const s of st) byId[s.id] = s;
  const bugF = bugFactor();
  const capC = Math.max(60, testRate() * bugF * 2), capT = Math.max(60, buildRate() * 2);
  return {
    code:  { frac: byId.code.frac,  n: Math.round(byId.code.frac * 8),
             red: byId.code.lamp === "red" || S.bugStock > 8 },
    test:  { frac: byId.test.frac,  n: Math.round(byId.test.frac * 8),
             red: byId.test.lamp === "red" },
    build: { frac: byId.build.frac, n: Math.round(byId.build.frac * 5),
             red: byId.build.lamp === "red" },
    bugs: Math.min(8, Math.floor(S.bugStock)),
    l2: S.line2.unlocked ? {
      codeN: Math.round(Math.min(1, S.line2.wip.code / capC) * 4),
      testN: Math.round(Math.min(1, S.line2.wip.tested / capT) * 4)
    } : null
  };
}
/* カード1枚 (白紙 + シンタタックス色の短線2本。モニタ画面と同色セット)。
   bundle は束ね表示: 後ろにずらした影カードで厚みを付ける (§3.2) */
function drawFlowCard(x, y, bundle, tickMark, seed){
  const layers = bundle >= 4 ? 2 : bundle >= 2 ? 1 : 0;
  const cols = FLOW_CARD_COLS;
  const c1 = cols[Math.floor((seed || 0) * 4) % 4], c2 = cols[(Math.floor((seed || 0) * 4) + 1) % 4];
  for(let l = layers; l >= 0; l--){
    const ox = x - l * 1.3, oy = y - l * 1.3;
    sR(ox - 5.6, oy - 3.8, 11.2, 7.6, "#604B40");
    sR(ox - 5, oy - 3.25, 10, 6.5, "#fff5e6");
    if(l === 0){
      sR(ox - 3.8, oy - 1.7, 6.4, 1.1, c1);
      sR(ox - 3.8, oy + 0.5, 4.4, 1.1, c2);
      if(tickMark){ sR(ox + 2.9, oy - 3.25, 2.1, 2.1, "#7be495"); sR(ox + 3.4, oy - 2.7, 1.1, 1.1, "#fff5e6"); }
    }
  }
}
/* 山の格子: 横2列×段。idx は下段から。カード系 (B/C) と箱系 (D) で寸法が違う */
function pileSlotPos(cx, idx, boxKind){
  const col = idx % 2, row = Math.floor(idx / 2);
  if(boxKind){
    /* 2026-10-25: icon_box は 28×28 (sakuri 作画・可視部は下端から 8 行上) になったため、
       接地と段ピッチを可視部基準に補正 (旧 16×16 前提のピッチでは箱が浮いて見える) */
    /* 2026-10-26: prop_ship が 48×48 (Codex 描き直し) になり台の天面が G-16 へ
       上がったため、スタック全体を 12 上へ (旧 +3.2 → -8.8) */
    if(idx === 4) return { x: cx, yb: STRIP_GROUND - 8.8 - 2 * 9.2 };   /* 5個目は天辺中央 */
    return { x: cx + (col === 0 ? -6.8 : 6.8), yb: STRIP_GROUND - 8.8 - row * 9.2 };
  }
  return { x: cx + (col === 0 ? -5.9 : 5.9), yb: STRIP_GROUND - 3.5 - row * 7.6 };
}
function drawStripPiles(){
  const G = STRIP_GROUND, m = pileModel();
  /* --- B: QA トレイ (机と研究机の間) --- */
  const bx = stripQAX();
  sR(bx - 14, G - 3, 28, 3, "#445464"); sR(bx - 14, G - 3, 28, 1, "#66707c");
  if(m.code.red) sR(bx - 14, G - 3.6, 28, 1.1, "#e2543e");
  for(let i = 0; i < m.code.n; i++){
    const p = pileSlotPos(bx, i, false);
    drawFlowCard(p.x, p.yb - 3.25, 1, false, i * 0.37);
  }
  /* バグ滞留: 山の上にバグが這う (min(8, bugStock))。QA/debug で減ると潰れる */
  if(m.bugs > 0){
    const topY = G - 3.5 - Math.max(1, Math.ceil(m.code.n / 2)) * 7.6;
    for(let i = 0; i < m.bugs; i++){
      const jx = Math.sin((frame + i * 7) * 0.35) * 1.2;
      const gx = bx - 8 + (i % 4) * 5.4 + jx, gy = topY - 1.5 - Math.floor(i / 4) * 4.5;
      if(!sDrawSprite("icon_bug", gx, gy + 4, 0.32)) sR(gx - 2, gy - 2, 4.5, 3.5, "#3a3230");
    }
  }
  if(stripBugSquash && stripNow - stripBugSquash.at < 300){
    const sa = 1 - (stripNow - stripBugSquash.at) / 300;
    sctx.save(); sctx.globalAlpha = sa;
    if(!sDrawSprite("icon_bug", stripBugSquash.x, stripBugSquash.y + 5, 0.32))
      sR(stripBugSquash.x - 2, stripBugSquash.y - 1, 4.5, 2, "#3a3230");
    sctx.restore();
  }
  if(m.code.red) stripHitRects.piles.push({ x: bx - 15, y: Math.min(G - 12, pileTopY("code") - 6), w: 30, h: G - Math.min(G - 12, pileTopY("code") - 6), stage: "code" });
  /* --- C: ビルド置き場 (サーバ予定地の足元。木箱台) --- */
  const cxp = stripBuildX();
  sR(cxp - 13, G - 4, 26, 4, "#8a6a44"); sR(cxp - 13, G - 4, 26, 1.2, "#b08954");
  if(m.test.red) sR(cxp - 13, G - 4.6, 26, 1.1, "#e2543e");
  for(let i = 0; i < m.test.n; i++){
    const p = pileSlotPos(cxp, i, false);
    drawFlowCard(p.x, p.yb - 3.25, 1, true, i * 0.53);
  }
  if(m.test.red) stripHitRects.piles.push({ x: cxp - 14, y: Math.min(G - 12, pileTopY("test") - 6), w: 28, h: G - Math.min(G - 12, pileTopY("test") - 6), stage: "test" });
  /* --- D: 出荷スタック (箱の積み場 + 「出荷」札) --- */
  const dx = stripShipX();
  /* 2026-10-26: prop_ship は Codex 描き直し (48×48・「出荷」の文字も絵の側)。
     コード描きのフォールバックと文字載せは廃止 (アートへのスクリプト混入禁止) */
  sDrawSprite("prop_ship", dx + 2, G, 1);
  /* Phase D: 子会社がある間だけ、出荷スポットの隣に別館の看板が立つ */
  if(S.subs && S.subs.length && hasSprite("prop_annex_sign"))
    sDrawSprite("prop_annex_sign", dx - 42, G, 1);
  if(m.build.red) sR(dx - 20, G - 16.6, 44, 1.1, "#e2543e");
  for(let i = 0; i < m.build.n; i++){
    const p = pileSlotPos(dx, i, true);
    sDrawSprite("icon_box", p.x, p.yb, 0.78);
  }
  /* パッケージ節目: 完成箱が次のスロットに光って現れる (実イベントの残像) */
  if(stripNow < stripPkgGlowUntil){
    const gi = m.build.n;
    const p = gi === 4 ? { x: dx, yb: G + 3.2 - 2 * 9.2 } : pileSlotPos(dx, gi, true);
    if(gi < 5){
      sDrawSprite("icon_box", p.x, p.yb, 0.78);
      if(frame % 6 < 3){
        sR(p.x - 7, p.yb - 15.6, 14, 1.2, "#ffd94d"); sR(p.x - 7, p.yb - 5.4, 14, 1.2, "#ffd94d");
        sR(p.x - 7, p.yb - 15.6, 1.2, 10.2, "#ffd94d"); sR(p.x + 5.8, p.yb - 15.6, 1.2, 10.2, "#ffd94d");
      }

/* 移動中の物 (描画層④: 家具より手前・キャラより後ろ) */
function drawStripFlowItems(){
  const G = STRIP_GROUND;
  for(const it of stripFlow){
    if(it.age < 0) continue;
    const t = Math.min(1, it.age / it.dur);
    const x = it.x0 + (it.x1 - it.x0) * t;
    let y = it.y0 + (it.y1 - it.y0) * t - Math.sin(t * Math.PI) * (it.arc || 0);
    if(it.kind === "card"){
      drawFlowCard(x, y, it.bundle || 1, !!it.tick, it.seed || 0);
    } else if(it.kind === "morph"){
      if(t < 0.5) drawFlowCard(x, y, it.bundle || 1, true, it.seed || 0);
      else sDrawSprite("icon_box", x, y + 6.5, 0.8);
    } else if(it.kind === "slide"){
      sctx.save();
      if(t > 0.8) sctx.globalAlpha = 1 - (t - 0.8) / 0.2;
      sDrawSprite("icon_box", x, G - 1, 0.85);
      sctx.restore();
    } else if(it.kind === "note"){
      sR(x - 2.5, y - 2.5, 5, 5, it.col || "#ffd94d");
      sR(x - 2.5, y - 2.5, 5, 1.2, "#00000022");
    } else if(it.kind === "mote"){
      y = it.y0 - t * 15;
      sctx.save(); sctx.globalAlpha = 1 - t;
      sR(x - 1.6, y - 1.6, 3.2, 3.2, it.col || "#c586c0");
      sR(x - 0.5, y - 0.5, 1, 1, "#ffffff");
      sctx.restore();
    } else if(it.kind === "idea"){
      sctx.save();
      if(t > 0.7) sctx.globalAlpha = 1 - (t - 0.7) / 0.3;
      sDrawSprite("icon_idea", x, y + 5, 0.7);
      sctx.restore();
    }
  }
}

/* ---------- ヒットゾーンの計算と Rust への送信 ----------
   仮想座標の記録矩形を、キャンバスの実表示 rect で CSS px（= ウィンドウ内

function computeHitZones(){
  const zones = [];
  if(!stripCv) return zones;
  const rect = stripCv.getBoundingClientRect();
  if(!rect.width || !rect.height) return zones;
  /* 並べ替え中は帯全体を掴めるようにする (ドラッグが家具の外で切れない) */
  if(layoutEdit.on){
    return [[Math.round(rect.left), Math.round(rect.top),
             Math.round(rect.width), Math.round(rect.height)]];
  }
  const sx = rect.width / stripVW, sy = rect.height / STRIP_H;
  const R = stripHitRects;
  const push = (r, pad) => {
    if(!r) return;
    zones.push([
      Math.round(rect.left + r.x * sx - pad), Math.round(rect.top + r.y * sy - pad),
      Math.round(r.w * sx + pad * 2), Math.round(r.h * sy + pad * 2)
    ]);
  };
  push(R.desk, 2);
  push(R.shelf, 4);   /* Strip Canon: 棚も「見えている物」としてクリック可能に (R12) */
  push(R.board, 4);   /* プロジェクトボードも同様 (R12: 物から管理への導線) */
  push(R.board2, 4);
  for(const pr of (R.piles || [])) push(pr, 4);   /* 可視生産: 詰まった山も押せる */
  push(R.snack, 4);   /* 2026-10-25: おやつ箱も押せる */
  push(R.research, 4); push(R.rack, 4); push(R.trophy, 4); push(R.calendar, 4);
  push(R.memo, 4); push(R.phone, 4); push(R.megaphone, 4); push(R.toolbox, 4);
  push(R.duck, 6);
  push(R.fish, 6);
  for(const br of (R.bugs || [])) push(br, 4);
  for(const sr of R.staff) push(sr, 8);
  push(R.miyuke, 10);
  push(R.bubble, 4);

  if(grip && document.body.classList.contains("strip")){
    const gr = grip.getBoundingClientRect();
    if(gr.width) zones.push([Math.round(gr.left), Math.round(gr.top), Math.round(gr.width), Math.round(gr.height)]);
  }
  const layoutBtnEl = document.getElementById("strip-layout");
  if(layoutBtnEl && document.body.classList.contains("strip")){
    const lr = layoutBtnEl.getBoundingClientRect();
    if(lr.width) zones.push([Math.round(lr.left), Math.round(lr.top), Math.round(lr.width), Math.round(lr.height)]);
  }

    const x = Math.max(0, z[0]), y = Math.max(0, z[1]);
    return [x, y, Math.max(0, Math.min(z[2], W - x)), Math.max(0, Math.min(z[3], H - y))];

      if(ux >= pr.x && ux <= pr.x + pr.w && uy >= pr.y && uy <= pr.y + pr.h){

        return;
      }
    }
    const mx = stripMiyukeX();

      if(uy < STRIP_GROUND - 50) part = "head";
      else if(uy > STRIP_GROUND - 24 && Math.abs(ux - mx) < 20) part = "belly";
      else part = "body";
    }
    /* v2.3.3: 散歩中のみゅけをクリックしたら、散歩を切り上げて帰らせる */
    if(part && miyukeTrip && miyukeTrip.kind === "stroll") miyukeTrip.phase = "return";
    if(part){
      const now = Date.now();
      clickTimes = clickTimes.filter(t => now - t < 2000); clickTimes.push(now);

        /* v2.4.2: 連打への文句は台詞だけにする。以前はこのクリック自体を

           いたため、「5回ごとにクールタイムがある」ように感じた。本来の

        clickTimes = [];
        say("もう！しっぽブンブンだにゃ。ちょっと落ち着いて…");
      }
    } else {
      clickTimes = [];
    }
    const crit = cheerClick(ux, uy, part);
    stripSparks.push({ x: ux, y: uy, born: Date.now() });
    if(stripSparks.length > 10) stripSparks.shift();
    if(!crit) addStripFloater(ux, uy - 9, "+" + (clickBaseDP() * comboMult()).toFixed(1) + "DP");
    else addStripFloater(ux, uy - 9, "CRITICAL!", "#d9534f");
    if(part && !crit){
      if(part === "head"){ S.concentration = Math.min(100, S.concentration + 2); say("ん。…悪くないにゃ"); }
      if(part === "body"){ say("カタカタの邪魔しないでにゃ〜（嬉しいけど）"); }
      if(part === "belly"){ say("そこはダメにゃ！ひっくり返る…"); setState("react_annoy", 900); }
      if(Math.random() < 0.15){ S.ideas += 1; addLog("なでられてひらめいた（アイデア+1）"); }
    } else if(!part && !crit && Math.random() < 0.3){
      say(CHEER_LINES[Math.floor(Math.random() * CHEER_LINES.length)]);
    }
    renderHeader();
  });
  /* v2.4.6: ホバー位置 (論理座標) を記録する。アクションのある家具の黄色枠に使う */
  stripCv.addEventListener("pointermove", (e) => {
    const rect = stripCv.getBoundingClientRect();
    if(!rect.width || !rect.height){ stripHover = null; return; }
    stripHover = {
      x: (e.clientX - rect.left) / rect.width * stripVW,
      y: (e.clientY - rect.top) / rect.height * STRIP_H
    };
  });
  stripCv.addEventListener("pointerleave", () => { stripHover = null; });
  /* v2.4.0: 家具ドラッグの追随と確定 (離した瞬間にセーブへ保存)。
     Phase E: 小物・機能オブジェクトは候補 (面 or 地面) を計算して下書きし、
     離した瞬間に propDrop が確定する (家具クラスタは従来どおり直接書く) */
  stripCv.addEventListener("pointermove", (e) => {
    if(!layoutEdit.on || !layoutEdit.dragId) return;
    const rect = stripCv.getBoundingClientRect();
    if(!rect.width) return;
    const ux = (e.clientX - rect.left) / rect.width * stripVW;
    const uy = (e.clientY - rect.top) / rect.height * STRIP_H;
    const it = layoutItems().find(i => i.id === layoutEdit.dragId);
    if(!it) return;
    if(it.prop){
      layoutEdit.dragCand = propDragCandidate(it.id, ux, uy, ux - layoutEdit.grabDX);
      return;
    }
    const half = it.w / 2;
    let cx = Math.max(half + 2, Math.min(stripVW - half - 2, ux - layoutEdit.grabDX));
    cx = snapCX(cx, it.id);
    if(!S.layout || typeof S.layout !== "object") S.layout = {};
    S.layout[it.id] = Math.round(cx / stripVW * 1000) / 1000;
  });
  const endLayoutDrag = () => {
    if(!layoutEdit.dragId) return;
    const it = layoutItems().find(i => i.id === layoutEdit.dragId);
    if(it && it.prop) propDrop(it.id);
    layoutEdit.dragId = null;
    layoutEdit.dragCand = null;
    stripCv.style.cursor = layoutEdit.on ? "grab" : "";
    save(); publishHitZones(true);
  };
  stripCv.addEventListener("pointerup", endLayoutDrag);
  stripCv.addEventListener("pointercancel", endLayoutDrag);
}

function fmt(n){ return Math.floor(n).toLocaleString("ja-JP"); }
/* Sprint 2: HUD の数字は実値へイージングで追いつく（線形な即時更新は「機械的で
   死んで見える」ので、増減どちらも少し遅れて滑らかに収束させる） */
const hudShown = { coins: null, ideas: null, packages: null, bugs: null, rp: null, dust: null };
function hudNum(key, target){
  const cur = hudShown[key];
  if(cur === null || typeof cur !== "number"){ hudShown[key] = target; return target; }
  const diff = target - cur;
  if(Math.abs(diff) < 1){ hudShown[key] = target; return target; }
  hudShown[key] = cur + diff * 0.32;
  return hudShown[key];
}
/* ---------- Sprint 3: 「あと○○」ヒントと買える瞬間のパルス ----------
   収入レートは直近約2分の実績（コイン/研究Pの増分）から推定する。
   あと約2分で買える物だけ「あと ○○」を出し、買えるようになった瞬間に
   ボタンを光らせる（音はフル画面を見ている時だけ。帯では絶対に鳴らさない）。 */
let incomeSamples = [];   /* { t, c: coins, r: rp }（ランタイムのみ・保存しない） */
function sampleIncome(now){
  incomeSamples.push({ t: now, c: S.coins, r: S.rp });
  while(incomeSamples.length && now - incomeSamples[0].t > 130000) incomeSamples.shift();
}
function incomeRatePerMin(cur){
  if(incomeSamples.length < 2) return 0;
  const key = cur === "rp" ? "r" : "c";
  const newest = incomeSamples[incomeSamples.length - 1];
  const now = newest.t;
  let oldest = newest;
  for(const s of incomeSamples){ if(now - s.t <= 125000){ oldest = s; break; } }
  const dtMin = (newest.t - oldest.t) / 60000;
  if(dtMin < 0.3) return 0;
  return Math.max(0, (newest[key] - oldest[key]) / dtMin);
}
const affordPrev = {};    /* key -> "far"|"almost"|"afford"（遷移検知用） */
const affordPulseAt = {}; /* key -> 買えるようになった時刻 */
function affordInfo(key, cost, cur){
  const have = cur === "rp" ? S.rp : cur === "dust" ? S.dust : S.coins;
  const afford = have >= cost;
  const deficit = Math.max(0, Math.ceil(cost - have));
  let st = afford ? "afford" : "far";
  if(!afford && cur !== "dust"){
    const rate = incomeRatePerMin(cur);
    if(rate > 0 && deficit <= rate * 2) st = "almost";
  }
  const prev = affordPrev[key];
  if(prev && prev !== "afford" && st === "afford"){
    affordPulseAt[key] = Date.now();
    let strip = false;
    try{ strip = document.body.classList.contains("strip"); }catch(e){}
    if(!strip) SoundKit.play("purchase");
  }
  affordPrev[key] = st;
  return { afford, deficit, almost: st === "almost",
           pulse: afford && (Date.now() - (affordPulseAt[key] || 0) < 9000) };
}
/* 購入ボタンの共通生成: 価格＋（あと少しなら）不足分ヒント＋到達パルス */
function buyBtn(key, cost, cur, onclick, extraDisabled, prefix){
  const a = affordInfo(key, cost, cur);
  const unit = cur === "rp" ? "🔬" : cur === "dust" ? "⭐" : "🪙";
  /* メニュー刷新 P1: 価格は金の価格タグとして分離表示 (MENU_REDESIGN_SPEC §4.5) */
  let label = (prefix ? "<span class='buy-act'>" + prefix + "</span>" : "") +
    "<span class='pricetag'>" + fmt(cost) + unit + "</span>";
  let cls = "buybtn";
  if(a.almost){ label += " <span class='ahint'>あと " + fmt(a.deficit) + unit + "</span>"; cls += " almost"; }
  if(a.pulse) cls += " afford-now";
  const dis = (!a.afford || extraDisabled) ? " disabled" : "";
  return "<button class='" + cls + "' onclick='" + onclick + "'" + dis + ">" + label + "</button>";
}

/* ---------- Sprint 3: ライン信号機とボトルネックの1クリック対策 ----------
   ランプの意味: 緑=流れている / 黄=素材待ち（飢え）または溜まり気味 /
   赤=止まっている（バグ詰まり・在庫飽和で下流が捌けない）。
   第2ラインはテスト/ビルド/出荷の処理能力を第1ラインと共有するので、
   ランプとバーは両ライン合算の流れ・在庫で判定する（仕掛品表示も合算）。 */
function bottleneckStage(){
  const prod = productionRate() + (S.line2.unlocked ? line2Rate() : 0);
  const stages = [
    { id:"test", name:"テスト", rate: testRate() * bugFactor() },
    { id:"build", name:"ビルド", rate: buildRate() },
    { id:"ship", name:"出荷", rate: shipRate() }
  ];
  let worst = stages[0];
  for(const s of stages) if(s.rate < worst.rate) worst = s;
  return { prod, worst, isBn: worst.rate < prod };
}
function bottleneckInfo(){
  const b = bottleneckStage();
  return { prod: b.prod, worst: { name: b.worst.name, rate: b.worst.rate }, isBn: b.isBn };
}
/* Sprint 4: 企画ランプの進み具合は「次の着工に必要なアイデア」基準 (C2-P2-2)。
   /10 固定だと序盤は常時満タン・終盤は常時空っぽで嘘になっていた */
function planFrac(){
  const cost = (S.project && S.project.planning) ? (S.project.ideaCost || 0)
    : (IDEA_COST[S.project ? S.project.size : "S"] || 0);
  if(cost <= 0) return 1;
  return Math.min(1, S.ideas / cost);
}
function stageStatus(){
  const bugF = bugFactor();
  const inflow = productionRate() + (S.line2.unlocked ? line2Rate() : 0);
  const tEff = testRate() * bugF, bR = buildRate(), sR = shipRate();
  const wCode = S.wip.code + S.line2.wip.code;
  const wTested = S.wip.tested + S.line2.wip.tested;
  const wBuilt = S.wip.built + S.line2.wip.built;
  /* バーの容量 = 下流が約2分で捌ける量（最低60DP）。満杯=飽和の目安 */
  const capCode = Math.max(60, tEff * 2), capTested = Math.max(60, bR * 2), capBuilt = Math.max(60, sR * 2);
  const planning = !!((S.project && S.project.planning) || (S.line2.project && S.line2.project.planning));
  let codeLamp = "green";
  if(wCode >= capCode && tEff < inflow) codeLamp = "red";
  else if(inflow <= 0.01) codeLamp = "yellow";
  let testLamp = "green";
  if(S.bugStock > 8 && bugF <= 0.85) testLamp = "red";
  else if(wCode <= 0.01) testLamp = "yellow";
  else if(wTested >= capTested && bR < tEff) testLamp = "yellow";
  let buildLamp = "green";
  if(wBuilt >= capBuilt && sR < bR * 0.6) buildLamp = "red";
  else if(wTested <= 0.01 || (wBuilt >= capBuilt && sR < bR)) buildLamp = "yellow";
  let shipLamp = "green";
  if(wBuilt <= 0.01 || (S.project && S.project.planning)) shipLamp = "yellow";
  return [
    { id:"plan",  name:"企画",   lamp: planning ? "yellow" : "green", frac: planFrac() },
    { id:"code",  name:"実装",   lamp: codeLamp,  frac: Math.min(1, wCode / capCode) },
    { id:"test",  name:"テスト", lamp: testLamp,  frac: Math.min(1, wTested / capTested) },
    { id:"build", name:"ビルド", lamp: buildLamp, frac: Math.min(1, wBuilt / capBuilt) },
    { id:"ship",  name:"出荷",   lamp: shipLamp,  frac: S.project ? Math.min(1, S.projectDP / S.project.totalDP) : 0 }
  ];
}
/* Sprint 4: 詰まりが「どちらのライン」のものか (C2-P1-5)。
   企画中が片方だけならそのライン。仕掛品の山が片方に偏ってもそのライン。
   判定できない（両ライン拮抗・第2ラインなし）ときは null（無理に言わない） */
function bottleneckLine(){
  if(!S.line2.unlocked) return null;
  const p1 = !!(S.project && S.project.planning), p2 = !!(S.line2.project && S.line2.project.planning);
  if(p1 !== p2) return p1 ? 1 : 2;
  const sum = w => w.code + w.test + w.build;
  const t1 = sum(S.wip), t2 = sum(S.line2.wip);
  if(t1 >= 60 && t1 > t2 * 1.5) return 1;
  if(t2 >= 60 && t2 > t1 * 1.5) return 2;
  return null;
}
/* いま一番の詰まり（チップ表示用）。なければ null */
function currentBottleneck(){
  if(S.bugStock > 8 && bugFactor() <= 0.85)
    return { stage:"test", reason:"bug",
      text: "テストがバグで詰まり中（バグ在庫 " + Math.floor(S.bugStock) + "匹）" };
  const b = bottleneckStage();
  if(b.isBn){
    const line = bottleneckLine();
    return { stage: b.worst.id, reason:"rate", line,
      text: b.worst.name + "がボトルネック（" + Math.floor(b.worst.rate) + " DP/分）" +
        (line ? "（主に第" + line + "ライン）" : "") };
  }
  return null;
}
/* 詰まり → 直し方（開くタブと、光らせる購入行 data-fix）の解決 */
function bottleneckFix(){
  const bn = currentBottleneck();
  if(!bn) return null;
  const upFree = id => { const d = UPGRADE_DEFS.find(u => u.id === id); return d && (S.upgrades[id] || 0) < d.max; };
  if(bn.stage === "test"){
    if(upFree("tester")) return { tab:"factory", fix:"up:tester" };
    if(upFree("duck")) return { tab:"factory", fix:"up:duck" };
    return { tab:"staff", fix:"hire:test" };
  }
  if(bn.stage === "build"){
    if(upFree("ci")) return { tab:"factory", fix:"up:ci" };
    if(upFree("pack")) return { tab:"factory", fix:"up:pack" };
    return { tab:"staff", fix:"hire:prog" };
  }
  if(bn.stage === "ship"){
    if(upFree("bot")) return { tab:"factory", fix:"up:bot" };
    return { tab:"staff", fix:"hire:carry" };
  }
  return { tab:"factory", fix:null };
}

function gotoBottleneckFix(){
  const fix = bottleneckFix();
  if(!fix){ switchTab("factory"); return; }
  switchTab(fix.tab);
  if(!fix.fix) return;
  try{
    let el = document.querySelector("#panel [data-fix='" + fix.fix + "']");
    /* IA コンパクト化: 対策の購入行が閉じた折りたたみの中にある場合は先に開く
       （折りたたみは見た目だけの畳み込みで、機能を塞がないための連動） */

        panelFold[fd.getAttribute("data-fold")] = true;

      }

      el.classList.add("flash");
      setTimeout(() => { try{ el.classList.remove("flash"); }catch(e){} }, 3200);
    }

/* Decorative editor path only: reuse the selected tab and live display state.
   textContent keeps project names inert; no timers, commands or saved fields. */
function renderEditorBreadcrumb(){
  if(document.body.classList.contains("strip")) return;
  const tabEl = document.getElementById("editor-breadcrumb-tab");

/* メニュー刷新 P1: タブバッジ（買えるものがある/新しい依頼があるタブに赤ドット。
   判定は既存の afford 系ヘルパの流用のみ。失敗しても描画を止めないよう握りつぶす） */
function updateTabBadges(){
  try{
    const want = {};
    if(S.requests && S.requests.length && !S.activeRequest) want.requests = S.requests.length;
    const ss = staffSums();
    if(ss.count < staffCap() && Object.keys(STAFF_ROLES).some(r => hireCost(r) <= S.coins)) want.staff = 1;
    if(RESEARCH_DEFS.some(d => !S.research[d.id] && d.cost <= S.rp)) want.research = 1;
    if(UPGRADE_DEFS.some(d => (S.upgrades[d.id]||0) < d.max && upgradeCost(d, S.upgrades[d.id]||0) <= S.coins)) want.factory = 1;
    if(CLICK_DEFS.some(d => (S.clickUp[d.id]||0) < d.max && clickCost(d, S.clickUp[d.id]||0) <= S.coins)) want.click = 1;
    for(const b of tabsEl.children){
      const id = b.dataset && b.dataset.tab;
      let bd = null;
      for(const c of b.children) if(c.className === "tab-badge" || c.className === "tab-badge new") bd = c;
      /* チュートリアル導線: ロック中のタブにバッジは出さない (シルエット +
         🔒 だけが手がかり。開いたタブでは、解放されたてで未訪問なら 🆕 を
         通常の赤ドットより優先して出す。訪問すると消えて通常表示に戻る) */
      const tabLockedNow = tutTabLocked(id);
      let isNew = false;
      if(S.tut && !S.tut.skipped && !tabLockedNow){
        const keys = TUT_FRESH[id] || [];
        isNew = keys.some(k => parseInt(k.split(":")[1], 10) <= tutEffStage() && !(S.tut.seen || {})["visit:" + k]);
      }
      if(isNew){
        if(!bd){ bd = document.createElement("span"); b.appendChild(bd); }
        bd.className = "tab-badge new";
        bd.textContent = "🆕";
        bd.style.display = "";
      } else if(want[id] && !tabLockedNow){
        if(!bd){ bd = document.createElement("span"); b.appendChild(bd); }
        bd.className = "tab-badge";
        bd.textContent = want[id] > 1 ? String(want[id]) : "";
        bd.style.display = "";
      } else if(bd){ bd.style.display = "none"; }
    }
  }catch(e){}
}
/* ---------- IA コンパクト化: 折りたたみセクション ----------
   低頻度のまとまりを既定で閉じて置くための共通部品。開閉状態はセッション内
   だけ保持する (panelFold)。中身は閉じていても常に描画する (CSS で隠すだけ)
   ので、data-fix ジャンプやスモークの innerHTML 契約は不変。
   defOpen は「まだ触られていないときの既定」。ゲーム状態から決める */
const panelFold = {};
function foldIsOpen(key, defOpen){ return (key in panelFold) ? panelFold[key] : !!defOpen; }
function toggleFold(key, defOpen){
  panelFold[key] = !foldIsOpen(key, defOpen);
  renderPanel();
}
function foldSec(key, defOpen, title, summary, bodyHTML){
  const open = foldIsOpen(key, defOpen);
  return "<div class='fold" + (open ? "" : " closed") + "' data-fold='" + key + "'>" +
    "<button type='button' class='fold-head' onclick='toggleFold(\"" + key + "\"," + (defOpen ? 1 : 0) + ")'>" +
    "<span class='fold-arrow'>" + (open ? "▾" : "▸") + "</span><span>" + title + "</span>" +
    (summary ? "<span class='fold-sum'>" + summary + "</span>" : "") + "</button>" +
    "<div class='fold-body'>" + bodyHTML + "</div></div>";
}
/* 大きい数字のスタットブロック (数値は文章でなく数字そのものを見せる) */

/* スタッフカード用: スプライト (canvas) の data URL 化。無い/失敗時は空文字。
   sakuri作画 ANIMS がある毛柄はアニメ1フレーム目 (48×40)、他は sit 静止画 */
const sprUrlCache = {};
function spriteURL(name){
  if(name in sprUrlCache) return sprUrlCache[name];
  let url = "";
  const cv = spriteCache[name];
  if(cv && typeof cv.toDataURL === "function"){ try{ url = cv.toDataURL(); }catch(e){ url = ""; } }
  sprUrlCache[name] = url;
  return url;
}
function staffPortrait(coat){
  let name = "staff_" + coat + "_sit";
  const a = ANIMS["staff_" + coat + "_sit"];
  if(a && a.frames && a.frames.length && hasSprite(a.frames[0])) name = a.frames[0];
  const url = spriteURL(name);
  if(url) return "<img src='" + url + "' alt='" + (COAT_NAMES[coat] || "") + "'>";
  return "<span class='coatdot big' style='background:" + ((COAT_COLORS[coat] || {}).body || "#ccc") + "'></span>";
}
function kv(k,v){ return "<div class='kv'><span>"+k+"</span><b>"+v+"</b></div>"; }

/* Sprint 2: サウンド設定。トグルは現在の実効状態を反転して明示保存する
   （帯⇔フルの自動既定より、明示した設定が常に優先される） */

/* 帯の大きさ。v2.4.6 で基準を変更 (sakuri 指示): 旧 70% を新 100% (標準) とし、
   S.settings.stripSize は新基準の相対値 (1 = 帯の高さ 147px 相当)。
   Rust へは実効倍率 (0.7 × 相対値) を送る。帯 (owner) だけが Rust へ送り、
   メニュー (viewer) からは VERBS 経由で帯が実行する */
const STRIP_SIZE_BASE = 0.7;
/* 旧絶対倍率 (210px 基準) → 新基準の相対値への変換 (load の移行用) */
function migrateStripSize(oldAbs){
  return Math.min(1.45, Math.max(0.7, oldAbs / STRIP_SIZE_BASE));
}
function setStripSize(v){
  const n = Number(v);
  if(!isFinite(n)) return;
  S.settings.stripSize = Math.min(1.45, Math.max(0.7, n));
  save(); applyStripScale(); renderPanel();
  if(!IS_VIEWER) say("帯の大きさを " + Math.round(S.settings.stripSize * 100) + "% にしたにゃ");
}
function applyStripScale(){
  if(IS_VIEWER || !inTauri()) return;
  tauriCmd("set_strip_scale", { scale: STRIP_SIZE_BASE * (S.settings.stripSize || 1) });
}
function toggleSound(){
  S.settings.sound = !SoundKit.enabled();
  SoundKit.unlock();   /* ボタンのクリック自体がユーザー操作なので、その場で鳴らせる */
  save(); renderPanel();
  if(S.settings.sound) SoundKit.play("purchase");
}
function setSoundVol(v){
  S.settings.soundVol = Math.min(1, Math.max(0, (parseInt(v, 10) || 0) / 100));
  SoundKit.applyVolume();

}
/* ---------- Sprint 4: セーブの書き出し／読み込み ----------
   書き出しは localStorage の現物を JSON ファイルに。読み込みは形だけを
   軽く検証してから load() に通す（壊れた/別物のファイルで状態を壊さない） */
function serializeSave(){
  save();
  try { return localStorage.getItem(SAVE_KEY) || ""; } catch(e){ return ""; }
}
/* ダウンロード実行だけを切り出した共通部品 (UI 操作は呼び出し側の領分)。
   solo/owner の exportSave と、コマンド経由でテキストを受け取った viewer の両方が使う */
function downloadSaveText(text){
  try {
    const blob = new Blob([text], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "miyuke-save.json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return true;
  } catch(e){ return false; }
}
function exportSave(){
  const text = serializeSave();
  if(!text){ say("セーブが見つからないにゃ"); return; }
  if(downloadSaveText(text)){
    addLog("💾 セーブデータを書き出した");
    say("セーブを書き出したにゃ");
  } else say("書き出しに失敗したにゃ");
}
function importSaveText(text){
  let obj = null;
  try { obj = JSON.parse(text); } catch(e){ return false; }
  if(!obj || typeof obj !== "object" || Array.isArray(obj)) return false;
  if(typeof obj.coins !== "number" && !obj.totals) return false;

/* ---------- Sprint 4: コーディング速度は「集中力」連動（sakuri 方向転換） ----------
   当初は入力レート連動で実装したが、sakuri の指定で変更: カタカタの速さは
   やる気＝集中力ゲージで決まる。集中力が低いと 0.5 倍、満タンで 2 倍。
   下限があるので止まって見えることはない。
   仕組みは ANIMS 汎用: 基準名ごとにレートドライバを登録しておき、
   ランタイムがその倍率でアニメ時計を進める。sakuri の本番コーディング絵
   (miyuke_code_a = 4フレーム版) が来ても、この表に載っているだけで
   同じ速度ロジックを継承する（描画側の特例は作らない） */
function concentrationFactor(){
  const c = Math.max(0, Math.min(100, S.concentration || 0));
  return 0.5 + 1.5 * (c / 100);
}
const ANIM_RATES = { concentration: () => concentrationFactor() };
const ANIM_RATE_DRIVERS = {
  miyuke_code_a: "concentration",
  miyuke_code_b: "concentration"
};
function animRateFor(base){
  const d = ANIM_RATE_DRIVERS[base];
  return d && ANIM_RATES[d] ? ANIM_RATES[d]() : 1;
}
/* ドライバ付き ANIMS の専用時計: 状態に入るたびリセットし、
   実時間 × 現在のレート で積算する（レートが途中で変わっても滑らか） */
const animClock = { base: null, entered: 0, acc: 0, last: 0 };
function drivenElapsed(base){
  const now = Date.now();
  if(animClock.base !== base || animClock.entered !== stateEnteredAt){
    animClock.base = base; animClock.entered = stateEnteredAt;
    animClock.acc = 0; animClock.last = now;
  }
  const dt = Math.min(1000, now - animClock.last);
  animClock.last = now;
  animClock.acc += dt * animRateFor(base);
  return animClock.acc;
}
/* 手続き描画側の a/b トグル（前足・体の揺れ）も同じ集中力ドライバで進める */
let codePhaseMs = 0;       /* コーディングアニメの位相 (ms) */
function advanceCodePhase(dtMs){
  codePhaseMs += dtMs * concentrationFactor();
}
function codeFrameBit(){ return Math.floor(codePhaseMs / 300) % 2; }
let lastRenderAt = 0;

/* 入力パルスの記録（Phase 2 の継ぎ目）。アニメ速度にはもう使わない */
let inputHits = [];        /* 入力パルスの時刻 (ms)。直近4秒だけ保持 */
function noteInput(){
  const now = Date.now();
  inputHits.push(now);
  while(inputHits.length && now - inputHits[0] > 4000) inputHits.shift();
  if(inputHits.length > 240) inputHits.splice(0, inputHits.length - 240);
}

/* ---------- Phase 2: OS全体の入力集計（Tauri デスクトップ版のみ） ----------
   Rust 側（rdev）が OS 全体の「打鍵の回数・クリックの回数・カーソルの移動距離」
   だけを数え、約5秒ごとに "input-activity" イベントで集計を送ってくる。
   どのキーか・何を打ったかは Rust 側でも一切見ていない。既定は OFF で、
   設定で明示的に ON にしたときだけ Rust 側の集計が始まる。
   ON の間はページ内の打鍵／カーソル集計と二重に数えない（OS 側が同じ入力を
   見ているため）。ページ内の応援クリックは別系統なので影響しない。 */
let osInputLast = { keys:0, distPx:0, clicks:0, at:0 };   /* 直近に届いた OS 集計（設定画面の表示用） */
let osInputWanted = false;   /* ページが Rust へ要求した状態（= settings.inputCount の実効値） */
function inTauri(){ return !!window.__TAURI__; }
function osCountingActive(){ return osInputWanted; }
/* v2.4.1: invoke 無応答時の beacon フォールバック (ブートストラップ側と同方式) */
const BEACON_CMDS = {
  open_menu: function(a){ return ["open-menu", (a && a.tab) ? a.tab : null]; },
  set_mode_full: function(){ return ["open-menu", null]; },
  hide_main_window: function(){ return ["hide-strip", null]; },
  hide_strip_window: function(){ return ["hide-strip", null]; }
};
function beaconCmd(c, t){
  try{
    const B = window.__MIYUKE_BEACON__;
    if(!B) return;
    const u = "http://127.0.0.1:" + B.port + "/cmd?k=" + B.token + "&c=" + c + (t ? "&t=" + encodeURIComponent(t) : "");
    fetch(u, { mode: "cors" }).catch(function(){});
  }catch(e){}
}
function tauriCmd(cmd, args){
  try{
    const T = window.__TAURI__;
    if(!T) return null;
    const inv = (T.core && T.core.invoke) ? T.core.invoke.bind(T.core) : T.invoke;
    const p = inv(cmd, args);
    if(p && p.catch) p.catch(function(){});
    const bc = BEACON_CMDS[cmd];
    if(p && bc){
      let settled = false;
      const mark = function(){ settled = true; };
      try{ p.then(mark, mark); }catch(e){}
      setTimeout(function(){ if(!settled){ const pair = bc(args); beaconCmd(pair[0], pair[1]); } }, 700);
    }
    return p;
  }catch(e){ return null; }
}
/* 設定値を Rust 側へ反映する（ブラウザでは何もしない） */
function applyInputCounting(){
  osInputWanted = !!(S.settings && S.settings.inputCount);
  if(!inTauri()) return;
  tauriCmd("set_input_counting", { enabled: osInputWanted });
}
/* Rust からの集計を、ページ内集計と同じブースト材料（keysAcc / cursorAcc / clicksAcc）に流す。
   換算式と1分上限は tick 側の既存処理（boostGate）がそのまま担う */
function feedOsActivity(p){
  if(!p) return;
  const keys = Math.max(0, Math.floor(Number(p.keys) || 0));
  const dist = Math.max(0, Number(p.distPx) || 0);
  const clicks = Math.max(0, Math.floor(Number(p.clicks) || 0));
  osInputLast = { keys: keys, distPx: dist, clicks: clicks, at: Date.now() };
  if(S.settings.pauseInput) return;   /* 一時停止中はページ内と同じく集計しない */
  if(keys > 0 || dist > 0 || clicks > 0){
    keysAcc += keys; cursorAcc += dist; clicksAcc += clicks;
    S.totals.keys += keys; S.today.keys += keys;
    S.totals.cursorPx += dist; S.today.cursorPx += dist;
    /* OSクリックはブースト材料（clicksAcc）にだけ流す。S.totals.clicks は
       応援クリックの実績系なので混ぜない（レーンA・clicksPerDP 配線） */
    lastInputAt = Date.now();
    noteInput();
  }
}
/* 起動時: イベント購読を張り、保存済み設定が ON なら集計を開始する。
   viewer は input-activity を購読しない (Rust の broadcast が両窓に届くため、
   購読すると OS 集計が二重計数になる。設計 §5.2) */
function initInputCounting(){
  if(IS_VIEWER) return;
  if(!inTauri()) return;
  try{
    const T = window.__TAURI__;
    if(T.event && T.event.listen){
      const pr = T.event.listen("input-activity", function(ev){ feedOsActivity(ev && ev.payload); });
      if(pr && pr.catch) pr.catch(function(){});
    }
  }catch(e){}
  applyInputCounting();
}
